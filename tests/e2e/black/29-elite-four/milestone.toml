# Proves the Elite Four: Shauntal, Grimsley, Marshal and Caitlin in any order, then the way to the Champion's room.
# Start: the Pokémon League (zone 136) -> end: the League's centre (zone 137) after the fourth win, 0x40A1 = 1.
