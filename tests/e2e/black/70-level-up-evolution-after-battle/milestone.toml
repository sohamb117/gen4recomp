# Level-up evolution at the end of a battle: a Lillipup at the base of lv 15 holding an Exp. Share gains half of each
# wild battle the lead wins until lv 16, and evolves into Herdier after the battle that levels it.
# Start: Route 16 (zone 383) east of the Nimbasa Gate (16's end + start.recipe) -> end: Route 16's grass, slot 1 Herdier lv 16.
title = "Level-up evolution after battle: Lillipup -> Herdier"
priority = "P0"
version = "both"
estimate = 17689
refs = [
  "zone_event 62 warp 2 (447,437) -> zone 92; zone_event 383 warp 1 (454,437) -> zone 92 warp 0 (Route 16's grass east of Nimbasa)",
  "Lillipup (506) evolves at lv 16 into Herdier (507) [INFERENCE: species data, not decoded]",
]
notes = "Six battle rounds won by the lead Darmanitan (lv 39), the Lillipup on the bench gaining its Exp. Share half: a lv 15 Lillipup leading lost to Route 16's lv 20 wild Pokemon on core-bwm2 (a Minccino; fleeing with it, a Liepard fainted it), so which wild Pokemon came decided the run. Half a lv 20 battle's experience is about 150 of the 500 lv 15 -> 16 needs (Medium Slow), so it evolves after the third or fourth win; the rounds after it change nothing the expect reads. Measured from the start save (CONTINUE included): Black 17366, White 17689 frames on the core of 2026-10-10 with the ARM7 VBlank-count fix (build/core-bwm2, instant text). np_save5 set-mon makes the Pokemon at the base experience of its level (README, Black and White): lv 15 Medium Slow is 2035 exp, lv 16 2535. grind (until lv 16) reads the lead's level, not the bench's; fixed rounds of repeat + auto_battle + advance_text, where advance_text's A presses carry the evolution scene. Evolution is code, no script."

