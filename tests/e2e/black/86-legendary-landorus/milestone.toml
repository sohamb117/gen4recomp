# Landorus at the Abundant Shrine (post-game, Route 14): with Tornadus and Thundurus in the party the children
# appear, the shrine calls Landorus, and it is fought.
# Start: the player's room (zone 391, 32's end) -> end: the Abundant Shrine (zone 376), Landorus caught.
title = "Landorus (Abundant Shrine)"
status = "planned"
priority = "P2"
version = "both"
estimate = 30000   # [INFERENCE] frames, not measured
refs = [
  "zone 376 level type 2 -> scr 0752 script 3: @0x0016 SetFlag 0x2ED, @0x0060/@0x0089 Cmd1BD 0 (White) / 1 (Black), var 0x8021 == 3 -> @0x0079/@0x00A2 SetVar 0x40CE 1, ClearFlag 0x2ED (the children)",
  "zone_event 376 trigger 0 (21,17) 3x1 var 0x40CE == 1 -> scr 0752 script 1 (msg 408 #0-#10); @0x030A SetVar 0x40CE 2, @0x0310 SetFlag 0x2ED",
  "zone_event 376 bg 0 (22,12) (the shrine) -> scr 0752 script 2: party scan Cmd0FE for Tornadus (641) and Thundurus (642); Black needs its Tornadus to pass Cmd113 (== 1), White its Thundurus; L_0619 @0x0619 ClearFlag 0x2EE, msg 408 #13 'Tornadus and Thundurus are struggling inside their Poke Balls!', @0x069C SetVar 0x40CE 3, @0x06A2 SetFlag 0x13D",
  "zone_event 376 object 3 gfx 0x78 (22,0) hidden by flag 0x2EE -> scr 0752 script 5: @0x06DB WildBattle Landorus (645) lv 70; won -> @0x06FE SetFlag 0x2EE, @0x0702 SetVar 0x40CE 4; caught -> @0x0759 SetFlag 0x139",
  "zone_event 376 warp 0 (50,54) -> zone 374 (Route 14)",
]
notes = "P2: the shrine wants both roamers, one of them from the other version (the other version's legendary; scr 0752 script 2), so offline the recipe makes both with np_save5 set-mon. Cmd113 checks the own version's roamer [INFERENCE: owner or origin]; set-mon makes it with the save's trainer, which may or may not pass: if not, the own roamer must be caught (85) and this chains from there. The game clear's flag 0x966 (scr 0866 @0x0328) makes CONTINUE take the continue warp to zone 391 (5,6) whatever location the save holds (34's notes), so a set-location on 32's end save is overridden: no location line until this chains from 34's end. CONTINUE lands in the bedroom; going down to zone 390 runs Looker's forced scene first (zone 390 level script var 0x4085 == 2 -> scr 0780 script 4; @0x05E8 the Super Rod, @0x06D8 0x4085 3, @0x06E8 0x4080 4), and leaving the house runs Cedric Juniper's (zone 389 level script 0x4080 == 4 -> scr 0778 script 15)."

[start]
from = "34-postgame-poke-transfer-lab"
recipe = "start.recipe"

[expect]
map = 376
flags = ["0x13D", "0x2EE", "0x139"]
save = [
  "any(m[\"species\"] == 645 for m in s[\"party\"]) or any(m[\"species\"] == 645 for b in s[\"boxes\"] for m in b[\"mons\"])",
]

[expect.vars]
"0x40CE" = 4
