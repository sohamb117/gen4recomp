# Fishing with the Super Rod: face water, register the rod on Y, cast, reel in at the '!' (cast again until one bites), fight what bites.
# Start: Nuvema Town (zone 389, 66's end) -> end: Route 1 (zone 317) at the pond (781,708) after one fished wild battle.
title = "Fishing: the Super Rod at Route 1's pond"
priority = "P0"
version = "black"
estimate = 9512
refs = [
  "scr 0780 @0x05E8 CallStd 2805 Super Rod (Looker; 66)",
  "msg 429 #41 (Looker): 'Face the water and employ the rod! ... When it occurs that these Pokemon bite, '!' will indicate. Immediately, reel in!'",
  "zone 317 (Route 1): the pond west of the road, its east bank (781,707..708) above the wooden fence (scouted: the rod casts there facing left)",
]
notes = "Measured from the start save (CONTINUE included): Black 9512 frames on the core of 2026-10-10 with the ARM7 VBlank-count fix (build/core-bwm2, instant text). B/W have one rod, the Super Rod, given post-game (66); no script runs fishing (the Bag's item and the field) [INFERENCE]. Nuvema Town's sea is behind the south fence: the rod there gives Juniper's 'There's a time and place' (scouted at (780,761) facing down), so the cast is at Route 1's pond, the nearest fishable water. The Bag is reached through the X menu by touch (BAG, the left middle button), the Key Items pocket by the D-pad (left twice: the first press only shows the cursor; Items -> Key Items wraps), the Super Rod is the pocket's first entry and its menu's first is USE. bots.py's fish bot is GBA-only (the guest's PC_TRACE_FISH trace); on B/W nothing reports the bite, so the reel-in is a fixed delay after the cast. Whether a cast bites and when is the game's luck: a fixed delay after one Bag USE (A at 320 frames, scouted on core-bwm's 66 end saves) stopped landing on Black when the 66 before it changed, and a cast can bring 'Not even a nibble...'. So the rod is registered on Y and cast again until a battle starts (repeat); A 270 frames after Y (the Bag's closing no longer comes first) [INFERENCE: the window is near the Bag-USE one less the Bag's fade]. Fishing sets nothing in the save, so [expect] is the battle and the place. Chained from 66 so the scenes there are not replayed."

[start]
from = "66-postgame-looker-super-rod-national-dex"

[run]
frames = 25000   # more than 1.5x the estimate: the cast loop may take up to 25 casts of ~430 frames (the game's luck)

[[step]]
do = "wait_field"

[[step]]
do = "walk_to"
x = 781
z = 708
face = "left"
on_battle = "flee"
max = 3000
note = "north out of Nuvema onto Route 1 (zone 317), the pond's east bank above the fence, facing the water"

[[step]]
do = "press"
keys = "x"
hold = 4
gap = 40
note = "the X menu"

[[step]]
do = "tap"
x = 64
y = 94
note = "BAG (the left button of the menu's second row)"

[[step]]
do = "wait_frames"
n = 90

[[step]]
do = "press"
keys = "left"
hold = 4
gap = 30
note = "the first D-pad press shows the cursor"

[[step]]
do = "press"
keys = "left"
hold = 4
gap = 40
note = "Items -> Key Items (wraps); the cursor on its first entry, the Super Rod"

[[step]]
do = "press"
keys = "a"
hold = 4
gap = 40
note = "the Super Rod's menu: USE, REGISTER, CANCEL"

[[step]]
do = "press"
keys = "down"
hold = 4
gap = 30
note = "the menu's second entry, REGISTER"

[[step]]
do = "press"
keys = "a"
hold = 4
gap = 90
shot = "registered"
note = "REGISTER: the Super Rod on the Y button (its Key Items box ticked)"

[[step]]
do = "press"
keys = "b"
hold = 4
gap = 60
times = 2
note = "out of the Bag and the X menu"

[[step]]
do = "wait_field"

[[step]]
do = "repeat"
until = "in_battle=1"
max_rounds = 25
steps = [
  { do = "press", keys = "y", hold = 4, gap = 0, if = "field_ready=1" },
  { do = "wait_frames", n = 270 },
  { do = "press", keys = "a", hold = 4, gap = 40, if = "field_ready=0" },
  { do = "press", keys = "a", hold = 4, gap = 40, if = "field_ready=0" },
  { do = "press", keys = "a", hold = 4, gap = 40, if = "field_ready=0" },
  { do = "press", keys = "a", hold = 4, gap = 60, if = "field_ready=0" },
]
note = "cast with Y, reel in with A 270 frames later, A through 'Landed a Pokemon!' into the battle; a cast with no bite ('Not even a nibble...') or a missed one is cast again. The A presses wait for the field to be held, so no A lands on the water (Surf's prompt)"

[[step]]
do = "auto_battle"
snap = "fished-battle"

[[step]]
do = "wait_field"
shot = "after"

[expect]
map = 317
position = [781, 708]
battles = 1
save = [
  "any(i[\"item\"] == 447 for i in s[\"bag\"][\"key_items\"])",
]
