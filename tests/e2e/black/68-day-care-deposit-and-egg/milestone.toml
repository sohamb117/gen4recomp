# Route 3's Day Care: the Day-Care Lady (inside) takes two Pokemon, the player walks until an egg is laid, and the
# Day-Care Man (outside) hands it over. The man and the second deposit slot appear only after Nimbasa's scene (15).
# Start: Route 3 (zone 321) below the Day Care door (749,555) -> end: Route 3 by the man, a Patrat egg in the party.
title = "Day Care: two deposits with the lady and an egg from the man"
status = "planned"
priority = "P0"
version = "both"
estimate = 25000   # [INFERENCE] frames, not measured
refs = [
  "zone_event 321 warp 2 (749,555) -> zone 323 (the Day Care); zone_event 323 warps 0-2 (5..7,13) -> zone 321 warp 2",
  "zone_event 323 object 0 gfx 0x1D (6,7) -> script id 2201 -> scr 0856 script 2 (the Day-Care Lady): @0x0301 SetFlag 0x70 on the first talk (msg 426 #12), the menu Cmd0B2/Cmd0AF, L_04A1 / L_0884 deposit and withdraw",
  "scr 0856 L_004C: @0x0054 CheckFlagToVar 0x70, @0x005A CheckFlagToVar 0x99 -> var 0x8028 = 2 deposit slots with flag 0x99, else 1",
  "zone_event 321 object 0 gfx 0x1C (748,556) hidden by flag 0x271 -> script id 2200 -> scr 0856 script 1 (the Day-Care Man): var 0x8026 == 1 (an egg) -> msg 426 #6, YES/NO, @0x0146 Cmd0EC (the egg into the party), @0x0151 msg 426 #7",
  "scr 0124 (Nimbasa, 15) @0x0401 ClearFlag 0x271 (the man on Route 3), @0x0405 SetFlag 0x99 (two slots); msg 67 #8 'Day-Care Man: I have a Day Care on Route 3!'",
]
notes = "Before 15 the Day Care holds one Pokemon and the man is not on Route 3 (refs), so it chains from 16. Deposits: the Cut carrier Patrat (slot 3) and a Ditto the recipe puts in Tepig's slot; the egg is a Patrat (504) [INFERENCE: Ditto + Patrat, compatible regardless of gender]. The day care's contents are not in np_save5's dump; the party is."

[start]
from = "16-nimbasa-elesa-bolt-badge"
recipe = "start.recipe"

[run]
frames = 60000

[[step]]
do = "wait_field"
shot = "route3"

[[step]]
do = "walk_to"
x = 749
z = 555
note = "zone_event 321 warp 2 (749,555) -> the Day Care (zone 323)"

[[step]]
do = "wait_map"
map = 323

[[step]]
do = "walk_to"
x = 6
z = 9
face = "up"
note = "below the counter, facing the Day-Care Lady (zone_event 323 object 0 (6,7))"

[[step]]
do = "press"
keys = "a"
hold = 4
gap = 40
times = 4
note = "talk (scr 0856 script 2: msg 426 #12, @0x0301 SetFlag 0x70), A on the text, A on the menu's first entry 'Leave Pokemon' (Cmd0AF 0x1E), A on msg 426 #17 'Which Pokemon should we raise for you?'"

[[step]]
do = "wait_frames"
n = 110
note = "the party screen ('Deposit which Pokemon?'): touch panels, left column slots 0/2/4, right column 1/3/5"

[[step]]
do = "tap"
x = 190
y = 91
gap = 52
note = "slot 3 (right column, middle): Patrat"

[[step]]
do = "tap"
x = 190
y = 133
gap = 132
shot = "patrat-stored"
note = "STORE (the panel menu: STORE, SUMMARY, QUIT): msg 426 #19 'Fine, we'll raise your Patrat for a while.'"

[[step]]
