keys = "a"
hold = 4
gap = 40
times = 2
note = "A on msg 426 #19, then YES to msg 426 #21 'We can raise two of your Pokemon. Would you like us to raise another?' (two slots: flag 0x99)"

[[step]]
do = "press"
keys = "a"
hold = 4
gap = 150
note = "A on msg 426 #17: the party screen again"

[[step]]
