# The roaming Tornadus (Black): after the Legend Badge the old woman on Route 7 takes the player into her house;
# leaving it, the storm and Tornadus fly off and roam. In the evening it roams north Unova (Route 6, 7, 8): the run
# paces Route 7's tall grass, fleeing wild battles (each one's end moves the roamer) until Tornadus shows up, and
# catches it with the Master Ball.
# Start: Route 7's trade house (zone 343, 27's end + start.recipe) -> end: Route 7 (zone 337), Tornadus caught.
title = "Roamer: Tornadus starts roaming and is caught (Black)"
priority = "P1"
version = "black"
estimate = 20272   # measured from 27's end save + start.recipe (CONTINUE included): Black 20272 (core-bwm2)
refs = [
  "scr 0264 (Opelucid Gate, 27) @0x01AA SetVar 0x40C0 1, @0x01B0 SetFlag 0x96F",
  "zone_event 337 trigger 0 (130,243) 1x5 var 0x40C0 == 1 -> scr 0674 script 6 (msg 369 #5 'My, my... That Pokemon has come again, too.'); @0x040F Cmd021 1, @0x0413 Warp zone 344 (the house; Cmd021: the house's script 1 runs on arrival [INFERENCE])",
  "scr 0688 script 1 (zone 344): msg 376 #2-#11 (the soup, the storm Pokemon), @0x0175 SetVar 0x40C0 2, @0x017B ClearFlag 0x96F",
  "msg 376 #11 'In one day, it can make a lap around the entire Unova region. In the mornings, it's in the south, and in the evenings, it's in the north. It shows up here in the evenings!'",
  "zone 337 level type 1: var 0x40C0 == 2 -> scr 0674 script 7 (the storm): @0x051A GetVersion; Black: @0x0531 Cmd069 gfx 0x71, @0x05B5 Cmd136 7, @0x05E0 Cmd04A 9; @0x0604 msg 369 #10 'Whew, what a storm!'; @0x0629 SetVar 0x40C0 3; @0x0642 Cmd1BC 1 (the roamer starts: its slot appears in the save then)",
  "the roamer's slot (scouting, Black: save offset 0x21B18, RAM 0x0223D6C4 on core-bwm): u16 zone, u16 0x13, PID, IVs, u16 species 641, u16 HP, u16 level 40, ..., u8 route index; it is rewritten on every zone change and at every battle's end: at 12:00 the zones drawn were 326/329/383/none (south), at 19:30 331/337/345/none (north: Route 6, 7, 8)",
  "the chain's 27-34 end saves hold 0x40C0 = 1 (no story milestone visits the house)",
]
notes = "Measured from the start save (CONTINUE included): Black 20272 frames on the core of 2026-10-10 with the ARM7 VBlank-count fix (build/core-bwm2, instant text). Black only (White's twin: white/85-roamer-thundurus); the scripts are one file in both ROMs, branching on GetVersion. The roamer's position is not in np_save5's dump (refs: where scouting found it). The clock is 19:30 so the roamer's draws include Route 7 (msg 376 #11; scouting: at noon it never was). Entering the house (zone 344, named Route 7 too) does not move it; a zone change or a battle's end does, and a grass encounter while it is on Route 7 is the roamer only sometimes (scouting: three such battles were Tranquill/Watchog before it came). So which wild battle is the roamer is the RNG's: the hunt bot flees every other battle and stops at the first one against it (a fixed count of fled battles broke when the core's luck moved). The recipe starts in the trade house beside the old woman's (set-location keeps the saved zone's objects, so Route 7 is entered through the door). 27's bag holds the Master Ball (first in the items pocket); the full party sends Tornadus to the Box."

[start]
from = "27-opelucid-drayden-legend-badge"
recipe = "start.recipe"

[run]
frames = 100000   # more than 1.5x the estimate: the hunt step may take up to its max of 80000 frames (the game's luck)
clock = "2026-10-09 19:30:00"   # evening: the roamer roams north Unova, Route 7 included (msg 376 #11)

[[step]]
do = "moves"
dirs = [["D", 2]]
note = "out of the trade house (zone_event 343 warp 0 (5,9) 3x1) onto Route 7 (102,261)"

[[step]]
do = "wait_field"

[[step]]
do = "walk_to"
x = 129
z = 245
on_battle = "flee"
note = "west of the old woman's door (zone_event 337 warp 2 (130,242)) and the trigger below it"

[[step]]
do = "moves"
dirs = [["R", 1]]
note = "onto zone_event 337 trigger 0 (130,243..247), var 0x40C0 == 1: scr 0674 script 6, the old woman takes the player in"

[[step]]
do = "advance_text"
shot = "soup"
note = "scr 0688 script 1 in zone 344: the soup and the storm Pokemon's tale; @0x0175 0x40C0 = 2"

[[step]]
do = "walk_to"
x = 6
z = 8

[[step]]
do = "moves"
dirs = [["D", 2]]
note = "out of the house (zone_event 344 warp 0 (5,9) 3x1): Route 7's level script, var 0x40C0 == 2 -> scr 0674 script 7"

[[step]]
do = "advance_text"
shot = "storm"
note = "the storm: Tornadus flies off (@0x0629 0x40C0 = 3, @0x0642 Cmd1BC 1)"

[[step]]
do = "walk_to"
x = 123
z = 245
on_battle = "flee"
note = "west along z 244..245 to the tall grass (attribute 0x8, x 121..124, z 244..247)"

[[step]]
do = "hunt"
x = 123
z = 245
species = 641
max = 80000
note = "Route 7's grass at 19:30: the roamer's route is redrawn on every zone change and after every battle, so the battles before it are fled until one is species 641 (bots.py bot_hunt)"

[[step]]
do = "wait_frames"
n = 60
shot = "tornadus-battle"

[[step]]
do = "tap"
x = 40
y = 168
gap = 60
note = "BAG"

[[step]]
do = "tap"
x = 190
y = 48
gap = 60
note = "POKE BALLS"

[[step]]
do = "tap"
x = 64
y = 30
gap = 60
note = "the first ball, the Master Ball (27's bag lists it first)"

[[step]]
do = "tap"
x = 110
y = 174
gap = 60
note = "USE: the bag's turn comes before the roamer's flight"

[[step]]
do = "wait_frames"
n = 1000
shot = "caught"
note = "the Master Ball's throw and shakes run without input; the catch's Pokedex message then waits"

[[step]]
do = "press"
keys = "b"
until = "in_battle=0"
times = 80
gap = 30
note = "the catch; B declines the nickname; the full party sends it to the Box"

[[step]]
do = "advance_text"
note = "the Pokedex registers Tornadus"

[[step]]
do = "wait_field"
shot = "end"

[expect]
map = 337
flags_clear = ["0x96F"]
save = [
  "any(m[\"species\"] == 641 for m in s[\"party\"]) or any(m[\"species\"] == 641 for b in s[\"boxes\"] for m in b[\"mons\"])",
]

[expect.vars]
"0x40C0" = 3
