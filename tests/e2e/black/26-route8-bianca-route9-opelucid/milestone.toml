# Proves the way to Opelucid City: Fly back to Icirrus, Route 8 (Bianca's battle), Tubeline Bridge (the bikers),
# Route 9, and Opelucid's welcome by Alder (Ghetsis's speech), Iris and Drayden.
# Start: Nacrene City (zone 16, 25's end) -> end: Opelucid City (zone 120), 0x40A8 = 4.
title = "Route 8 (Bianca) and Route 9 to Opelucid City"
priority = "P0"
version = "both"
estimate = 44485
refs = [
  "Fly (the X menu's POKEMON, slot 3's FLY, Icirrus tapped and held on the town map, A): needs Icirrus's fly flag 0x9B8, which the field sets on entering Icirrus from outdoors (24 ends that way); no script sets it",
  "zone_event 113 warp 1 (184,195) -> zone 115 (Pokemon Center)",
  "zone_event 345 trigger 0 (243,180) var 0x40CB == 0 -> scr 0690 script 8; @0x0119 SetVar 0x40CB 1; @0x0144/@0x0165/@0x0173 TrainerBattle trdata #494/#495/#496 (Bianca: Stoutland, monkey, Musharna 38, starter 40)",
  "zone_event 345 warp 0 (244,180) -> zone 347; zone_event 347 warps 1-3 (15,7..9) -> zone 254 (Tubeline Bridge)",
  "zone_event 254 trigger 2 (7..24,50) var 0x40A4 == 0 -> scr 0508 script 12 (the bikers); @0x0CAB SetVar 0x40A4 1; zone_event 254 warp 1 (7..24,32) -> zone 349; zone_event 349 warp 1 (14,7..9) -> zone 348 (Route 9)",
  "zone 348 level type 1: var 0x40C6 == 0 -> scr 0696 script 6 (TM56); zone_event 131 warp 1 (15,4..6) -> zone 120",
  "zone_event 120 trigger 0 (395,173) var 0x40A8 == 0 -> scr 0240 script 1 (Alder, msg 125 #0); @0x0AA4 SetFlag 0x9B9; @0x0AAC SetVar 0x40A8 1",
  "zone_event 120 triggers 1-2 (415,167)/(415,162) var 0x40A8 == 1/2 -> scr 0240 scripts 14/15 (Iris, msg 125 #39/#40); @0x0DE6/@0x0E46 SetVar 0x40A8 2/3",
  "zone_event 120 warp 3 (418,159) -> zone 123; zone 123 level type 1: 0x40A8 == 3 -> scr 0246 script 1 (Drayden, MessageVersion); @0x0179 SetVar 0x40A8 4 (Black) / @0x013E (White)",
]
notes = "Measured from the previous end save (CONTINUE included): Black 39345, White 44485 frames on the core of 2026-10-09 (bw-script on main 2364eec77 with the armrec VRAM overlap fix, instant text). Gate exits (zones 349, 131) fire only on a press into the edge: walk_to the tile before, then moves. Opelucid's scenes swap Drayden's and Iris's lines by MessageVersion, no other branch: the dir serves White. Route from scouting."

