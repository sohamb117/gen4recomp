# Proves the Opelucid Gym (the dragon-head lifts) and Iris's Legend Badge on White, then Professor Juniper's
# Master Ball and the gate north.
# Start: Opelucid City (zone 120, 26's end) -> end: the Opelucid Gate (zone 132), 8 badges, 0x40B8 = 3.
title = "Opelucid Gym (White): Iris's Legend Badge"
priority = "P0"
version = "white"
estimate = 57479
refs = [
  "scr 0242 script 1 @0x007F GetVersion: 20 (White) -> L_0203: Iris; zone_event 121 via scr 0242 script 2 (@0x0069 SetVar 0x4020 0x5C: the leader's sprite on White)",
  "scr 0242 @0x0224 TrainerBattle trdata #132 (Iris: Fraxure 41, Druddigon 41, Haxorus 43); @0x025B GiveBadge 7 (Legend); @0x02C7 CallStd 2805 TM82; @0x0315 SetVar 0x40A9 1; @0x031B SetVar 0x40B8 1; @0x0321 SetFlag 0x978",
  "zone_event 121 triggers 0-5 (switches (6,29) (18,29) (21,27) (33,27) (36,22) (48,22), one-way ledge hops) -> scr 0242 scripts 3-8 -> L_0704 Cmd19A var 0x8020 (dragon), var 0x8022 (arm): each press toggles that arm; the two arms set where the head points",
  "zone_event 121 trainers: Webster #270, Olwen #265, Jose #271, Clara #266, Hugo #274 (scr 0242 script 12 at (32,35)), Tom #272, Dara #267, Kim #275",
  "zone_event 121 object 4 (27,2) -> scr 0242 script 1; (27,0) -> (26,45) (warp 1 -> warp 2); door (26..28,50) -> zone 120 (405,145)",
  "zone_event 120 warp 1 (425,172) -> zone 122 (Pokemon Center); warp 2 (405,144) -> zone 121 (27,50)",
  "zone_event 120 level type 1: 0x40B8 == 1 -> scr 0240 script 17; @0x0FD9 CallStd 2805 Master Ball; @0x100C SetVar 0x40B8 2",
  "zone_event 132 trigger 0 (2..7,11) var 0x40B8 == 2 -> scr 0264 script 3; @0x01A4 SetVar 0x40B8 3; @0x01AA SetVar 0x40C0 1; @0x01B0 SetFlag 0x96F",
]
notes = "Measured from the chain's 26 end save (CONTINUE included): White 57479 frames on the core of 2026-10-09 (bw-script on main 2364eec77 with the armrec VRAM overlap fix, instant text). The gym's dragon bodies and necks are rails; the six switches are ledge hops that toggle one arm of a dragon each, and a dragon's two arms set where its head (the lift) points. The route is IGN's order, tiles from the probe: rail stops are exact (a junction turns only from its exact tile), and each rail dead end takes a 16-frame press the same way before the next direction. The (18,29) switch is pressed twice and (33,27) twice. The leader's badge flag (0x978) is set by the leader's script and cleared again before the gate, so [expect] reads the badge count, TM82 and the Master Ball. Black plays black/27-opelucid-drayden-legend-badge (Drayden, trdata #133) with the same steps. The boost levels the party (levels only): unboosted, scouting reached the leader with only Sawk standing."

