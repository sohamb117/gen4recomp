# The roaming Thundurus (White): after the Legend Badge the old woman on Route 7 takes the player into her house;
# leaving it, the storm and Thundurus fly off and roam. In the evening it roams north Unova (Route 6, 7, 8): the run
# paces Route 7's tall grass, fleeing wild battles (each one's end moves the roamer) until Thundurus shows up, and
# catches it with the Master Ball.
# Start: Route 7's trade house (zone 343, 34's end + start.recipe) -> end: Route 7 (zone 337), Thundurus caught.
title = "Roamer: Thundurus starts roaming and is caught (White)"
priority = "P1"
version = "white"
estimate = 15859   # measured from 34's end save + start.recipe (CONTINUE included): White 15859 (core-bwm2)
refs = [
  "scr 0264 (Opelucid Gate, 27) @0x01AA SetVar 0x40C0 1, @0x01B0 SetFlag 0x96F",
  "zone_event 337 trigger 0 (130,243) 1x5 var 0x40C0 == 1 -> scr 0674 script 6 (msg 369 #5 'My, my... That Pokemon has come again, too.'); @0x040F Cmd021 1, @0x0413 Warp zone 344 (the house; Cmd021: the house's script 1 runs on arrival [INFERENCE])",
  "scr 0688 script 1 (zone 344): @0x00E8 MessageVersion msg 376 #5 (White: 'a Pokemon called Thundurus'); msg 376 #2-#11 (the soup, the storm Pokemon), @0x0175 SetVar 0x40C0 2, @0x017B ClearFlag 0x96F",
  "msg 376 #11 'In one day, it can make a lap around the entire Unova region. In the mornings, it's in the south, and in the evenings, it's in the north. It shows up here in the evenings!'",
  "zone 337 level type 1: var 0x40C0 == 2 -> scr 0674 script 7 (the storm): @0x051A GetVersion; White: @0x0545 Cmd069 gfx 0x72, @0x05C1 Cmd136 6, @0x05F5 Cmd04A 8; @0x0604 msg 369 #10 'Whew, what a storm!'; @0x0629 SetVar 0x40C0 3; @0x064C Cmd1BC 0 (the roamer starts)",
  "the roamer's slot (scouting on Black, black/85's refs: save offset 0x21B18, RAM 0x0223D6C4 on core-bwm): u16 zone, ..., species, level 40, u8 route index; rewritten on every zone change and at every battle's end: at 12:00 the zones drawn were 326/329/383/none (south), at 19:30 331/337/345/none (north: Route 6, 7, 8)",
  "the chain's 27-34 end saves hold 0x40C0 = 1 (no story milestone visits the house); the run starts after the credits (34's end), so the caught roamer is in a post-game save: tests/link's bw_trade_landorus trades from it, and the Abundant Shrine (89) is reached only after the credits",
]
notes = "Measured from the start save (CONTINUE included): White 15859 frames on the core of 2026-10-10 with the ARM7 VBlank-count fix (build/core-bwm2, instant text). White only (Black's twin: black/85-roamer-tornadus); the scripts are one file in both ROMs, branching on GetVersion. The roamer's position is not in np_save5's dump. The clock is 19:30 so the roamer's draws include Route 7 (msg 376 #11; Black's scouting: at noon it never was). A zone change or a battle's end moves the roamer (entering the house, zone 344, also named Route 7, does not), and a grass encounter while it is on Route 7 is the roamer only sometimes, so which wild battle is Thundurus is the RNG's: the hunt bot flees every other battle and stops at the first one against it (a fixed count of fled battles broke when the core's luck moved). The recipe starts in the trade house beside the old woman's (set-location keeps the saved zone's objects, so Route 7 is entered through the door). start.recipe puts a Master Ball first in the items pocket (34's end has none: 32 threw the story's); the full party sends Thundurus to the Box, where tests/link's bw_trade_landorus finds it."

[start]
from = "34-postgame-poke-transfer-lab"
recipe = "start.recipe"

[run]
frames = 100000   # more than 1.5x the estimate: the hunt step may take up to its max of 80000 frames (the game's luck)
clock = "2026-10-09 19:30:00"   # evening: the roamer roams north Unova, Route 7 included (msg 376 #11)

[[step]]
do = "moves"
dirs = [["D", 2]]
note = "out of the trade house (zone_event 343 warp 0 (5,9) 3x1) onto Route 7 (102,261)"

[[step]]
do = "wait_field"

[[step]]
do = "walk_to"
x = 129
z = 245
on_battle = "flee"
note = "west of the old woman's door (zone_event 337 warp 2 (130,242)) and the trigger below it"

[[step]]
do = "moves"
dirs = [["R", 1]]
note = "onto zone_event 337 trigger 0 (130,243..247), var 0x40C0 == 1: scr 0674 script 6, the old woman takes the player in"

[[step]]
do = "advance_text"
shot = "soup"
note = "scr 0688 script 1 in zone 344: the soup and the storm Pokemon's tale; @0x0175 0x40C0 = 2"

[[step]]
do = "walk_to"
x = 6
z = 8

[[step]]
do = "moves"
dirs = [["D", 2]]
note = "out of the house (zone_event 344 warp 0 (5,9) 3x1): Route 7's level script, var 0x40C0 == 2 -> scr 0674 script 7"

[[step]]
do = "advance_text"
shot = "storm"
note = "the storm: Thundurus flies off (@0x0629 0x40C0 = 3, @0x064C Cmd1BC 0)"

[[step]]
do = "walk_to"
x = 123
z = 245
on_battle = "flee"
note = "west along z 244..245 to the tall grass (attribute 0x8, x 121..124, z 244..247)"

[[step]]
do = "hunt"
x = 123
z = 245
species = 642
max = 80000
note = "Route 7's grass at 19:30: the roamer's route is redrawn on every zone change and after every battle, so the battles before it are fled until one is species 642 (bots.py bot_hunt)"

[[step]]
do = "wait_frames"
n = 60
shot = "thundurus-battle"

[[step]]
do = "tap"
x = 40
y = 168
gap = 60
note = "BAG"

[[step]]
do = "tap"
x = 190
y = 48
gap = 60
note = "POKE BALLS"

[[step]]
do = "tap"
x = 64
y = 30
gap = 60
note = "the first ball, the Master Ball (start.recipe puts it first in the items pocket)"

[[step]]
do = "tap"
x = 110
y = 174
gap = 60
note = "USE: the bag's turn comes before the roamer's flight"

[[step]]
do = "wait_frames"
n = 1000
shot = "caught"
note = "the Master Ball's throw and shakes run without input; the catch's Pokedex message then waits"

[[step]]
do = "press"
keys = "b"
until = "in_battle=0"
times = 80
gap = 30
note = "the catch; B declines the nickname; the full party sends it to the Box"

[[step]]
do = "advance_text"
note = "the Pokedex registers Thundurus"

[[step]]
do = "wait_field"
shot = "end"

[expect]
map = 337
flags_clear = ["0x96F"]
save = [
  "any(m[\"species\"] == 642 for m in s[\"party\"]) or any(m[\"species\"] == 642 for b in s[\"boxes\"] for m in b[\"mons\"])",
]

[expect.vars]
"0x40C0" = 3
