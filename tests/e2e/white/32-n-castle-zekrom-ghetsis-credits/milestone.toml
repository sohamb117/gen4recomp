# Proves the end of the story on White: the throne room, Zekrom awakening from the stone and caught, N's battle with
# Reshiram, Ghetsis's battle, N's farewell, the credits and the game's own save and reset after them.
# Start: the throne room's entrance (zone 278, 31's end) -> end: the game's save after the credits, 0x40A2 = 3.
title = "N's Castle (White): Zekrom, N, Ghetsis and the credits"
status = "planned"
priority = "P0"
version = "white"
estimate = 80000
refs = [
  "zone_event 278 triggers 0-3 (14,47)/(14,42) on var 0x40B6 0/1/3/5 -> scr 0556 scripts 2/3/4/16; script 3 @0x0342 SetVar 0x40B6 2 (N calls his dragon; the stone answers)",
  "scr 0556 script 8 (talking to the legendary): @0x0CDC unless var 0x8020 == 21 (Black) -> @0x0CFA WildBattle Reshiram (643) lv 50 / L_0D08 (White) @0x0D13 WildBattle Zekrom (644) lv 50; @0x0B30 SetVar 0x40B6 3; @0x0B49 L_187E: a full party sends it to the Box, then msg 301 #101-#105 offer the swap",
  "scr 0556 @0x0981 TrainerBattle trdata #587 (Black: N with Zekrom 52) / @0x0973 #586 (White: N with Reshiram 52); @0x09EF SetVar 0x40B6 4; @0x09F5 Cmd021 0xF -> script 15 @0x0DEC SetVar 0x40B6 5, @0x0DF2 SetVar 0x40A2 2",
  "scr 0556 @0x1186 TrainerBattle trdata #232 (Ghetsis: Cofagrigus, Bouffalant, Seismitoad, Bisharp, Eelektross 52, Hydreigon 54); @0x1210 BlackOut on a loss; @0x1555-@0x15E7 N's farewell (msg 301 #75-#81); @0x15FC Cmd156 0: the ending",
  "scr 0866 @0x0457 SetVar 0x40A2 3 (the game clear), then the credits; the game saves itself and resets (OS_ResetSystem)",
  "flag 0x133: the legendary caught (scr 0556 @0x0D55)",
]
notes = "One uninterrupted script chain (scr 0556) runs from talking to the legendary through the capture, N's battle, Ghetsis's battle and N's farewell to the ending, so the story's last milestone is a single one per version: 0x40B6 = 5 is never seen in the field, and the old 33-ghetsis-ending is folded in here (docs/BW_PLAN.md). The run ends with wait_reset; [expect] reads the save the game writes after the credits. [INFERENCE] estimate."

[start]
from = "prev"
boost = "boost.recipe"

[run]
save = "none"
frames = 120000

[[step]]
do = "walk_to"
x = 24
z = 9
note = "zone 277 to the throne room's door"

[[step]]
do = "moves"
dirs = [["U", 1]]
note = "into zone 278"

[[step]]
do = "wait_field"

[[step]]
do = "walk_to"
x = 16
z = 49

[[step]]
do = "moves"
dirs = [["U", 2]]
note = "onto zone_event 278 trigger 0 (14,47): scr 0556 script 2"

[[step]]
do = "advance_text"
shot = "throne-room"

[[step]]
do = "moves"
dirs = [["U", 5]]
note = "onto zone_event 278 trigger 1 (14,42): scr 0556 script 3 (N calls his dragon; the stone answers: the VRAM hand-over, DEFECTS.md)"

[[step]]
do = "press"
keys = "a"
until = "field_ready=1"
times = 400
gap = 20
shot = "legendary-awakes"
note = "through the legendary's demo (map 0) and back to the field"

[[step]]
do = "talk_to"
id = 4
note = "the legendary: scr 0556 script 8"

[[step]]
do = "press"
keys = "a"
until = "in_battle=1"
times = 60
note = "to its WildBattle (lv 50)"

[[step]]
do = "wait_frames"
n = 900
shot = "legendary-battle"

[[step]]
do = "tap"
x = 40
y = 168
gap = 60
note = "BAG"

[[step]]
do = "tap"
x = 190
y = 48
gap = 60
note = "POKE BALLS"

[[step]]
do = "tap"
x = 64
y = 30
gap = 60
note = "[INFERENCE] the first ball, the Master Ball (the chain's bag lists it first; the 3rd ball is at (64,78) and the 4th at (190,78) from scouting)"

[[step]]
do = "tap"
x = 110
y = 174
gap = 60
note = "USE"

[[step]]
do = "press"
keys = "b"
until = "map_id=278"
times = 80
gap = 30
shot = "caught"
note = "the catch; B declines the nickname"

[[step]]
do = "wait_frames"
n = 400

[[step]]
do = "press"
keys = "a"
note = "YES: add it to the party from the Box (msg 301 #101-#105)"

[[step]]
do = "wait_frames"
n = 400

[[step]]
do = "press"
keys = "a"

[[step]]
do = "wait_frames"
n = 300

[[step]]
do = "tap"
x = 190
y = 35
note = "party slot 1 (Pansage) goes to the Box"

[[step]]
do = "wait_frames"
n = 120

[[step]]
do = "press"
keys = "a"
times = 4
note = "YES"

[[step]]
do = "advance_text"
note = "to N's battle"

[[step]]
do = "auto_battle"
snap = true
note = "N (trdata #587 Black / #586 White)"

[[step]]
do = "advance_text"
note = "script 15: 0x40B6 5, 0x40A2 2; Ghetsis"

[[step]]
do = "auto_battle"
snap = true
note = "Ghetsis (trdata #232)"

[[step]]
do = "wait_reset"
press = "a"
gap = 26
max = 40000
note = "N's farewell, Cmd156, the credits, the game's own save and OS_ResetSystem"

[expect]
flags = ["0x133"]
save = ["any(p[\"species\"] == 644 for p in s[\"party\"])"]

[expect.vars]
"0x40B6" = 5
"0x40A2" = 3
