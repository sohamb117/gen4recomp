# Proves Route 113 west through the ash (trainers), Fallarbor (visited flag, heal) and Route 114 to the Meteor Falls
# door (8,63).
# Start: Route 113 east end -> end: MAP_METEOR_FALLS_1F_1R entrance (27,18).
title = "Route 113, Fallarbor and Route 114 to Meteor Falls"
priority = "P0"
version = "both"
estimate = 24843
refs = [
  "data/maps/FallarborTown/map.json warp_events[2] (14,7) -> POKEMON_CENTER_1F",
  "data/maps/Route114/map.json warp_events[0] (8,63) -> METEOR_FALLS_1F_1R (27,18)",
]
notes = "Route 113 and Route 114 sight trainers (lv 16-20) are fought on the way. gba_world_cli: Route 113 (85,10) -> Fallarbor (14,8) -> Route 114 (8,64)."

[start]
from = "prev"

[run]
frames = 37300

[[step]]
do = "walk_to"
x = 14
z = 8
map = "MAP_FALLARBOR_TOWN"
note = "west on Route 113 into Fallarbor (OnTransition FLAG_VISITED_FALLARBOR_TOWN)"

[[step]]
do = "heal"
x = 14
z = 7
note = "Fallarbor Pokemon Center (warp 2)"

[[step]]
do = "walk_to"
x = 8
z = 63
map = "MAP_ROUTE114"
note = "west and south on Route 114 to the Meteor Falls door (Route 114 warp 0) -> METEOR_FALLS_1F_1R (27,18)"

[[step]]
do = "wait_map"
map = "MAP_METEOR_FALLS_1F_1R"

[expect]
map = "MAP_METEOR_FALLS_1F_1R"
badges = 3
flags = ["FLAG_BADGE01_GET", "FLAG_BADGE02_GET", "FLAG_BADGE03_GET", "FLAG_VISITED_FALLARBOR_TOWN"]
