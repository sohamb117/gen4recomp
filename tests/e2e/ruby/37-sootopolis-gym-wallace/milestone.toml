[[step]]
do = "steps"
route = [[8, 19], [9, 19], [9, 18], [7, 18], [7, 17], [8, 17]]
note = "each thin-ice tile once (a second step on cracked ice falls to B1F: OnFrame VAR_ICE_STEP_COUNT 0 -> FallThroughIce): the 7 tiles take VAR_ICE_STEP_COUNT 1 -> 8, OnFrame UnlockFirstStairs opens (8,15..16) (SootopolisCity_Gym_1F/scripts.inc:7-9,28-42,46-52); a Hamiltonian path from the entry to the stairs"

[[step]]
do = "wait_frames"
n = 90
note = "the stairs' delay 40 + setmetatile + DrawWholeMapView"

[[step]]
do = "steps"
route = [[8, 14], [5, 14], [5, 12], [7, 12], [7, 13], [10, 13], [10, 14], [11, 14], [11, 12], [8, 12]]
note = "up the stairs, the 19 tiles of the second field: 9 -> 28, UnlockSecondStairs (8,10..11)"

[[step]]
do = "wait_frames"
n = 90

[[step]]
do = "steps"
route = [[8, 9], [10, 9], [10, 7], [11, 7], [11, 8], [12, 8], [12, 9], [13, 9], [13, 6], [9, 6], [9, 8], [7, 8], [7, 9], [6, 9], [6, 8], [5, 8], [5, 9], [4, 9], [4, 8], [3, 8], [3, 6], [4, 6], [4, 7], [5, 7], [5, 6], [6, 6], [6, 7], [7, 7], [7, 6], [8, 6]]
note = "the 40 tiles of the third field: 29 -> 69, UnlockThirdStairs (8,4..5)"

[[step]]
do = "wait_frames"
n = 90

[[step]]
do = "steps"
route = [[8, 3]]
face = "up"
interact = true
note = "up the last stairs, below Wallace (object 1 (8,2))"

[[step]]
do = "advance_text"

[[step]]
do = "auto_battle"
snap = true
note = "TRAINER_WALLACE (272): LUVDISC 40, WHISCASH 42, SEALEO 40, SEAKING 42, MILOTIC 43"

[[step]]
