# Proves the ice-floor gym (1F cracked ice, B1F) and Wallace (TRAINER_WALLACE): FLAG_BADGE08_GET, TM03 Water Pulse.
# Start: Cave of Origin B4F -> end: MAP_SOOTOPOLIS_CITY at the gym door (31,33).
title = "Sootopolis Gym: Wallace's Rain Badge"
priority = "P0"
version = "both"
estimate = 16681
refs = [
  "data/maps/SootopolisCity/map.json warp_events[2] (31,32) -> SOOTOPOLIS_CITY_GYM_1F (8,25)",
  "data/maps/SootopolisCity_Gym_1F/map.json object_events[0] WALLACE (8,2)",
  "data/maps/SootopolisCity_Gym_1F/scripts.inc (trainerbattle_single TRAINER_WALLACE; FLAG_DEFEATED_SOOTOPOLIS_GYM, FLAG_BADGE08_GET)",
]
notes = "Wallace: TRAINER_WALLACE (272): LUVDISC 40, WHISCASH 42, SEALEO 40, SEAKING 42, MILOTIC 43 (Water: the lead's level carries it; no Electric/Grass in the party). The gym is the thin-ice puzzle: every thin-ice tile of a field stepped on once opens the next stairs (VAR_ICE_STEP_COUNT 8, 28, 69); a cracked tile stepped on again drops the player to B1F. The routes are Hamiltonian paths over each field's tiles (map.json layout), entry to stairs."

[start]
from = "prev"
boost = "boost.recipe"

[run]
frames = 25100


[[step]]
do = "walk_to"
x = 31
z = 34
map = "MAP_SOOTOPOLIS_CITY"
surf = true
note = "out of the cave, across the crater to the gym, below Steven: after the legend he waits at the gym door (31,33) (SootopolisCity OnTransition FLAG_LEGENDARY_BATTLE_COMPLETED -> SetStevenOutsideGymPostLegendary, scripts.inc:35)"

[[step]]
do = "talk_to"
id = 10
shot = "steven"
note = "Steven (object 10): WeOweItAllToYou, flies off, removeobject (FLAG_HIDE_STEVEN_SOOTOPOLIS) (SootopolisCity/scripts.inc:452-468)"

[[step]]
do = "advance_text"

[[step]]
do = "heal"
x = 43
z = 31
surf = true
note = "Sootopolis Pokemon Center (warp 0), across the crater lake"

[[step]]
do = "walk_to"
x = 31
z = 32
map = "MAP_SOOTOPOLIS_CITY"
surf = true
note = "gym door (Sootopolis warp 2) -> GYM_1F (8,25)"

[[step]]
