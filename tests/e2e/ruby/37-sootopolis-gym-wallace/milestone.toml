map = "MAP_SOOTOPOLIS_CITY_GYM_B1F"

[[step]]
do = "wait_field"

[[step]]
do = "steps"
route = [[7, 6], [7, 8], [8, 8], [8, 10], [8, 12], [5, 12], [5, 14], [8, 14], [8, 15], [8, 17], [8, 20], [8, 22], [11, 22]]
note = "B1F down to its stairs (11,22) -> 1F (11,22): python3 tests/e2e/tools/gba_puzzle.py --game ruby MAP_SOOTOPOLIS_CITY_GYM_B1F 8 6 11 22 (the chutes (8,10..11), (8,15..16), (8,20..21) are MB_SLIDE_SOUTH 0x47, ridden; the gym's B1F trainers who see the route are fought)"

[[step]]
do = "walk_to"
