shot = "rain-badge"

[[step]]
do = "press"
keys = "DOWN"
hold = 60
note = "back down the stairs onto the cracked ice (8,6): VAR_ICE_STEP_COUNT 0 -> FallThroughIce, warphole MAP_SOOTOPOLIS_CITY_GYM_B1F (SootopolisCity_Gym_1F/scripts.inc:46-63); the static model has the stairs closed (map.bin) and never plans onto ice"

[[step]]
