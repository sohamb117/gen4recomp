# Proves the walk north (Slateport -> Route 110 -> Mauville -> Routes 118/119 -> Fortree -> Routes 120/121 -> Lilycove's
# cove by Surf), Ruby's hideout door (LilycoveCity OnLoad .ifndef SAPPHIRE opens (71,5) -> MAP_MAGMA_HIDEOUT_1F), the
# hideout floors and the admin by the submarine dock (TRAINER_HIDEOUT_B2F_GRUNT_1 = TRAINER_TABITHA_1 in Ruby):
# FLAG_EVIL_TEAM_ESCAPED_IN_SUBMARINE.
# Start: Slateport outside the harbor -> end: MAP_MAGMA_HIDEOUT_B2F by the dock.
title = "Team Magma Hideout: Tabitha and the escaped submarine (Ruby)"
priority = "P0"
version = "ruby"
estimate = 38287
refs = [
  "data/maps/LilycoveCity/scripts.inc:15-31 (OnLoad .ifndef SAPPHIRE: the cove entrance metatiles, (71,5) BottomMid collision 0)",
  "data/maps/LilycoveCity/map.json warp_events[14] (71,5) -> MAGMA_HIDEOUT_1F (13,27); [6] (70,5) -> AQUA_HIDEOUT_1F is Sapphire's",
  "data/maps/MagmaHideout_1F/map.json object_events grunts (13,19)/(14,19) FLAG_HIDE_GRUNT_1/2_BLOCKING_HIDEOUT (hidden in 31), (20,3) sight trainer",
  "data/maps/AquaHideout_1F/scripts.inc:9-46 (shared hideout scripts: MagmaHideout_* labels alias AquaHideout_*)",
  "data/maps/MagmaHideout_B2F/map.json object_events[0] admin VAR_1 (8,19) sight 0 -> MagmaHideout_B2F_EventScript_15D8E1",
  "data/maps/AquaHideout_B2F/scripts.inc:26-70 (trainerbattle_single TRAINER_HIDEOUT_B2F_GRUNT_1; the submarine leaves: FLAG_EVIL_TEAM_ESCAPED_IN_SUBMARINE, FLAG_HIDE_GRUNTS_LILYCOVE)",
  "constants/version.inc (Ruby: HIDEOUT_1F_GRUNT = GRUNT_28, B1F = GRUNT_29/30/53, B2F_GRUNT_1 = TABITHA_1, B2F_GRUNT_2/3 = GRUNT_31/54)",
]
notes = "Ruby's branch: its hideout is the MAP_MAGMA_HIDEOUT_* maps behind Lilycove's (71,5) (Sapphire: ../sapphire/32-aqua-hideout-matt, MAP_AQUA_HIDEOUT_* behind (70,5)). Tabitha: TRAINER_TABITHA_1 (596): NUMEL 32, MIGHTYENA 32, CAMERUPT 32 (Surf x2-x4). Grunts: GRUNT_28 (567): POOCHYENA 32 x2; GRUNT_29 (568): ZUBAT 30, POOCHYENA 30, NUMEL 30, POOCHYENA 30; GRUNT_30 (569): NUMEL 32, ZUBAT 32; GRUNT_53 (592): POOCHYENA 31, NUMEL 31 x2; GRUNT_31 (570): NUMEL 33; GRUNT_54 (593): ZUBAT 33. The static model keeps Lilycove's map.bin, where (71,5) is a wall: the walk stops on the water below it (71,6) and the last step north is planned on the probe, which sees the OnLoad metatiles. Walking, not Fly: bots.bot_fly drives the DS town map (overworld_headers) [INFERENCE: not usable on GBA]; the static route avoids the Cycling Road gates (bike-only) by the Route 110 waypoint. Inside, gba_world_cli (surf): 1F (13,1) -> B1F (8,5) -> B1F (14,3) -> B2F (12,1) -> B1F (23,5) -> B1F (43,19) -> B1F (29,1) -> B2F (17,13) -> B2F (7,19). The Electrode 'items' on B1F are only met if talked to."

