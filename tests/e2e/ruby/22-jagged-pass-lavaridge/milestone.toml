# Proves Mt. Chimney's south exit, Jagged Pass' ledges down (ash weather, trainers), Route 112 west into Lavaridge
# (FLAG_VISITED_LAVARIDGE_TOWN, heal).
# Start: Mt. Chimney summit -> end: MAP_LAVARIDGE_TOWN in front of the Pokemon Center (9,7).
title = "Jagged Pass down to Lavaridge"
priority = "P0"
version = "both"
estimate = 5230
refs = [
  "data/maps/MtChimney/map.json warp_events[2] (20,41) -> JAGGED_PASS (13,5)",
  "data/maps/JaggedPass/map.json warp_events[0] (14,40) -> Route 112 (6,46)",
  "data/maps/LavaridgeTown/map.json warp_events[3] (9,6) -> POKEMON_CENTER_1F",
]
notes = "Jagged Pass trainers (lv 19-22) stand by the ledges; Jagged Pass is one-way downhill by ledges [INFERENCE]. R/S have no Magma Hideout door in Jagged Pass (Emerald-only map): its coord events are ash-weather triggers only."

[start]
from = "prev"

[run]
frames = 8000

[[step]]
do = "walk_to"
x = 20
z = 41
note = "Mt. Chimney south exit (warp 2) -> JAGGED_PASS (13,5)"

[[step]]
do = "wait_map"
map = "MAP_JAGGED_PASS"

[[step]]
do = "walk_to"
x = 14
z = 40
note = "bottom exit (warp 0) -> Route 112 (6,46)"

[[step]]
do = "wait_map"
map = "MAP_ROUTE112"

[[step]]
do = "walk_to"
x = 9
z = 7
map = "MAP_LAVARIDGE_TOWN"
note = "west into Lavaridge"

[[step]]
do = "heal"
x = 9
z = 6
note = "Lavaridge Pokemon Center (warp 3)"

[expect]
map = "MAP_LAVARIDGE_TOWN"
badges = 3
flags = ["FLAG_BADGE01_GET", "FLAG_BADGE02_GET", "FLAG_BADGE03_GET", "FLAG_VISITED_LAVARIDGE_TOWN", "FLAG_DEFEATED_EVIL_TEAM_MT_CHIMNEY"]
