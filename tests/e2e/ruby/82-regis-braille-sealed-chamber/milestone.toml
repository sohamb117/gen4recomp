[[step]]
do = "advance_text"

[[step]]
do = "walk_to"
x = 8
z = 20
note = "the opened wall: IslandCave/map.json warp_events[1] (8,20) -> warp 2 (8,11)"

[[step]]
do = "talk_to"
id = 1
on_battle = "flee"
note = "REGICE (IslandCave/map.json object_events[0] (8,7)): setwildbattle SPECIES_REGICE 40, FLAG_HIDE_REGICE, ScrSpecial_StartRegiBattle (IslandCave/scripts.inc:72-86; battle_setup.c:612-620)"

[[step]]
do = "wait_battle"
max = 1500

[[step]]
do = "wait_frames"
n = 240
shot = "regice"

[[step]]
