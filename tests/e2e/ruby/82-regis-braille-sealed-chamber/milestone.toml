shot = "after"

[expect]
map = "MAP_ISLAND_CAVE"
flags = ["FLAG_SYS_BRAILLE_DIG", "FLAG_REGI_DOORS_OPENED", "FLAG_LANDMARK_SEALED_CHAMBER", "FLAG_SYS_BRAILLE_WAIT", "FLAG_HIDE_REGICE"]
battles = 1
