# Proves Steven on the Route 120 bridge (YES -> wild KECLEON lv30 via setwildbattle/dowildbattle -> ITEM_DEVON_SCOPE,
# FLAG_RECEIVED_DEVON_SCOPE) and the Devon Scope on Fortree's invisible Kecleon (FLAG_KECLEON_FLED_FORTREE).
# Start: Fortree (5,7) -> end: MAP_FORTREE_CITY below the gym door (22,12).
title = "Route 120: Steven's Devon Scope, the Fortree Kecleon"
status = "planned"
priority = "P0"
version = "both"
estimate = 12200
refs = [
  "data/maps/Route120/map.json object_events[30] STEVEN (13,15), [29] KECLEON_1 (12,16) invisible",
  "data/maps/Route120/scripts.inc:179-200 (Steven: MSGBOX_YESNO; NO sets FLAG_NOT_READY_FOR_BATTLE_ROUTE120 and asks again)",
  "data/maps/Route120/scripts.inc:202-227 (Kecleon appears: setwildbattle SPECIES_KECLEON 30, dowildbattle)",
  "data/maps/Route120/scripts.inc:230-252 (ITEM_DEVON_SCOPE, FLAG_RECEIVED_DEVON_SCOPE, Steven flies off)",
  "data/maps/FortreeCity/map.json object_events[6] KECLEON_1 (25,8) INVISIBLE FLAG_HIDE_KECLEON_FORTREE",
  "data/maps/FortreeCity/scripts.inc:55-86 (checkitem ITEM_DEVON_SCOPE -> YES/NO -> removeobject, FLAG_KECLEON_FLED_FORTREE)",
]
notes = "The bridge Kecleon battle continues to the scope whatever its outcome (goto after dowildbattle); auto_battle wins it. Fortree's Kecleon (25,8) blocks the gym path; talk_to it with the scope: YES -> it flees."

[start]
from = "prev"

[run]
frames = 60000

[[step]]
do = "walk_to"
x = 13
z = 16
map = "MAP_ROUTE120"
face = "up"
interact = true
note = "east into Route 120, below Steven (13,15) on the bridge (Steven talks only facing north or east: VAR_FACING 2/3)"

[[step]]
do = "advance_text"
note = "to Steven's YES/NO"

[[step]]
do = "press"
keys = "A"
note = "YES -> the Kecleon scene (Route120/scripts.inc:202-227)"

[[step]]
do = "wait_battle"

[[step]]
do = "auto_battle"
snap = true
note = "wild KECLEON lv30 (setwildbattle)"

[[step]]
do = "advance_text"
note = "ITEM_DEVON_SCOPE, FLAG_RECEIVED_DEVON_SCOPE (:230-252)"

[[step]]
do = "walk_to"
x = 25
z = 7
map = "MAP_FORTREE_CITY"
note = "back west to Fortree, north of the gym Kecleon (object 7 at (25,8))"

[[step]]
do = "talk_to"
id = 7
note = "Kecleon (object 7, INVISIBLE) -> checkitem ITEM_DEVON_SCOPE -> AskUseDevonScope (FortreeCity/scripts.inc:55-70)"

[[step]]
do = "advance_text"
note = "stops at the YES/NO"

[[step]]
do = "press"
keys = "A"
note = "YES -> UseDevonScope: removeobject, FLAG_KECLEON_FLED_FORTREE (:72-86)"

[[step]]
do = "advance_text"

[[step]]
do = "walk_to"
x = 22
z = 12

[expect]
map = "MAP_FORTREE_CITY"
badges = 5
flags = ["FLAG_BADGE01_GET", "FLAG_BADGE02_GET", "FLAG_BADGE03_GET", "FLAG_BADGE04_GET", "FLAG_BADGE05_GET", "FLAG_RECEIVED_DEVON_SCOPE", "FLAG_KECLEON_FLED_FORTREE", "FLAG_HIDE_KECLEON_FORTREE"]
battles = 1
