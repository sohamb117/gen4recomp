# Proves Surf east on Route 124 to Mossdeep and the arrow-tile gym (four switch signs toggle FLAG_MOSSDEEP_GYM_SWITCH_1..4
# and their arrow metatiles) to Tate & Liza (trainerbattle_double TRAINER_TATE_AND_LIZA): FLAG_BADGE07_GET, TM04 Calm Mind.
# Start: the hideout B2F -> end: MAP_MOSSDEEP_CITY outside the gym (38,10).
title = "Route 124 and the Mossdeep Gym: Tate & Liza"
status = "planned"
priority = "P0"
version = "both"
estimate = 30000
refs = [
  "data/maps/LilycoveCity/scripts.inc:31 (badge 7 walls the hideout door up)",
  "data/maps/MossdeepCity/map.json warp_events[1] (38,9) -> MOSSDEEP_CITY_GYM (9,29)",
  "data/maps/MossdeepCity_Gym/map.json bg_events switches (2,7)/(8,10)/(17,15)/(5,24); arrows (5,5)/(8,14)/(15,17)/(1,23)",
  "data/maps/MossdeepCity_Gym/scripts.inc:5-46,78-160 (switch flags and arrow metatiles)",
  "src/field_player_avatar.c:123-480 (forced movement: MB_WALK_* 0x40-0x43, MB_SLIDE_* 0x44-0x47 ride until blocked; 0x48 slips on)",
  "data/maps/MossdeepCity_Gym/scripts.inc:47-76 (TateAndLizaDefeated: FLAG_DEFEATED_MOSSDEEP_GYM, FLAG_BADGE07_GET; TM04)",
]
notes = "Tate & Liza: TRAINER_TATE_AND_LIZA (271) DOUBLE: LUNATONE 42, SOLROCK 42 (Surf x2 on both; a double battle needs two Pokemon: Castform and the Fly carrier from the boost stand by). The press list is a BFS over (tile, elevation, switch states) with the game's forced-movement rules (field_player_avatar.c; walk_to never plans onto forced tiles, bots.py:823): 3 switches pressed (1, 2, 3); the gym trainers' tiles are treated as walls, so sight battles on the way are not modelled [INFERENCE]. The (12,3) warp-back coord event is avoided. The hideout exit is walked back out by the route (its pads in reverse)."

[start]
from = "prev"
boost = "boost.recipe"

[run]
frames = 60000

[[step]]
do = "walk_to"
x = 38
z = 10
map = "MAP_MOSSDEEP_CITY"
surf = true
note = "out of the hideout, Lilycove east, Route 124 by Surf to Mossdeep, below the gym door"

[[step]]
do = "heal"
x = 28
z = 16
note = "Mossdeep Pokemon Center (warp 2)"

[[step]]
do = "walk_to"
x = 38
z = 9
note = "gym door (Mossdeep warp 1) -> MOSSDEEP_CITY_GYM (9,29)"

[[step]]
do = "wait_map"
map = "MAP_MOSSDEEP_CITY_GYM"

[[step]]
do = "slide"
dirs = "U R R R L U"
note = "single steps and arrow-tile rides; the last press faces the switch"

[[step]]
do = "press"
keys = "A"
gap = 40
note = "the switch (sign bg event): toggles its arrow tile (MossdeepCity_Gym/scripts.inc:78-160)"

[[step]]
do = "wait_frames"
n = 60

[[step]]
do = "slide"
dirs = "R U R U R R R L U L L"
note = "single steps and arrow-tile rides; the last press faces the switch"

[[step]]
do = "press"
keys = "A"
gap = 40
note = "the switch (sign bg event): toggles its arrow tile (MossdeepCity_Gym/scripts.inc:78-160)"

[[step]]
do = "wait_frames"
n = 60

[[step]]
do = "slide"
dirs = "D R D D D L L D L U L U U U L"
note = "single steps and arrow-tile rides; the last press faces the switch"

[[step]]
do = "press"
keys = "A"
gap = 40
note = "the switch (sign bg event): toggles its arrow tile (MossdeepCity_Gym/scripts.inc:78-160)"

[[step]]
do = "wait_frames"
n = 60

[[step]]
do = "slide"
dirs = "D D D D D U U U U L U R U"
note = "on to (8,4) below Tate (8,3); the last press faces him"

[[step]]
do = "press"
keys = "A"
note = "talk to Tate (object 1 (8,3))"

[[step]]
do = "advance_text"

[[step]]
do = "auto_battle"
snap = true
note = "TRAINER_TATE_AND_LIZA (271) DOUBLE: LUNATONE 42, SOLROCK 42"

[[step]]
do = "advance_text"
shot = "mind-badge"

[[step]]
do = "walk_to"
x = 9
z = 29
note = "exit mat -> Mossdeep (38,9) [the arrows as left by the switches]"

[[step]]
do = "wait_map"
map = "MAP_MOSSDEEP_CITY"

[expect]
map = "MAP_MOSSDEEP_CITY"
badges = 7
flags = ["FLAG_BADGE01_GET", "FLAG_BADGE02_GET", "FLAG_BADGE03_GET", "FLAG_BADGE04_GET", "FLAG_BADGE05_GET", "FLAG_BADGE06_GET", "FLAG_BADGE07_GET", "FLAG_DEFEATED_MOSSDEEP_GYM", "FLAG_RECEIVED_TM_CALM_MIND"]
battles = 1
