# Proves Surf east on Route 124 to Mossdeep and the arrow-tile gym (four switch signs toggle FLAG_MOSSDEEP_GYM_SWITCH_1..4
# and their arrow metatiles) to Tate & Liza (trainerbattle_double TRAINER_TATE_AND_LIZA): FLAG_BADGE07_GET, TM04 Calm Mind.
# Start: the hideout B2F -> end: MAP_MOSSDEEP_CITY outside the gym (38,10).
title = "Route 124 and the Mossdeep Gym: Tate & Liza"
priority = "P0"
version = "both"
estimate = 16820
refs = [
  "data/maps/LilycoveCity/scripts.inc:31 (badge 7 walls the hideout door up)",
  "data/maps/MossdeepCity/map.json warp_events[1] (38,9) -> MOSSDEEP_CITY_GYM (9,29)",
  "data/maps/MossdeepCity_Gym/map.json bg_events switches (2,7)/(8,10)/(17,15)/(5,24); arrows (5,5)/(8,14)/(15,17)/(1,23)",
  "data/maps/MossdeepCity_Gym/scripts.inc:5-46,78-160 (switch flags and arrow metatiles)",
  "src/field_player_avatar.c:123-480 (forced movement: MB_WALK_* 0x40-0x43, MB_SLIDE_* 0x44-0x47 ride until blocked; 0x48 slips on)",
  "data/maps/MossdeepCity_Gym/scripts.inc:47-76 (TateAndLizaDefeated: FLAG_DEFEATED_MOSSDEEP_GYM, FLAG_BADGE07_GET; TM04)",
]
notes = "Tate & Liza: TRAINER_TATE_AND_LIZA (271) DOUBLE: LUNATONE 42, SOLROCK 42 (Surf x2 on both; a double battle needs two Pokemon: Castform and the Fly carrier from the boost stand by). The gym route is tools/gba_puzzle.py's R/S Mossdeep mode (forced-movement arrows ridden, the sign switches' setmetatile toggles, trainers who see the player mid-ride); the (12,3) WarpToEntrance coord event is never stepped on. The hideout exit is walked back out by the route (its pads in reverse)."

[start]
from = "prev"
boost = "boost.recipe"

[run]
frames = 25300

[[step]]
do = "walk_to"
x = 38
z = 10
map = "MAP_MOSSDEEP_CITY"
surf = true
note = "out of the hideout, Lilycove east, Route 124 by Surf to Mossdeep, below the gym door"

[[step]]
do = "heal"
x = 28
z = 16
note = "Mossdeep Pokemon Center (warp 2)"

[[step]]
do = "walk_to"
x = 38
z = 9
note = "gym door (Mossdeep warp 1) -> MOSSDEEP_CITY_GYM (9,29)"

[[step]]
do = "wait_map"
map = "MAP_MOSSDEEP_CITY_GYM"

# gym route: python3 tests/e2e/tools/gba_puzzle.py --game ruby MAP_MOSSDEEP_CITY_GYM 9 29 8 4 (arrow tiles ridden, the four sign
# switches as face + interact; trainers who see the route are fought on the way)
[[step]]
do = "steps"
route = [[9, 28], [12, 28], [18, 16], [17, 16]]

[[step]]
do = "steps"
route = [[17, 16]]
face = "up"
interact = true
note = "the switch: its arrows turn (MossdeepCity_Gym/scripts.inc)"

[[step]]
do = "wait_frames"
n = 60

[[step]]
do = "steps"
route = [[18, 16], [18, 15], [6, 19], [7, 19], [8, 19], [8, 18], [11, 18], [11, 11], [10, 11], [10, 10], [9, 10]]

[[step]]
do = "steps"
route = [[9, 10]]
face = "left"
interact = true
note = "the switch: its arrows turn (MossdeepCity_Gym/scripts.inc)"

[[step]]
do = "wait_frames"
n = 60

[[step]]
do = "steps"
route = [[9, 11], [10, 11], [10, 12], [10, 18], [10, 20], [8, 20], [8, 21], [7, 21], [4, 11], [4, 10], [3, 10], [3, 7]]

[[step]]
do = "steps"
route = [[3, 7]]
face = "left"
interact = true
note = "the switch: its arrows turn (MossdeepCity_Gym/scripts.inc)"

[[step]]
do = "wait_frames"
n = 60

[[step]]
do = "steps"
route = [[3, 12], [14, 26], [14, 24], [6, 24]]

[[step]]
do = "steps"
route = [[6, 24]]
face = "left"
interact = true
note = "the switch: its arrows turn (MossdeepCity_Gym/scripts.inc)"

[[step]]
do = "wait_frames"
n = 60

[[step]]
do = "steps"
route = [[6, 26], [8, 26], [8, 28], [6, 28], [7, 5], [7, 4], [8, 4]]
face = "up"
interact = true
note = "below Tate (object 1 (8,3)), facing him: TateAndLiza (MossdeepCity_Gym/scripts.inc)"

[[step]]
do = "advance_text"

[[step]]
do = "auto_battle"
snap = true
note = "TRAINER_TATE_AND_LIZA (271) DOUBLE: LUNATONE 42, SOLROCK 42"

[[step]]
do = "advance_text"
shot = "mind-badge"

[[step]]
do = "walk_to"
x = 12
z = 3
note = "the dais has no way back over the arrows (gba_puzzle.py --switches 0 1 2 3: no route to the mat): the WarpToEntrance coord event (12,3) -> warpteleport (14,29) (MossdeepCity_Gym/scripts.inc WarpToEntrance)"

[[step]]
do = "wait_frames"
n = 120

[[step]]
do = "walk_to"
x = 38
z = 10
map = "MAP_MOSSDEEP_CITY"
note = "the entrance row to the mat (9,29) -> Mossdeep (38,9), a step south"

[[step]]
do = "wait_map"
map = "MAP_MOSSDEEP_CITY"

[expect]
map = "MAP_MOSSDEEP_CITY"
badges = 7
flags = ["FLAG_BADGE01_GET", "FLAG_BADGE02_GET", "FLAG_BADGE03_GET", "FLAG_BADGE04_GET", "FLAG_BADGE05_GET", "FLAG_BADGE06_GET", "FLAG_BADGE07_GET", "FLAG_DEFEATED_MOSSDEEP_GYM", "FLAG_RECEIVED_TM_CALM_MIND"]
battles = 1
