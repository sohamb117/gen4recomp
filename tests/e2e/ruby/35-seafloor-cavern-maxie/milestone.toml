  "data/maps/SeafloorCavern_Entrance/map.json warp_events[1] (10,1) -> ROOM1",
  "data/maps/Underwater_SeafloorCavern/map.json warp_events[0] (6,7) -> UNDERWATER4 (the cavern mouth)",
  "constants/version.inc (Ruby: SEAFLOOR_CAVERN_GRUNT_3 = COURTNEY_2, _5 = MAXIE_2)",
]
