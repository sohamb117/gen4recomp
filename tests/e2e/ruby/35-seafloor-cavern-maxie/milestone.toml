# Groudon awakens, VAR_SOOTOPOLIS_STATE 1, then Steven on Route 128 (VAR_ROUTE128_STATE 2).
# Start: Mossdeep (19,11) -> end: MAP_ROUTE128 (the scene ends with Steven above the sea).
