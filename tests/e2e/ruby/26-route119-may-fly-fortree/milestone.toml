note = "ITEM_HM02_FLY, FLAG_RECEIVED_HM02; May leaves, ROUTE119_STATE 1 (:112-170)"

[[step]]
do = "walk_to"
x = 5
z = 7
map = "MAP_FORTREE_CITY"
