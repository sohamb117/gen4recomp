# Proves Route 124 by Surf from Lilycove (its east exit open now), Mossdeep (visited flag) and the warp-tile/switch gym,
# Tate & Liza's double battle (TRAINER_TATE_AND_LIZA_1): FLAG_BADGE07_GET, TM04 Calm Mind, VAR_MOSSDEEP_CITY_STATE 1.
# Start: Aqua Hideout B2F -> end: MAP_MOSSDEEP_CITY at the gym door (38,10).
title = "Surf to Mossdeep: Tate & Liza's Mind Badge"
priority = "P0"
estimate = 37999
refs = [
  "data/maps/LilycoveCity/map.json object_events[10] Wailmer grunt (73,15) FLAG_HIDE_LILYCOVE_CITY_AQUA_GRUNTS",
  "data/maps/Route124/map.json connections right MOSSDEEP_CITY offset 40",
  "data/maps/MossdeepCity/scripts.inc:71-74",
  "data/maps/MossdeepCity/map.json warp_events[1] (38,9) -> GYM",
  "data/maps/MossdeepCity_Gym/map.json coord_events switches/warp",
  "data/maps/MossdeepCity_Gym/scripts.inc:51-104",
  "data/maps/MossdeepCity_Gym/scripts.inc:113-196",
  "TRAINER_TATE_AND_LIZA_1 (271), src/data/trainers.h:3256",
  "src/party_menu.c:126 (Dive needs FLAG_BADGE07_GET)",
]
notes = "Tate & Liza (DOUBLE, two mons needed): TRAINER_TATE_AND_LIZA_1 (271): CLAYDOL 41, XATU 41, LUNATONE 42, SOLROCK 42 (Lunatone/Solrock Rock/Psychic, Claydol Ground: Surf hits hard; auto_battle must target in doubles). Gym trainers lv36 (Preston, Virgil, Blake, Hannah, Samantha, Maura, Sylvia, Nate, Kathleen, Clifford, Macey, Nicholas). Route 124 swimmers lv 33-34. Badge 7 also arms the Space Center raid (MOSSDEEP_CITY_STATE 1, Magma objects shown: MossdeepCity_Gym/scripts.inc:73-79) and hides the Aqua hideout grunts (:67)."

[start]
from = "prev"
# lab = "lab.recipe"  # GBA lab recipes: not written yet (owner tooling)

[run]
frames = 57000

