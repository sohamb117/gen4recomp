shot = "go-goggles"
note = "OnFrame LAVARIDGE_TOWN_STATE 1 -> RivalGiveGoGoggles: ITEM_GO_GOGGLES, FLAG_RECEIVED_GO_GOGGLES, STATE 2 (LavaridgeTown/scripts.inc:40-90)"

[expect]
