shot = "heat-badge"
note = "FlanneryDefeated: FLAG_WHITEOUT_TO_LAVARIDGE, FLAG_DEFEATED_LAVARIDGE_GYM, FLAG_BADGE04_GET, PETALBURG_GYM_STATE 6 -> Common_EventScript_ReadyPetalburgGymForBattle, LAVARIDGE_TOWN_STATE 1; TM Overheat (LavaridgeTown_Gym_1F/scripts.inc:55-93)"

[[step]]
do = "walk_to"
x = 13
z = 18
note = "exit mat (warp 0) -> Lavaridge (5,15)"

[[step]]
do = "wait_map"
