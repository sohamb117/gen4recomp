# PHASE2: the geyser route to Flannery (probe the 1F/B1F warp pairs; Flannery (13,9) is on 1F behind the B1F loop) -> via list or steps.

[[step]]
do = "walk_to"
x = 5
z = 15
note = "gym door (Lavaridge warp 1) -> LAVARIDGE_TOWN_GYM_1F (13,18)"

[[step]]
do = "wait_map"
map = "MAP_LAVARIDGE_TOWN_GYM_1F"

[[step]]
do = "walk_to"
x = 13
z = 10
face = "up"
interact = true
note = "below Flannery (13,9) [PHASE2: geyser route]"

[[step]]
do = "advance_text"

[[step]]
do = "auto_battle"
snap = true
shot = "flannery"
note = "TRAINER_FLANNERY_1 (268): NUMEL 24, SLUGMA 24, CAMERUPT 26, TORKOAL 29"

[[step]]
