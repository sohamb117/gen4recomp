  "data/maps/LavaridgeTown_Gym_1F/scripts.inc:44-95",
  "data/maps/LavaridgeTown/scripts.inc:40-90",
  "TRAINER_FLANNERY_1 (268), src/data/trainers.h:3220",
  "TRAINER_COLE (201), src/data/trainers.h:2416",
  "TRAINER_GERALD (648), src/data/trainers.h:7780",
  "TRAINER_AXLE (203), src/data/trainers.h:2440",
  "TRAINER_DANIELLE (650), src/data/trainers.h:7804",
