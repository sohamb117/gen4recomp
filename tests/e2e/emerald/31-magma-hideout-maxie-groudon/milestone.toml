max = 30000
note = "down Mt. Pyre, Surf Route 122 -> 123 -> 118, Mauville, Route 111 north, Route 112's cable car station (Route 112 warp (28,27)); below the attendant (object 1 (6,6)). No party member can Fly; the cable car is the walker's way up"

