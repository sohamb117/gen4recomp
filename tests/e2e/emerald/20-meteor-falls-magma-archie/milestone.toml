# Proves the Meteor Falls coord scene (14,18) VAR_METEOR_FALLS_STATE 0: Magma steals Cozmo's meteorite, Archie +
# grunts arrive; FLAG_HIDE_ROUTE_112_TEAM_MAGMA opens the cable car, FLAG_MET_ARCHIE_METEOR_FALLS.
# Start: Meteor Falls 1F (27,18) -> end: MAP_ROUTE114 outside the falls (8,64).
title = "Meteor Falls: Magma takes the meteorite, Archie appears"
status = "planned"
priority = "P0"
estimate = 4000
refs = [
  "data/maps/MeteorFalls_1F_1R/map.json coord_events (14,18) VAR_METEOR_FALLS_STATE=0",
  "data/maps/MeteorFalls_1F_1R/scripts.inc:16-82",
]
notes = "No battle (pure cutscene). Route 112's grunts (FLAG_HIDE_ROUTE_112_TEAM_MAGMA) disappear here."

[start]
from = "prev"
# lab = "lab.recipe"  # GBA lab recipes: not written yet (owner tooling)

[run]
