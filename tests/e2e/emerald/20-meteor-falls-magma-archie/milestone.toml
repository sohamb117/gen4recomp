map = "MAP_ROUTE114"

[expect]
map = "MAP_ROUTE114"
badges = 3
flags = ["FLAG_BADGE01_GET", "FLAG_BADGE02_GET", "FLAG_BADGE03_GET", "FLAG_HIDE_ROUTE_112_TEAM_MAGMA", "FLAG_MET_ARCHIE_METEOR_FALLS"]

[expect.vars]
