# Proves Sidney's room: the battle (TRAINER_SIDNEY), FLAG_DEFEATED_ELITE_4_SIDNEY, the opened north door and the walk on.
# Start: Sidney's room (6,6) after the door closed -> end: Phoebe's room, door shut (VAR_ELITE_4_STATE 2).
title = "Elite Four: Sidney"
status = "planned"
priority = "P0"
estimate = 7000
refs = [
  "data/maps/EverGrandeCity_SidneysRoom/map.json object_events[1]",
  "data/maps/EverGrandeCity_SidneysRoom/scripts.inc:51",
  "data/maps/EverGrandeCity_SidneysRoom/scripts.inc:61",
  "data/maps/EverGrandeCity_SidneysRoom/map.json warp_events[1] (6,2)",
  "data/maps/EverGrandeCity_Hall1/map.json warp_events (5,2)",
  "TRAINER_SIDNEY (261), src/data/trainers.h:3136",
  "data/scripts/elite_four.inc",
]
notes = "Sidney: TRAINER_SIDNEY (261): MIGHTYENA 46, SHIFTRY 48, CACTURNE 46, CRAWDAUNT 48, ABSOL 49. No healing between E4 rooms: the boost recipe should carry Full Restores / levels for the whole run [INFERENCE]. A quick save inside the E4 rooms resumes in place (src/save_location.c has no E4 special warp)."

[start]
