# Proves Phoebe's room: the battle (TRAINER_PHOEBE), FLAG_DEFEATED_ELITE_4_PHOEBE, the opened north door and the walk on.
# Start: Phoebe's room (6,6) after the door closed -> end: Glacia's room, door shut (VAR_ELITE_4_STATE 3).
title = "Elite Four: Phoebe"
priority = "P0"
estimate = 7220
refs = [
  "data/maps/EverGrandeCity_PhoebesRoom/map.json object_events[1]",
  "data/maps/EverGrandeCity_PhoebesRoom/scripts.inc:45",
  "data/maps/EverGrandeCity_PhoebesRoom/scripts.inc:55",
  "data/maps/EverGrandeCity_PhoebesRoom/map.json warp_events[1] (6,2)",
  "data/maps/EverGrandeCity_Hall2/map.json warp_events (5,2)",
  "TRAINER_PHOEBE (262), src/data/trainers.h:3148",
  "data/scripts/elite_four.inc",
]
notes = "Phoebe: TRAINER_PHOEBE (262): DUSCLOPS 48, BANETTE 49, SABLEYE 50, BANETTE 49, DUSCLOPS 51. No healing between E4 rooms: the boost recipe should carry Full Restores / levels for the whole run [INFERENCE]. A quick save inside the E4 rooms resumes in place (src/save_location.c has no E4 special warp)."

[start]
from = "prev"
