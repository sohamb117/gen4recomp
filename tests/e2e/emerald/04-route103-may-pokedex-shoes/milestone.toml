[expect.vars]
VAR_BIRCH_LAB_STATE = 5
VAR_LITTLEROOT_RIVAL_STATE = 4
VAR_LITTLEROOT_TOWN_STATE = 4
VAR_OLDALE_TOWN_STATE = 1
