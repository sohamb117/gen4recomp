# Proves Drake's room: the battle (TRAINER_DRAKE), FLAG_DEFEATED_ELITE_4_DRAKE, the opened north door and the walk on.
# Start: Drake's room (6,6) after the door closed -> end: Hall 4 below the Champion's door (5,3).
title = "Elite Four: Drake"
status = "planned"
priority = "P0"
estimate = 7000
refs = [
  "data/maps/EverGrandeCity_DrakesRoom/map.json object_events[1]",
  "data/maps/EverGrandeCity_DrakesRoom/scripts.inc:46",
  "data/maps/EverGrandeCity_DrakesRoom/scripts.inc:58",
  "data/maps/EverGrandeCity_DrakesRoom/map.json warp_events[1] (6,2)",
  "data/maps/EverGrandeCity_Hall4/map.json warp_events (5,2)",
  "TRAINER_DRAKE (264), src/data/trainers.h:3172",
  "data/scripts/elite_four.inc",
]
notes = "Drake: TRAINER_DRAKE (264): SHELGON 52, ALTARIA 54, KINGDRA 53, FLYGON 53, SALAMENCE 55. No healing between E4 rooms: the boost recipe should carry Full Restores / levels for the whole run [INFERENCE]. A quick save inside the E4 rooms resumes in place (src/save_location.c has no E4 special warp)."

[start]
from = "prev"
# lab = "lab.recipe"  # GBA lab recipes: not written yet (owner tooling)

[run]
frames = 60000

[[step]]
do = "walk_to"
x = 6
z = 6
face = "up"
interact = true
note = "below Drake (object 1 (6,5))"

[[step]]
do = "advance_text"
note = "IntroSpeech"

[[step]]
do = "auto_battle"
snap = true
note = "TRAINER_DRAKE (264): SHELGON 52, ALTARIA 54, KINGDRA 53, FLYGON 53, SALAMENCE 55"

[[step]]
do = "advance_text"
shot = "drake-defeated"
note = "Defeated: FLAG_DEFEATED_ELITE_4_DRAKE, door to the next hall opens (PokemonLeague_EliteFour_SetAdvanceToNextRoomMetatiles)"

[[step]]
do = "walk_to"
x = 6
z = 2
note = "north door (warp 1) -> MAP_EVER_GRANDE_CITY_HALL4 (5,33)"

[[step]]
do = "wait_map"
