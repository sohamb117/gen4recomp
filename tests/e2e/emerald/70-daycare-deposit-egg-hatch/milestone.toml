# Proves Emerald's Day Care end to end: the Day-Care Lady takes DITTO and MAGIKARP through her own menus (YES, the
# party menu, STORE, "raise one more?" YES, the second pick; GAME_STAT_USED_DAYCARE per deposit; Emerald refuses a
# deposit that leaves one Pokemon, so the party is four), the player runs laps on Route 117 until the egg roll sets
# FLAG_PENDING_DAYCARE_EGG, the Day-Care Man hands the egg over, and the egg hatches on further laps
# (GAME_STAT_HATCHED_EGGS): a MAGIKARP in the party.
# Start: MAP_ROUTE117_POKEMON_DAY_CARE (2,5) -> end: MAP_ROUTE117 east of the Day Care, MAGIKARP hatched.
title = "Day Care: deposit two, collect the egg, hatch it"
priority = "P1"
estimate = 18009
refs = [
  "data/maps/Route117_PokemonDayCare/map.json object_events[0] (2,2) the lady, warp_events (2,8),(3,8) -> Route117 warp 0",
  "data/scripts/day_care.inc:73-84 (the lady: GetDaycareState, no mon -> 'Would you like us to raise one?' YES/NO)",
  "data/scripts/day_care.inc:86-112 (GiveMonToRaise: CountPartyAliveNonEggMons 2 -> refused; ChooseSendDaycareMon, StoreSelectedPokemonInDaycare, incrementgamestat GAME_STAT_USED_DAYCARE, one mon -> CanRaiseOneMore)",
  "data/scripts/day_care.inc:114-118,130-133 ('We can raise one more' YES -> GiveMonToRaise; OnlyTwoAliveMons: 'you'll be left with just one')",
  "src/daycare.c:1294-1298 (ChooseSendDaycareMon -> ChooseMonForDaycare, src/party_menu.c:6197-6199 PARTY_MENU_TYPE_DAYCARE)",
  "src/party_menu.c:2668-2669, src/data/party_menu.h:717 (A on a Pokemon: STORE / SUMMARY / CANCEL)",
  "src/daycare.c:879-895 (TryProduceOrHatchEgg: each step; at mons[1].steps & 0xFF == 0xFF an egg roll against the compatibility score)",
  "src/daycare.c:1015-1043 (GetDaycareCompatibilityScore: Ditto + another OT -> PARENTS_MED_COMPATIBILITY 50)",
  "src/daycare.c:455-496 (TriggerPendingDaycareEgg: offspringPersonality, FLAG_PENDING_DAYCARE_EGG)",
  "include/constants/flags.h:156 (FLAG_PENDING_DAYCARE_EGG 0x86)",
  "data/maps/Route117/map.json object_events[2] (47,4) the Day-Care Man, warp_events[0] (51,5) the Day Care door",
  "data/maps/Route117/scripts.inc:5-13 (OnTransition moves the man to (47,6) when an egg is pending; the laps make no transition)",
  "data/scripts/day_care.inc:1-11,13-15 (the man: GetDaycareState DAYCARE_EGG_WAITING -> 'do you want it?' YES/NO)",
  "data/scripts/day_care.inc:24-40 (party < 6 -> 'received the EGG!', GiveEggFromDaycare, clearflag FLAG_PENDING_DAYCARE_EGG)",
  "src/daycare.c:842,869 (the egg's friendship = eggCycles: MAGIKARP 5, src/data/pokemon/species_info.h:3899)",
  "src/daycare.c:897-929 (every 255 steps each egg's cycle count drops by GetEggCyclesToSubtract: 1 without Flame Body/Magma Armor; at 0 it hatches)",
  "src/field_control_avatar.c:554-558 (ShouldEggHatch -> GAME_STAT_HATCHED_EGGS, EventScript_EggHatch)",
  "data/scripts/day_care.inc:261-266 (EventScript_EggHatch: special EggHatch)",
  "src/start_menu.c:315-337 (BuildNormalStartMenu: no Pokedex -> POKEMON first)",
  "include/constants/game_stat.h:17,51 (GAME_STAT_HATCHED_EGGS 13, GAME_STAT_USED_DAYCARE 47)",
]
notes = "Emerald's script refuses a deposit when only two non-egg Pokemon are alive (day_care.inc:88-90): Ruby's three-member party (ruby/60) gets 'If you leave that POKEMON with me, you'll be left with just one' after DITTO, so this start carries a fourth, ZIGZAGOON. MAGIKARP's 5 cycles take 1276-1530 steps after the egg (no Flame Body / Magma Armor in the party). Laps run on Route 117's path (53,6)/(54,6): no grass, out of every trainer's sight. The parents stay in the Day Care, so the hatch laps may roll the next egg (FLAG_PENDING_DAYCARE_EGG set again at the end: not checked)."

[start]
recipe = "start.recipe"

[run]
frames = 27100

[[step]]
do = "walk_to"
x = 2
z = 4
face = "up"
interact = true
note = "across the counter from the Day-Care Lady (2,2): 'Would you like us to raise one?' (day_care.inc:73-84)"

[[step]]
do = "menu"
choose = 0
note = "YES -> 'Which POKeMON should we raise for you?', fade, ChooseSendDaycareMon (day_care.inc:86-93)"

[[step]]
do = "wait_frames"
n = 100
note = "'Which POKeMON should we raise for you?' printed (a MSGBOX_DEFAULT: waits for A)"

[[step]]
do = "press"
keys = "A"
gap = 150
shot = "party-first"
note = "fadescreen, ChooseSendDaycareMon: the Day Care party menu, DITTO (slot 0) highlighted, four Pokemon"

[[step]]
do = "press"
keys = "A"
gap = 40
shot = "store-ditto"
note = "STORE / SUMMARY / CANCEL (party_menu.c:2668-2669), cursor on STORE"

[[step]]
do = "press"
keys = "A"
gap = 60
note = "STORE -> back to the field: DITTO's cry, 'Fine, we'll raise your DITTO for a while.' (day_care.inc:97-103)"

[[step]]
do = "menu"
choose = 0
note = "one mon in the Day Care -> 'We can raise one more. Would you like...?' YES (day_care.inc:104-105,114-116)"

[[step]]
do = "wait_frames"
n = 100
note = "three alive -> 'Which POKeMON should we raise for you?' again (day_care.inc:86-93)"

[[step]]
do = "press"
keys = "A"
gap = 150
note = "the party menu again: MUDKIP (slot 0), MAGIKARP (slot 1), ZIGZAGOON (slot 2)"

[[step]]
do = "press"
keys = "DOWN"
gap = 20
shot = "party-second"
note = "slot 1: MAGIKARP (DOWN = the next slot)"

[[step]]
do = "press"
keys = "A"
gap = 40
shot = "store-magikarp"
note = "STORE / SUMMARY / CANCEL"

[[step]]
do = "press"
keys = "A"
gap = 60
note = "STORE -> 'Fine, we'll raise your MAGIKARP for a while.'"

[[step]]
do = "advance_text"
shot = "stored-both"
note = "two mons: the lady's script releases (day_care.inc:104-107)"

[[step]]
do = "walk_to"
x = 2
z = 8
note = "the door mat (warp 0) -> Route 117 (51,5)"

[[step]]
do = "wait_map"
map = "MAP_ROUTE117"

[[step]]
do = "pace"
x = 53
z = 6
every = 64
until = '0x86 in s["flags"]'
max = 30000
shot = "egg-pending"
note = "laps until the egg roll sets FLAG_PENDING_DAYCARE_EGG (daycare.c:889-894, 455-496)"

[[step]]
do = "walk_to"
x = 47
z = 5
face = "up"
interact = true
note = "the Day-Care Man (47,4) across the fence (no map transition since the flag: he has not moved): DAYCARE_EGG_WAITING (day_care.inc:1-6)"

[[step]]
do = "menu"
choose = 0
note = "'Your POKeMON had an EGG! ... do you want it?' YES (day_care.inc:13-15)"

[[step]]
do = "wait_frames"
n = 90
shot = "egg-received"
note = "'... received the EGG!' fanfare (day_care.inc:31-35)"

[[step]]
do = "advance_text"
note = "'Take good care of it.', GiveEggFromDaycare, FLAG_PENDING_DAYCARE_EGG cleared (day_care.inc:36-40)"

[[step]]
do = "dump"
expr = '[(m["species"], m["is_egg"]) for m in s["party"]]'
note = "the party with the egg: MUDKIP, ZIGZAGOON and a MAGIKARP egg"

[[step]]
do = "hatch"
x = 53
z = 6
max = 30000
note = "laps until the MAGIKARP egg's 5 cycles run out: EventScript_EggHatch, the hatch scene (field_control_avatar.c:554-558)"

[[step]]
do = "press"
keys = "START"
gap = 30
note = "start menu: POKEMON (entry 0, FLAG_SYS_POKEMON_GET; no Pokedex) (start_menu.c:315-324)"

[[step]]
do = "press"
keys = "A"
gap = 120
shot = "party-hatched"
note = "the party screen: MUDKIP, ZIGZAGOON, MAGIKARP lv5 (hatched)"

[[step]]
do = "press"
keys = "B"
gap = 90
note = "back to the start menu"

[[step]]
do = "press"
keys = "B"
gap = 30

[[step]]
do = "wait_field"

[expect]
map = "MAP_ROUTE117"
log = ['dump: .* = \[\(283, False\), \(288, False\), \(129, True\)\]']
party_size = 3
save = [
  '[m["species"] for m in s["party"]] == [283, 288, 129]',
  'not any(m["is_egg"] for m in s["party"])',
  's["game_stats"][47] >= 2',
  's["party"][2]["level"] == 5',
  's["game_stats"][13] >= 1',
]
