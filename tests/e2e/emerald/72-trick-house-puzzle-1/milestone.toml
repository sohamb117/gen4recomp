# Proves Emerald's Trick House first challenge: "You're being watched", the Trick Master found beneath the desk (6,3),
# the hole behind the scroll (YES), Puzzle 1's Cut maze (Emerald's layout: the scroll at (3,16), not R/S's (14,8)) and
# its trainers to the scroll's secret code and the door, the Trick Master's Rare Candy in the end room
# (VAR_TRICK_HOUSE_LEVEL 1), and the corridor back to Route 110.
# Start: Route 110 (11,67) -> end: MAP_ROUTE110 (11,67).
title = "Trick House: the first puzzle (Cut maze) and its reward"
priority = "P1"
estimate = 13896
refs = [
  "data/maps/Route110/map.json warp_events[1] (11,66) -> ROUTE110_TRICK_HOUSE_ENTRANCE",
  "data/maps/Route110_TrickHouseEntrance/scripts.inc:16-29 (OnTransition: FLAG_LANDMARK_TRICK_HOUSE; ENTRANCE_STATE 0 -> BEING_WATCHED_STATE 0), :133-149 (the Trick Master hidden at (6,3))",
  "data/maps/Route110_TrickHouseEntrance/map.json coord_events (4,7),(5,6),(6,6),(7,7) BEING_WATCHED_STATE 0 -> TrickMasterHiding",
  "data/maps/Route110_TrickHouseEntrance/scripts.inc:646-654 (TrickMasterHiding: 'You're being watched', BEING_WATCHED_STATE 1)",
  "data/maps/Route110_TrickHouseEntrance/scripts.inc:219-249 (TrickMaster ENTRANCE_STATE 0 -> FoundTrickMaster: 'concealed beneath the desk', FOUND_TRICK_MASTER 1, warpsilent (6,2))",
  "data/maps/Route110_TrickHouseEntrance/scripts.inc:195-213 (OnFrame BeginChallenge: the Trick Master jumps away, ENTRANCE_STATE 1, FOUND_TRICK_MASTER 0)",
  "data/maps/Route110_TrickHouseEntrance/scripts.inc:429-475 (the scroll door bg (5,1): ENTRANCE_STATE 1 -> 'go in the hole?' YES -> MAP_ROUTE110_TRICK_HOUSE_PUZZLE1 (0,21))",
  "data/maps/Route110_TrickHousePuzzle1/map.json (Sally (14,20), Eddie (14,8), Robin (2,15), 15 Cut trees, the scroll bg (3,16), the stairs warp (13,1) -> END)",
  "data/maps/Route110_TrickHousePuzzle1/scripts.inc:13-21 (Scroll: PUZZLE_1_STATE 0 -> 1) -> Route110_TrickHouseEntrance/scripts.inc:638-644 ('found a scroll')",
  "src/field_control_avatar.c:384 (MB_TRICK_HOUSE_PUZZLE_DOOR -> Route110_TrickHousePuzzle_EventScript_Door)",
  "data/maps/Route110_TrickHouseEntrance/scripts.inc:535-556 (Puzzle1 door: PUZZLE_1_STATE 1 -> 2, the stairs at (13,1))",
  "data/maps/Route110_TrickHouseEnd/scripts.inc:42-68 (Trick Master, TRICK_HOUSE_LEVEL 0 -> CompletedPuzzle1: giveitem ITEM_RARE_CANDY)",
  "data/maps/Route110_TrickHouseEnd/scripts.inc:178-184 (TrickMasterExit: addvar VAR_TRICK_HOUSE_LEVEL 1)",
  "data/maps/Route110_TrickHouseCorridor/scripts.inc:5-7 (ENTER_FROM_CORRIDOR 1) -> Entrance OnTransition :18,41-45 (ENTRANCE_STATE 5)",
  "TRAINER_SALLY (611), TRAINER_EDDIE (332), TRAINER_ROBIN (612) (include/constants/opponents.h)",
]
notes = "Ruby's dir (ruby/64) runs on Emerald up to the puzzle room and stops at the locked door: R/S's scroll at (14,8) is Eddie's tile in Emerald's layout, so the code is never found. Emerald's scroll is the bg sign (3,16) (any facing), read from (3,17) in the maze's south-west pocket. Lead: Swampert 40 with Cut (slot 4); the trainers walk_to meets are fought. talk_to finds the hidden Trick Master (hideobjectat keeps the object) and talks from (6,2)."

[start]
recipe = "start.recipe"

[run]
frames = 20900

[[step]]
do = "walk_to"
x = 11
z = 66
note = "the Trick House door -> ENTRANCE (5,7)"

[[step]]
do = "walk_to"
x = 5
z = 6
on_text = "stop"
note = "coord event (5,6), BEING_WATCHED_STATE 0: 'You're being watched...'"

[[step]]
do = "wait_frames"
n = 60
shot = "being-watched"

[[step]]
do = "advance_text"

[[step]]
do = "talk_to"
id = 1
note = "the hidden Trick Master at (6,3), beneath the desk"

[[step]]
do = "wait_frames"
n = 60
shot = "trick-master-found"

[[step]]
do = "advance_text"
note = "warp in place, BeginChallenge: the Trick Master jumps away (ENTRANCE_STATE 1)"

[[step]]
do = "walk_to"
x = 5
z = 2
face = "up"
interact = true
note = "the scroll (5,1): 'go in the hole behind the scroll?'"

[[step]]
do = "advance_text"
note = "YES (the cursor's default) -> MAP_ROUTE110_TRICK_HOUSE_PUZZLE1 (0,21)"

[[step]]
do = "wait_map"
map = "MAP_ROUTE110_TRICK_HOUSE_PUZZLE1"

[[step]]
do = "wait_field"

[[step]]
do = "walk_to"
x = 3
z = 17
hm = true
face = "up"
interact = true
note = "Cut through the maze to the scroll (3,16); the trainers in sight are fought"

[[step]]
do = "wait_frames"
n = 30
shot = "found-scroll"

[[step]]
do = "advance_text"
note = "PUZZLE_1_STATE 1: the secret code memorized"

[[step]]
do = "walk_to"
x = 13
z = 2
hm = true
face = "up"
interact = true
note = "the locked door (13,1)"

[[step]]
do = "wait_frames"
n = 20
shot = "door-open"
note = "'wrote down the secret code on the door... the lock opened' (Puzzle1_EventScript_Door)"

[[step]]
do = "advance_text"
note = "PUZZLE_1_STATE 2: the stairs at (13,1)"

[[step]]
do = "walk_to"
x = 13
z = 1
note = "the stairs -> MAP_ROUTE110_TRICK_HOUSE_END (10,1)"

[[step]]
do = "wait_map"
map = "MAP_ROUTE110_TRICK_HOUSE_END"

[[step]]
do = "wait_field"

[[step]]
do = "talk_to"
id = 1
note = "'You've made it to me?'"

[[step]]
do = "wait_frames"
n = 30
shot = "trick-master-end"

[[step]]
do = "advance_text"
note = "ITEM_RARE_CANDY; the Trick Master spins away, TRICK_HOUSE_LEVEL 1"

[[step]]
do = "walk_to"
x = 2
z = 1
note = "the end room's exit (2,1) -> CORRIDOR"

[[step]]
do = "wait_map"
map = "MAP_ROUTE110_TRICK_HOUSE_CORRIDOR"

[[step]]
do = "walk_to"
x = 4
z = 23
note = "the corridor's bottom -> ENTRANCE (5,2)"

[[step]]
do = "wait_map"
map = "MAP_ROUTE110_TRICK_HOUSE_ENTRANCE"

[[step]]
do = "walk_to"
map = "MAP_ROUTE110"
x = 11
z = 67
shot = "route110"

[expect]
map = "MAP_ROUTE110"
battles = 1
flags = ["FLAG_LANDMARK_TRICK_HOUSE"]
save = ['any(i["item"] == 68 and i["qty"] >= 1 for i in s["bag"]["items"])']

[expect.vars]
VAR_TRICK_HOUSE_LEVEL = 1
VAR_TRICK_HOUSE_PUZZLE_1_STATE = 2
VAR_TRICK_HOUSE_ENTRANCE_STATE = 5
