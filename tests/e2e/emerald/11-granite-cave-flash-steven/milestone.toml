# Proves Route 106 to Granite Cave, the 1F Hiker's HM05 Flash, the floors down and back up to the west side and
# Steven (FLAG_DELIVERED_STEVEN_LETTER, TM47 Steel Wing, FLAG_REGISTERED_STEVEN_POKENAV); back out to Dewford.
# Start: Dewford dock -> end: MAP_DEWFORD_TOWN, outside the gym door (8,18).
title = "Granite Cave: HM05 Flash and Steven's letter"
status = "planned"
priority = "P0"
estimate = 12000
refs = [
  "data/maps/DewfordTown/map.json connections up MAP_ROUTE106 offset -60",
  "data/maps/Route106/map.json warp_events[0] (48,16) -> GRANITE_CAVE_1F",
  "data/maps/GraniteCave_1F/map.json object_events[1] HIKER (36,9)",
  "data/maps/GraniteCave_1F/scripts.inc:4-15",
  "data/maps/GraniteCave_1F/map.json warp_events (35,3)/(17,11)/(5,10)",
  "data/maps/GraniteCave_B1F/map.json warp_events 0..6",
  "data/maps/GraniteCave_B1F/scripts.inc:9 (setholewarp B2F: cracked floor)",
  "data/maps/GraniteCave_B2F/map.json warp_events 0..4",
  "data/maps/GraniteCave_StevensRoom/map.json object_events[1] STEVEN (7,8)",
  "data/maps/GraniteCave_StevensRoom/scripts.inc:4-32",
  "src/party_menu.c:121 (Flash needs FLAG_BADGE02_GET)",
]
notes = "HM05 Flash: FLAG_RECEIVED_HM_FLASH here; Flash needs the Knuckle Badge (src/party_menu.c:121) so the cave is walked dark (1F/B1F/B2F are dark; walk_to uses the probe's collision, not the screen [INFERENCE]). Route to Steven's room: 1F (35,3) -> B1F (25,13); B1F (29,13) -> B2F (29,13); B2F north to (8,5)/(12,3) -> B1F west; B1F (4,21) -> 1F (17,11); 1F west to (5,10) [INFERENCE from the warp table; B1F's cracked floor drops to B2F without the Mach Bike]."

[start]
from = "prev"
# lab = "lab.recipe"  # GBA lab recipes: not written yet (owner tooling)

[run]
frames = 60000

