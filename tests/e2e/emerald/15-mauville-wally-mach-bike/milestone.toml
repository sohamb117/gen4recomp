# Proves Wally at the gym door (YES -> TRAINER_WALLY_MAUVILLE, FLAG_DEFEATED_WALLY_MAUVILLE, Scott) and Rydel's
# Mach Bike (FLAG_RECEIVED_BIKE, multichoice MULTI_BIKE case 0); the bike is needed at Sky Pillar (39).
# Start: Mauville Pokemon Center (22,6) -> end: MAP_MAUVILLE_CITY outside the bike shop (35,6).
title = "Mauville: Wally's battle and the Mach Bike"
priority = "P0"
estimate = 5103
refs = [
  "data/maps/MauvilleCity/map.json object_events[6] WALLY (8,6), [7] uncle (9,6)",
  "data/maps/MauvilleCity/scripts.inc:84-160",
  "data/maps/MauvilleCity/scripts.inc:187-200",
  "TRAINER_WALLY_MAUVILLE (656), src/data/trainers.h:7876",
  "data/maps/MauvilleCity/map.json warp_events[2] (35,5) -> BIKE_SHOP",
  "data/maps/MauvilleCity_BikeShop/scripts.inc:4-45",
]
notes = "Wally: TRAINER_WALLY_MAUVILLE (656): RALTS 16. Rydel: \"came from far away?\" YES (cursor on YES) -> FLAG_RECEIVED_BIKE -> multichoice MULTI_BIKE (case 0 = MACH BIKE, MauvilleCity_BikeShop/scripts.inc:24-27): A on the first entry. The Mach Bike crosses Sky Pillar's cracked floors (and Granite Cave B1F's); Acro is never needed on the story path [INFERENCE]."

[start]
from = "prev"
