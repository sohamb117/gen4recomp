# Proves Emerald's Pokemon Contest at Lilycove (where R/S's 69 is Verdanturf's): the receptionist gives the Pokeblock
# Case to a player without one (no Contest Pass in Emerald), ENTER, the rank menu (Emerald holds every rank in one
# hall: NORMAL), COOL, Hitmonlee chosen and led into the Cool contest hall, five appeals (a move chosen each turn:
# JUMP_KICK, FOCUS_ENERGY, MEGA_KICK, HI_JUMP_KICK, JUMP_KICK) and the win: GAME_STAT_WON_CONTEST and the Cool Ribbon
# (FLAG_SYS_RIBBON_GET), then back to the lobby.
# Start: start.recipe (Hitmonlee 50) at MAP_LILYCOVE_CITY_CONTEST_LOBBY (14,4) -> end: the lobby (14,4).
title = "Contest: Lilycove's Normal Rank Cool contest won"
priority = "P1"
estimate = 23121
refs = [
  "data/maps/LilycoveCity_ContestLobby/map.json object_events[0] (14,2) the contest receptionist",
  "data/scripts/contest_hall.inc:2-20 (no Pokeblock Case: giveitem ITEM_POKEBLOCK_CASE, FLAG_RECEIVED_POKEBLOCK_CASE)",
  "data/scripts/contest_hall.inc:42-50 (MULTI_ENTERINFO: ENTER 0), 97-110 (MULTI_CONTEST_RANK: NORMAL 0), 130-140 (MULTI_CONTEST_TYPE: COOL 0)",
  "data/scripts/contest_hall.inc:84-95,177-182 (choosecontestmon, TryEnterContestMon, VAR_CONTEST_HALL_STATE 1)",
  "data/maps/LilycoveCity_ContestLobby/scripts.inc:352-365 (WarpToContestHall: MAP_CONTEST_HALL_COOL 7,5)",
  "data/scripts/contest_hall.inc:183-202 (ContestHall_EventScript_DoContest: the appeals, the results, the winner's prize)",
  "data/scripts/contest_hall.inc:1115-1125 (ReceiveContestRibbon: GiveMonContestRibbon, GAME_STAT_RECEIVED_RIBBONS, FLAG_SYS_RIBBON_GET)",
  "data/maps/ContestHall/scripts.inc:413 (SetExitWarpNormalContest: back to the lobby (14,4))",
  "src/contest_util.c:658-660 (GAME_STAT_ENTERED_CONTEST, GAME_STAT_WON_CONTEST)",
  "src/contest.c:1498-1520 (Task_TryShowMoveSelectScreen: A opens the move list), 1556-1600 (Task_HandleMoveSelectInput: DOWN, A)",
  "src/data/contest_moves.h:196,204,924,1084 (MEGA_KICK, JUMP_KICK, FOCUS_ENERGY, HI_JUMP_KICK: Cool appeals, the FOCUS_ENERGY -> MEGA_KICK combo)",
  "include/constants/game_stat.h:40-41 (GAME_STAT_ENTERED_CONTEST 36, GAME_STAT_WON_CONTEST 37), :46 (GAME_STAT_RECEIVED_RIBBONS 42)",
]
notes = "Hitmonlee's conditions are 0 (no lab verb writes them), so round 1 gives it nothing; the five Cool appeals and the applause meter outscore the Normal Rank opponents. The contest screens are not in the probe: appeals.press plays them (DOWN/A alternating; its header). The run is deterministic for this start: the opponents and their AI rolls are the RNG's."

[start]
recipe = "start.recipe"

[run]
frames = 34700

[[step]]
do = "walk_to"
x = 14
z = 4
face = "up"
interact = true
note = "the receptionist across the counter (map.json object_events[0] (14,2))"

[[step]]
do = "menu"
choose = 0
count = 3
shot = "enter"
note = "the Pokeblock Case given (contest_hall.inc:12-17), then ENTER (MULTI_ENTERINFO)"

[[step]]
do = "menu"
choose = 0
count = 5
note = "NORMAL RANK (MULTI_CONTEST_RANK; VAR_CONTEST_RANK 0)"

[[step]]
do = "menu"
choose = 0
count = 6
note = "COOL (MULTI_CONTEST_TYPE; VAR_CONTEST_CATEGORY 0)"

[[step]]
do = "advance_text"
map = "MAP_CONTEST_HALL_COOL"
note = "'Which POKEMON?' -> party slot 0 (A), 'entry number 4', the walk into the Cool contest hall (contest_hall.inc:84-95,177-182; LilycoveCity_ContestLobby/scripts.inc:352-365)"

[[step]]
do = "schedule"
file = "appeals.press"
frames = 20000
note = "the entry presentation, round 1, five appeals (slots 1,2,3,0,1), the results, the ribbon (appeals.press)"

[[step]]
do = "advance_text"
map = "MAP_LILYCOVE_CITY_CONTEST_LOBBY"
note = "the MC's winner announcement, the ribbon text (A only), then ContestHall/scripts.inc:413 warps back to (14,4)"

[[step]]
do = "wait_field"
shot = "lobby"

[[shots]]
frames = [3000, 7000, 12000, 17000, 20500, 22000]

[expect]
map = "MAP_LILYCOVE_CITY_CONTEST_LOBBY"
position = [14, 4]
flags = ["FLAG_RECEIVED_POKEBLOCK_CASE", "FLAG_SYS_RIBBON_GET"]
save = [
  's["game_stats"][36] >= 1',
  's["game_stats"][37] >= 1',
  's["game_stats"][42] >= 1',
  'any(i["item"] == 273 for i in s["bag"]["key_items"])',
]
