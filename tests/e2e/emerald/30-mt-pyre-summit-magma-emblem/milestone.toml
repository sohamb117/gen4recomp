# Proves Route 122 (Surf) to Mt. Pyre, 1F -> exterior -> summit, the four summit grunts and the TeamAquaExits coord
# scene (22..24,7) VAR_MT_PYRE_STATE 0 -> 1: the old lady's ITEM_MAGMA_EMBLEM (FLAG_RECEIVED_RED_OR_BLUE_ORB).
# Start: Lilycove (27,8) -> end: MAP_MT_PYRE_SUMMIT below the old couple (23,7).
title = "Mt. Pyre summit: Aqua takes the Red Orb, the Magma Emblem"
priority = "P0"
estimate = 18792
refs = [
  "data/maps/Route121/map.json connections down ROUTE122 offset 20",
  "data/maps/Route122/map.json warp_events[0] (22,29) -> MT_PYRE_1F",
  "data/maps/MtPyre_1F/map.json warp_events[1] (3,6) -> EXTERIOR",
  "data/maps/MtPyre_Exterior/map.json warp_events[1] (19,10) -> SUMMIT",
  "data/maps/MtPyre_Summit/map.json object_events 4..7 grunts",
  "data/maps/MtPyre_Summit/map.json coord_events (22..24,7) VAR_MT_PYRE_STATE=0",
  "data/maps/MtPyre_Summit/scripts.inc:14-62",
  "TRAINER_GRUNT_MT_PYRE_1 (23), src/data/trainers.h:280",
  "TRAINER_GRUNT_MT_PYRE_2 (24), src/data/trainers.h:292",
  "TRAINER_GRUNT_MT_PYRE_3 (25), src/data/trainers.h:304",
  "TRAINER_GRUNT_MT_PYRE_4 (569), src/data/trainers.h:6832",
]
notes = "Summit grunts (sight 3): TRAINER_GRUNT_MT_PYRE_1 (23): ZUBAT 32; TRAINER_GRUNT_MT_PYRE_2 (24): CARVANHA 32; TRAINER_GRUNT_MT_PYRE_3 (25): POOCHYENA 30, CARVANHA 30; TRAINER_GRUNT_MT_PYRE_4 (569): WAILMER 30, ZUBAT 30. Emerald: Archie leaves with the Red Orb, the old lady hands over the Magma Emblem (the flag is named FLAG_RECEIVED_RED_OR_BLUE_ORB, MtPyre_Summit/scripts.inc:58-59) and hides the Jagged Pass guard (:60). The exterior has fog/sun weather triggers only. Route 121 -> 122 needs Surf."

[start]
from = "prev"
# lab = "lab.recipe"  # GBA lab recipes: not written yet (owner tooling)

[run]
frames = 28200

[[step]]
do = "walk_to"
x = 22
z = 30
map = "MAP_ROUTE122"
surf = true
note = "west onto Route 121, south into Route 122 (Surf) to Mt. Pyre's door [INFERENCE: (22,30) is the landing tile]"

[[step]]
do = "walk_to"
x = 22
z = 29
note = "Mt. Pyre door (Route 122 warp 0) -> MT_PYRE_1F (17,18)"

[[step]]
do = "wait_map"
map = "MAP_MT_PYRE_1F"

[[step]]
do = "walk_to"
x = 3
z = 6
note = "1F west door (warp 1) -> MT_PYRE_EXTERIOR (10,42)"

[[step]]
do = "wait_map"
map = "MAP_MT_PYRE_EXTERIOR"

[[step]]
do = "walk_to"
x = 19
z = 10
note = "summit gate (warp 1) -> MT_PYRE_SUMMIT (22..24,31)"

[[step]]
do = "wait_map"
map = "MAP_MT_PYRE_SUMMIT"

[[step]]
do = "walk_to"
x = 23
z = 7
on_text = "stop"
note = "north past the grunts (21,15) E, (25,18) W, (21,11) E, (25,11) W (sight 3) to TeamAquaTrigger1 (23,7)"

[[step]]
do = "advance_text"
shot = "magma-emblem"
note = "TeamAquaExits: Archie + grunts removed, MT_PYRE_STATE 1, old lady: ITEM_MAGMA_EMBLEM, FLAG_RECEIVED_RED_OR_BLUE_ORB, FLAG_HIDE_JAGGED_PASS_MAGMA_GUARD (MtPyre_Summit/scripts.inc:32-62)"

[expect]
map = "MAP_MT_PYRE_SUMMIT"
badges = 6
flags = ["FLAG_BADGE01_GET", "FLAG_BADGE02_GET", "FLAG_BADGE03_GET", "FLAG_BADGE04_GET", "FLAG_BADGE05_GET", "FLAG_BADGE06_GET", "FLAG_RECEIVED_RED_OR_BLUE_ORB", "FLAG_HIDE_JAGGED_PASS_MAGMA_GUARD", "FLAG_HIDE_MT_PYRE_SUMMIT_ARCHIE", "FLAG_HIDE_MT_PYRE_SUMMIT_TEAM_AQUA"]
battles = 2

[expect.vars]
VAR_MT_PYRE_STATE = 1
