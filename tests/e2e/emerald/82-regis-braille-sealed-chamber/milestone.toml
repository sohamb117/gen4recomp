# Proves Emerald's Sealed Chamber and a Regi: Dive on Route 134 to the underwater chamber and its Braille, surface
# inside, Dig at the "DIG HERE" Braille (FLAG_SYS_BRAILLE_DIG), and with WAILORD first and RELICANTH last (Emerald's
# order, R/S's flipped) the inner room's Braille opens the Regi doors (FLAG_REGI_DOORS_OPENED); then Dig out, surface,
# Fly to Petalburg, surf Route 105 to Island Cave, run Emerald's lap around its wall (FLAG_SYS_BRAILLE_REGICE_COMPLETED,
# where R/S wait) and battle REGICE lv40 (FLAG_DEFEATED_REGICE).
# Start: MAP_ROUTE134 (60,31) surfing on the deep-water patch -> end: MAP_ISLAND_CAVE, Regice's chamber.
title = "Sealed Chamber Braille and Regice"
priority = "P2"
estimate = 18901
refs = [
  "data/maps/Route134/scripts.inc:5-7 (OnResume setdivewarp MAP_UNDERWATER_ROUTE134 (8,6)); data/scripts/field_move_scripts.inc:216-262 (EventScript_UseDive / UseDiveUnderwater YES/NO)",
  "src/field_control_avatar.c:465-476 (Dive down: FLAG_BADGE07_GET + deep water; emerge underwater)",
  "data/maps/Underwater_Route134/map.json warp_events[0] (8,8) -> MAP_UNDERWATER_SEALED_CHAMBER warp 0 (7,1)",
  "data/maps/Underwater_SealedChamber/map.json bg (12,43) 'GO UP HERE'; scripts.inc:1-17 (OnDive: at (12,44) the dive warp is MAP_SEALED_CHAMBER_OUTER_ROOM (10,19), else MAP_ROUTE134 (60,31))",
  "data/maps/SealedChamber_OuterRoom/scripts.inc:7-14 (OnResume: dive and escape warps to MAP_UNDERWATER_SEALED_CHAMBER (12,44); FLAG_LANDMARK_SEALED_CHAMBER)",
  "src/fldeff_dig.c:17-60 (Dig: at the Braille spot DoBrailleDigEffect, elsewhere the escape warp); src/braille_puzzles.c:61-90 (ShouldDoBrailleDigEffect (9..11,3), DoBrailleDigEffect opens (9..11,1..2), FLAG_SYS_BRAILLE_DIG)",
  "data/maps/SealedChamber_OuterRoom/map.json warp_events[0] (10,2) -> MAP_SEALED_CHAMBER_INNER_ROOM",
  "data/maps/SealedChamber_InnerRoom/scripts.inc:4-27 (BrailleBackWall (10,4): 'FIRST COMES WAILORD, LAST COMES RELICANTH', CheckRelicanthWailord, the shaking, setflag FLAG_REGI_DOORS_OPENED)",
  "src/braille_puzzles.c:92-104 (CheckRelicanthWailord: party[0] WAILORD, the last RELICANTH; 'Emerald change: why did they flip it?')",
  "src/party_menu.c:2607-2630 (the field popup: SUMMARY, then the field moves in move order)",
  "src/data/region_map/region_map_entries.h:551-556 (ROUTE_134 (9,10) 3x1: from x 60 the cursor is on (11,10)), :257-262 (PETALBURG (1,9)): LEFT x10, UP x1",
  "src/data/heal_locations.h:19-24 (HEAL_LOCATION_PETALBURG_CITY (20,17))",
  "data/maps/Route105/scripts.inc:7-14 (OnLoad: without FLAG_REGI_DOORS_OPENED rock walls on (9,19..20)); data/maps/Route105/map.json warp_events[0] (9,20) -> MAP_ISLAND_CAVE",
  "data/maps/IslandCave/scripts.inc:52-60 (the Braille (8,20) 'RUN A LAP AROUND THE WALL': FLAG_TEMP_REGICE_PUZZLE_STARTED)",
  "src/braille_puzzles.c:17-54,283-343 (sRegicePathCoords: the 36 tiles of the lap; every step on one sets its bit, a step off them fails the puzzle; all 36 and back on (8,21) -> TRUE)",
  "src/field_control_avatar.c:565-568 (ShouldDoBrailleRegicePuzzle -> IslandCave_EventScript_OpenRegiEntrance); data/maps/IslandCave/scripts.inc:40-50 (opens (7..9,19..20), FLAG_SYS_BRAILLE_REGICE_COMPLETED)",
  "data/maps/IslandCave/map.json warp_events[1] (8,20) -> warp 2 (8,11); object_events[0] (8,7) REGICE",
  "data/maps/IslandCave/scripts.inc:90-112 (setwildbattle SPECIES_REGICE 40, StartRegiBattle; won -> FLAG_DEFEATED_REGICE, Common_EventScript_RemoveStaticPokemon: FLAG_HIDE_REGICE)",
  "include/constants/flags.h:482,987,1443,1455 (FLAG_DEFEATED_REGICE, FLAG_HIDE_REGICE, FLAG_SYS_BRAILLE_REGICE_COMPLETED, FLAG_LANDMARK_SEALED_CHAMBER)",
]
notes = "Ruby's dir (ruby/82) cannot run on Emerald: its recipe names R/S's VAR_PETALBURG_STATE, its party has R/S's RELICANTH-first order (Emerald checks WAILORD first, RELICANTH last), its popup keys assume field moves first, and Island Cave's R/S Braille is a 7200-frame wait where Emerald's asks for a lap around the wall (src/braille_puzzles.c:283-343). Regice is the Regi this milestone battles: Emerald's Desert Ruins needs Strength and Rock Smash at its Braille, the Ancient Tomb Fly in the middle of the room. The lap is a fixed `steps` route over exactly the 36 sRegicePathCoords tiles (any other tile fails it): east along row 21, down the east side, west along row 29, up the west side, back to (8,21). The start is on Route 134's dive patch because the currents around it are not plannable by walk_to (gba_world.py FORBIDDEN). Fly and Dig are presses (no GBA fly bot). Regice is knocked out by auto_battle."

[start]
recipe = "start.recipe"

[run]
frames = 28400

