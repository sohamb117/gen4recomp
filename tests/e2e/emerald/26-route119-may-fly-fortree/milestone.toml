shot = "hm-fly"
note = "GiveFlyHM: ITEM_HM_FLY, FLAG_RECEIVED_HM_FLY; RivalExitScottArrive: ROUTE119_STATE 1 (:92-160)"

[[step]]
do = "walk_to"
x = 5
z = 7
