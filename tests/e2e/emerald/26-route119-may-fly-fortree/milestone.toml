[expect]
map = "MAP_FORTREE_CITY"
badges = 5
flags = ["FLAG_BADGE01_GET", "FLAG_BADGE02_GET", "FLAG_BADGE03_GET", "FLAG_BADGE04_GET", "FLAG_BADGE05_GET", "FLAG_RECEIVED_HM_FLY", "FLAG_VISITED_FORTREE_CITY"]
