[[step]]
do = "press"
keys = "START"
hold = 5
gap = 295
note = "skip the intro"

[[step]]
do = "press"
keys = "START"
hold = 5
gap = 195
note = "the title screen"

[[step]]
do = "press"
keys = "START"
hold = 5
gap = 150
shot = "main-menu-mystery-gift"
note = "CONTINUE, NEW GAME, MYSTERY GIFT, OPTION (main_menu.c:643-647 IsMysteryGiftEnabled -> HAS_MYSTERY_GIFT)"

