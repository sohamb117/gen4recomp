keys = "A"
gap = 120
shot = "title-screen"
note = "A closes the error: fade, back to the title screen (main_menu.c:1151-1157,1109-1118)"

[[step]]
do = "press"
keys = "START"
hold = 5
gap = 150
note = "the title screen's START (the A presses below also open the main menu)"

[[step]]
