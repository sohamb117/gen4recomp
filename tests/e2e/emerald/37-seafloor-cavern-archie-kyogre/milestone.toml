status = "planned"
priority = "P0"
estimate = 22000
refs = [
  "data/maps/MossdeepCity/map.json connections down ROUTE127",
  "data/maps/Route128/map.json connections dive UNDERWATER_ROUTE128",
  "data/maps/Underwater_Route128/map.json warp_events[0] (38,26) -> UNDERWATER_SEAFLOOR_CAVERN",
  "data/maps/SeafloorCavern_Entrance/scripts.inc:6-7",
  "data/maps/SeafloorCavern_Entrance/map.json warp_events[1] (10,1) -> ROOM1",
  "data/maps/SeafloorCavern_Room1/map.json warp_events[2] (6,2) -> ROOM2",
  "data/maps/SeafloorCavern_Room2/map.json warp_events[3] (11,1) -> ROOM7",
  "data/maps/SeafloorCavern_Room7/map.json warp_events[1] (5,1) -> ROOM3",
  "data/maps/SeafloorCavern_Room3/map.json warp_events[0] (8,1) -> ROOM8",
  "data/maps/SeafloorCavern_Room8/map.json warp_events[0] (5,2) -> ROOM9",
  "data/maps/SeafloorCavern_Room3/scripts.inc:5",
  "data/maps/SeafloorCavern_Room9/map.json coord_events (17,42) VAR_SEAFLOOR_CAVERN_STATE=0",
  "data/maps/SeafloorCavern_Room9/scripts.inc:4-124",
  "data/maps/Route128/scripts.inc:14-67",
  "TRAINER_ARCHIE (34), src/data/trainers.h:412",
  "TRAINER_SHELLY_SEAFLOOR_CAVERN (33), src/data/trainers.h:400",
  "src/party_menu.c:122-123 (Rock Smash, Strength)",
]
notes = "Archie: TRAINER_ARCHIE (34): MIGHTYENA 41, CROBAT 41, SHARPEDO 43; Shelly (Room 3, sight trainer): TRAINER_SHELLY_SEAFLOOR_CAVERN (33): SHARPEDO 37, MIGHTYENA 37; Aqua grunts in rooms 1, 3, 4. Needs Surf + Dive (Mind Badge), Strength (Heat Badge, HM from 17) and Rock Smash (HM from 16); carriers boosted. Room boulders: Room1 (5,11)/(12,11), Room2 five, Room3 seven, Room8 twelve (the boulder wall before Room 9). After the cutscene the game warps to Route 128 (38,22) and Route 128 OnFrame VAR_ROUTE128_STATE 1 plays Steven's scene -> 2."

