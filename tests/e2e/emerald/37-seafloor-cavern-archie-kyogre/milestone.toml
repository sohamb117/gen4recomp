# Shelly, Archie (TRAINER_ARCHIE) and the Kyogre scene: FLAG_KYOGRE_ESCAPED_SEAFLOOR_CAVERN, then Route 128's Steven scene.
# Start: Steven's house -> end: MAP_ROUTE128 after the Kyogre scene (VAR_ROUTE128_STATE 2).
