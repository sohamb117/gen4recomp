# Proves the cracked-ice gym (step on every ice tile once: VAR_ICE_STEP_COUNT opens the stairs; falling drops to B1F) and
# Juan (TRAINER_JUAN_1): FLAG_BADGE08_GET, TM03 Water Pulse, VAR_SOOTOPOLIS_CITY_STATE 6; Waterfall usable.
# Start: Sootopolis (31,33) -> end: MAP_SOOTOPOLIS_CITY at the gym door (31,33).
title = "Sootopolis Gym: Juan and the Rain Badge"
status = "planned"
priority = "P0"
estimate = 14000
refs = [
  "data/maps/SootopolisCity/map.json warp_events[2] (31,32) -> GYM_1F",
  "data/maps/SootopolisCity_Gym_1F/map.json object_events[1] JUAN (8,2)",
  "data/maps/SootopolisCity_Gym_1F/scripts.inc:9-73",
  "data/maps/SootopolisCity_Gym_1F/scripts.inc:80-130",
  "TRAINER_JUAN_1 (272), src/data/trainers.h:3268",
  "data/maps/SootopolisCity/scripts.inc:10",
  "src/party_menu.c:127",
]
notes = "Juan: TRAINER_JUAN_1 (272): LUVDISC 41, WHISCASH 41, SEALEO 43, CRAWDAUNT 43, KINGDRA 46 (Water; Kingdra only weak to Dragon: Swampert neutral; boost ~50 or an Electric/Grass lead). The gym door is locked until FLAG_SOOTOPOLIS_ARCHIE_MAXIE_LEAVE (SootopolisCity/scripts.inc:10). Gym trainers on the ice floors (B1F after a fall) lv ~40."

[start]
from = "prev"
# lab = "lab.recipe"  # GBA lab recipes: not written yet (owner tooling)

[run]
frames = 60000

# PHASE2: the ice route: each 1F ice tile once (VAR_ICE_STEP_COUNT thresholds 8/28/67 open three stairs, SootopolisCity_Gym_1F/scripts.inc:21-64); record a steps route (walk_to would re-step tiles).

[[step]]
do = "walk_to"
x = 31
z = 32
note = "gym door (warp 2) -> SOOTOPOLIS_CITY_GYM_1F (8..9,25)"

[[step]]
do = "wait_map"
map = "MAP_SOOTOPOLIS_CITY_GYM_1F"

[[step]]
do = "walk_to"
x = 8
z = 3
face = "up"
interact = true
note = "below Juan (8,2) [PHASE2: ice route]"

[[step]]
do = "advance_text"

[[step]]
do = "auto_battle"
snap = true
note = "TRAINER_JUAN_1 (272): LUVDISC 41, WHISCASH 41, SEALEO 43, CRAWDAUNT 43, KINGDRA 46"

[[step]]
do = "advance_text"
shot = "rain-badge"
note = "JuanDefeated: FLAG_DEFEATED_SOOTOPOLIS_GYM, FLAG_BADGE08_GET, SOOTOPOLIS_CITY_STATE 6; TM Water Pulse (SootopolisCity_Gym_1F/scripts.inc:91-130)"

[[step]]
do = "walk_to"
x = 8
z = 25
note = "exit -> Sootopolis (31,32)"

[[step]]
do = "wait_map"
map = "MAP_SOOTOPOLIS_CITY"

[expect]
map = "MAP_SOOTOPOLIS_CITY"
badges = 8
flags = ["FLAG_BADGE01_GET", "FLAG_BADGE02_GET", "FLAG_BADGE03_GET", "FLAG_BADGE04_GET", "FLAG_BADGE05_GET", "FLAG_BADGE06_GET", "FLAG_BADGE07_GET", "FLAG_BADGE08_GET", "FLAG_DEFEATED_SOOTOPOLIS_GYM", "FLAG_RECEIVED_TM_WATER_PULSE", "FLAG_HIDE_SOOTOPOLIS_CITY_STEVEN", "FLAG_HIDE_SOOTOPOLIS_CITY_WALLACE"]
battles = 1

[expect.vars]
VAR_SOOTOPOLIS_CITY_STATE = 6
