# Proves Briney to Slateport (Route 109 landing), the shipyard Dock (FLAG_DOCK_REJECTED_DEVON_GOODS hides the Aqua
# queue), the museum fee, Stern on 2F and the two museum grunts -> FLAG_DELIVERED_DEVON_GOODS; the Scott scene outside.
# Start: Dewford (8,18) -> end: MAP_SLATEPORT_CITY outside the museum (30,27).
title = "Sail to Slateport: the shipyard, the Oceanic Museum grunts, Devon Goods to Stern"
status = "planned"
priority = "P0"
estimate = 12000
refs = [
  "data/maps/DewfordTown/scripts.inc:9-35",
  "data/maps/DewfordTown/scripts.inc:141-180",
  "data/maps/Route109/map.json object_events 1/2 Briney boat (21,26)/(21,24)",
  "data/maps/SlateportCity/map.json warp_events[2] (26,38) -> STERNS_SHIPYARD_1F",
  "data/maps/SlateportCity_SternsShipyard_1F/scripts.inc:4-18",
  "data/maps/SlateportCity/map.json object_events 5,18,19,26..33 Aqua queue (FLAG_HIDE_SLATEPORT_CITY_TEAM_AQUA)",
  "data/maps/SlateportCity/map.json warp_events[5] (30,26) -> OCEANIC_MUSEUM_1F",
  "data/maps/SlateportCity_OceanicMuseum_1F/scripts.inc:8-40",
  "data/maps/SlateportCity_OceanicMuseum_1F/map.json warp_events[2] (6,1) -> 2F",
  "data/maps/SlateportCity_OceanicMuseum_2F/scripts.inc:4-81",
  "data/maps/SlateportCity/scripts.inc:7-10",
  "data/maps/SlateportCity/scripts.inc:36-82",
  "TRAINER_GRUNT_MUSEUM_1 (20), src/data/trainers.h:244",
  "TRAINER_GRUNT_MUSEUM_2 (21), src/data/trainers.h:256",
]
notes = "Grunts (back to back, trainerbattle_no_intro): TRAINER_GRUNT_MUSEUM_1 (20): CARVANHA 15; TRAINER_GRUNT_MUSEUM_2 (21): ZUBAT 14, CARVANHA 14. Briney's Dewford menu (multichoicedefault default 2 = CANCEL, DewfordTown/scripts.inc:15): UP once -> SLATEPORT. The museum fee is 50; with less money the attendant lets you in anyway before the delivery (SlateportCity_OceanicMuseum_1F/scripts.inc:42-53). Route 109 beach trainers (Huey, Edmond, Ricky, Lola, Hailey, Chandler) stand off the straight path [INFERENCE]."

[start]
from = "prev"
# lab = "lab.recipe"  # GBA lab recipes: not written yet (owner tooling)

[run]
frames = 60000

[[step]]
do = "walk_to"
x = 12
z = 10
note = "beside Briney (12,9) at the dock [INFERENCE: (12,10) free]"

[[step]]
do = "talk_to"
id = 2
note = "Briney (object 2) -> WhereAreWeBound multichoice (DewfordTown/scripts.inc:9-21)"

[[step]]
do = "press"
keys = "UP"
gap = 30
note = "CANCEL (default 2) -> SLATEPORT (1)"

[[step]]
do = "press"
keys = "A"
note = "ChooseSlateport -> SailToSlateport (:30-35,141-180)"

[[step]]
do = "advance_text"
map = "MAP_ROUTE109"

[[step]]
do = "wait_map"
map = "MAP_ROUTE109"
max = 6000

[[step]]
do = "advance_text"
note = "LandedSlateportDeliverGoods (:175-177)"

[[step]]
do = "walk_to"
x = 26
z = 38
map = "MAP_SLATEPORT_CITY"
note = "north into Slateport, shipyard door (warp 2) -> STERNS_SHIPYARD_1F (2,14)"

[[step]]
do = "wait_map"
map = "MAP_SLATEPORT_CITY_STERNS_SHIPYARD_1F"

[[step]]
do = "talk_to"
id = 1
note = "Dock (object 1 (5,5)) -> FLAG_DOCK_REJECTED_DEVON_GOODS, FLAG_HIDE_SLATEPORT_CITY_TEAM_AQUA (SlateportCity_SternsShipyard_1F/scripts.inc:4-18)"

[[step]]
do = "advance_text"

[[step]]
do = "walk_to"
x = 2
z = 14
note = "exit (warp 0) -> Slateport (26,38)"

[[step]]
do = "wait_map"
map = "MAP_SLATEPORT_CITY"

[[step]]
do = "walk_to"
x = 30
z = 26
note = "museum door (warp 5) -> OCEANIC_MUSEUM_1F (9,8); the Aqua queue is hidden now"

[[step]]
do = "wait_map"
map = "MAP_SLATEPORT_CITY_OCEANIC_MUSEUM_1F"

[[step]]
do = "walk_to"
x = 9
z = 7
on_text = "stop"
note = "PayEntranceFeeLeft coord (9,7) MUSEUM_1F_STATE 0 (:8-40)"

[[step]]
do = "press"
keys = "A"
times = 2
gap = 40
note = "fee YES (cursor on YES) [INFERENCE: count]"

[[step]]
do = "advance_text"
note = "MUSEUM_1F_STATE 1"

[[step]]
do = "walk_to"
x = 6
z = 1
note = "stairs (warp 2) -> 2F"

[[step]]
do = "wait_map"
map = "MAP_SLATEPORT_CITY_OCEANIC_MUSEUM_2F"

[[step]]
do = "talk_to"
id = 1
note = "Capt. Stern (object 1 (13,6)) -> grunts close in (SlateportCity_OceanicMuseum_2F/scripts.inc:4-33)"

[[step]]
do = "advance_text"

[[step]]
do = "auto_battle"
snap = true
note = "TRAINER_GRUNT_MUSEUM_1 (20): CARVANHA 15"

[[step]]
do = "advance_text"

[[step]]
do = "auto_battle"
snap = true
note = "TRAINER_GRUNT_MUSEUM_2 (21): ZUBAT 14, CARVANHA 14"

[[step]]
do = "advance_text"
shot = "stern-goods"
note = "Archie appears and leaves; Devon Goods handed over: FLAG_DELIVERED_DEVON_GOODS, VAR_SLATEPORT_OUTSIDE_MUSEUM_STATE 1, REGISTER_BIRCH_STATE 1, FLAG_HIDE_ROUTE_110_TEAM_AQUA (:53-81)"

[[step]]
do = "walk_to"
x = 6
z = 1
note = "2F stairs -> 1F"

[[step]]
do = "wait_map"
map = "MAP_SLATEPORT_CITY_OCEANIC_MUSEUM_1F"

[[step]]
do = "walk_to"
x = 9
z = 8
note = "exit (warp 0) -> Slateport (30,26)"

[[step]]
do = "wait_map"
map = "MAP_SLATEPORT_CITY"

[[step]]
do = "advance_text"
note = "OUTSIDE_MUSEUM_STATE 1 -> Scott scene: FLAG_ENABLE_SCOTT_MATCH_CALL, OUTSIDE_MUSEUM_STATE 2 (SlateportCity/scripts.inc:10,36-82) [INFERENCE: runs on this transition]"

[expect]
map = "MAP_SLATEPORT_CITY"
badges = 2
flags = ["FLAG_BADGE01_GET", "FLAG_BADGE02_GET", "FLAG_VISITED_SLATEPORT_CITY", "FLAG_DOCK_REJECTED_DEVON_GOODS", "FLAG_HIDE_SLATEPORT_CITY_TEAM_AQUA", "FLAG_DELIVERED_DEVON_GOODS", "FLAG_HIDE_ROUTE_110_TEAM_AQUA", "FLAG_HIDE_SLATEPORT_CITY_OCEANIC_MUSEUM_AQUA_GRUNTS", "FLAG_ENABLE_SCOTT_MATCH_CALL"]
battles = 2

[expect.vars]
VAR_SLATEPORT_OUTSIDE_MUSEUM_STATE = 2
VAR_REGISTER_BIRCH_STATE = 1
