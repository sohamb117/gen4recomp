  "zone_event 0351 object 0 TRAINER_BIRD_KEEPER_KATHERINE (81) (432,520) E2; object 19 TRAINER_RUIN_MANIAC_HARRY (442) (429,525) S2; object 1 TRAINER_NINJA_BOY_NICK (80) (425,520) S1",
  "trdata.json #81 NOCTOWL 31; #442 BRONZOR 30; #80 SKORUPI 27, GOLBAT 27",
  "maps.h:222 MAP_MOUNT_CORONET_NORTH_1F_ROOM_1 = 218 (map_matrix 20); zone_event 0215 warp 3 (29,35) from Route 211 East, warp 1 (11,10) -> MAP_MOUNT_CORONET_B1F",
  "zone_event 0215 object 7 boulder (29,30) script 10002 -> scr_seq 0375 script_3",
  "scr_seq 0375 @0x0244 FindPartyMonWithMove 70 (MOVE_STRENGTH); @0x0257 HasBadge BADGE_MINE; @0x026D YesNoMenu; @0x0297 GetSetStrength 1",
  "zone_event 0215 object 15 grunt (19,41) hidden_flag 0x2B3 (set by scr_seq 0377 @0x014C, new game)",
