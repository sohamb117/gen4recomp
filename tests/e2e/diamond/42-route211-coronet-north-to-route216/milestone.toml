# Proves the D/P road north after Lake Verity: Route 211 East into Mt Coronet's north side, the Strength boulder in
# North 1F Room 1, B1F and Room 2 out onto snowy Route 216. No story flags change; the proof is the map chain.
# Start: Route 211 East (446,527) at the Celestic edge -> end: Route 216 at the cave mouth (375,403) (43's start).
