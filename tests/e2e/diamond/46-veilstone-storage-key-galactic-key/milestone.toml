# Proves the way into Team Galactic HQ after Lake Acuity: Fly back to Veilstone, the guard in front of the HQ who
# drops the Storage Key once 0x241 is cleared (Lake Acuity, scr_seq 0351 @0x0110), the warehouse's rusty doors opened
# with it, HM02 Fly in the warehouse, the warehouse's back stairs into HQ B2F and the Galactic Key there; then out
# through the warehouse to the HQ front door.
# Start: Lake Acuity (Galactic) after Jupiter's scene (45's end) -> end: HQ 1F lobby at the front door (8,22) (47's start).
title = "Veilstone: the Storage Key, the warehouse, HM02 Fly and the Galactic Key"
priority = "P0"
version = "both"
estimate = 22369
refs = [
  "zone_event 0131 object 24",
  "zone_event 0131 object 23",
  "scr_seq 0131 @0x087A-0x0936",
  "scr_seq 0370 @0x0D76",
  "zone_event 0131 warp 4",
  "zone_event 0142 object 3",
  "zone_event 0142 object 4",
  "zone_event 0142 object 2",
  "zone_event 0142 warp 1",
  "scr_seq 0143 @0x0063-0x00E8",
  "scr_seq 0370 @0x0D9E",
  "zone_event 0297 object 5",
  "zone_event 0297 warp 2",
  "scr_seq 0370 @0x128A",
  "zone_event 0131 warp 14",
  "zone_event 0292 warp 0",
]
notes = "Fly: the chain party's Staraptor from 35's boost (in the story HM02 is the warehouse ball this milestone picks up; the walks Fly saves cross the region: Main's call). The guard (object 24, hidden 0x241) runs off and AddEvent 23 drops ball 7121 = ITEM_STORAGE_KEY (463) where he stood. The warehouse doors (objects 3/4, hidden 0x246) take the key (YesNo, A = YES; TakeItem, SetFlag 0x10E). Ball 7123 at (13,8) = ITEM_HM02 (421); ball 7186 at B2F (20,5) = ITEM_GALACTIC_KEY (440). HQ B2F grunts (hidden 0x255) may engage (trdata.json #507 GOLBAT 37, #508 DUSTOX 35 + BRONZOR 35)."

[start]
from = "prev"
lab = "lab.recipe"

[run]
frames = 36000

[[step]]
do = "walk_to"
x = 14
z = 50
note = "out of the lake (zone_event 0305 warp 3) -> MAP_ACUITY_LAKEFRONT warp 2 (310,239): Lake Acuity is off the overworld matrix, the Lakefront is on it (map_matrix 0 cells (9..10,6..7)), so the fly map opens on the player's block"

[[step]]
do = "wait_map"
map = "MAP_ACUITY_LAKEFRONT"

[[step]]
do = "fly"
map = "MAP_VEILSTONE"
shot = "fly-veilstone"
note = "Veilstone is map_matrix 0 cells (21..22,18..19)"

[[step]]
do = "walk_to"
x = 720
z = 594
face = "right"
interact = true
on_battle = "flee"
note = "the guard in front of the HQ (zone_event 0131 object 24 (721,594), hidden 0x241, cleared by Lake Acuity)"

[[step]]
do = "advance_text"
shot = "storage-key-guard"
note = "msg 135 #22-#23: he recognises the player, ClearFlag 0x4C8 + AddEvent 23 (the ball), runs off, RemoveEvent 24 (scr_seq 0131 @0x087A-0x0936)"

[[step]]
do = "walk_to"
x = 720
z = 594
face = "right"
interact = true
note = "ball object 23 (721,594), std 7121 -> scr_seq 0370 @0x0D76 SetVar 0x8008 463 (ITEM_STORAGE_KEY)"

[[step]]
