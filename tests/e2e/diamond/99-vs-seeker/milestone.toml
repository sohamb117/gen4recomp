# Vs. Seeker rematch: with the seeker charged (var 0x4033 = 100) and registered, Y on Route 202 makes the
# beaten Youngster Tristan ready (50% roll); talk to him and win his level-1 rematch party.
# Start: MAP_ROUTE_202 (166,816), Tristan at (166,813) facing S, already beaten. End: same map, rematch won.
title = "Vs. Seeker: Youngster Tristan rematch on Route 202"
priority = "P1"
version = "both"
estimate = 3773
refs = [
  "maps.h:347",
  "zone_event 0328 object 0",
  "trdata.json #1",
  "trdata.json #765",
  "zone_event 0338 coord 0",
  "scr_seq 0403 @0x0295-0x02A5",
  "scr_seq 0403 @0x02AB-0x02B1",
  "scr_seq 0403 @0x030F-0x0315",
  "games/diamond/include/constants/items.h:668",
  "games/diamond/arm9/overlays/05/asm/ov05_021E1374.s:215-222",
  "games/diamond/arm9/overlays/05/asm/ov05_021E1374.s:386-412",
  "games/diamond/arm9/overlays/05/asm/ov05_021E1374.s:418-431",
  "games/diamond/arm9/overlays/05/asm/ov05_021E1374.s:581-586",
  "games/diamond/arm9/overlays/05/asm/ov05_021E1374.s:744",
  "games/diamond/arm9/overlays/05/asm/ov05_021E1374.s:1167",
  "games/diamond/arm9/asm/unk_0205F314.s:158-183",
  "games/diamond/arm9/src/unk_0205EC84.c:83-89",
  "games/diamond/arm9/src/unk_0205EC84.c:155-176",
  "scr_seq 1040 @0x0E00",
]

[start]
recipe = "start.recipe"

[run]
frames = 5700
# The roll is the first LCRandom() the game makes after CONTINUE: the title screen re-runs InitializeMainRNG
# (ov52_021D757C; main.c:239-249: seed = RTC date/time + vblank count), the intro overlay 63 restores its own
# draws' seed before that (ov63_021D8890.s:610-613, :738), and idling or walking on Route 202 draws nothing.
# The harness boots on fixed frames, so the outcome is a function of PC_RTC alone: the port's default clock
# gives LCRandom 0x08E9 (81: not ready, msg 486 #2, every time); this clock gives 0x6798 (20 < 50: ready).
# Traced with tools/dp_lcrng_trace.py (lldb at ov05_021E17A0's LCRandom return, a watchpoint on the state).
clock = "2009-03-22 21:00:00"

[[shots]]
frames = [1700, 1730, 2800]

[[step]]
do = "press"
keys = "Y"
note = "registered ITEM_VS__SEEKER (443): usable only at charge 100 (ov05_021E1518 cmp 0x64, ov05_021E1374.s:215-222); each visible beaten trainer rematches if LCRandom()%100 < 50 (:581-586)"

[[step]]
do = "wait_frames"
n = 240
shot = "seeker"
# 240 frames on the field is free again (seeker done, no msg 486); Tristan's movement is 0x31 (ready).

[[step]]
do = "walk_to"
x = 166
z = 814
face = "up"
interact = true
note = "rematch id = next id of his row {1, 765, 766, 767} whose level flag is set: level 1 <-> flag 0x97F (sub_0205EEB8 unk_0205EC84.c:155-176, row ov05_021E1374.s:1167) -> TRAINER_YOUNGSTER_TRISTAN_2 (765), STARLY lv19"

[[step]]
do = "advance_text"
max = 600
note = "his rematch intro text ('Did you get better since we met?') runs before the battle; advance_text stops when it starts"

[[step]]
do = "wait_battle"
max = 1500
shot = "rematch"

[[step]]
do = "auto_battle"

[[step]]
do = "advance_text"
max = 1500

[[step]]
do = "wait_field"

[expect]
map = "MAP_ROUTE_202"
battles = 1
# the generic trainer script sets the fought id's flag: 0x550 + 765 (scr_seq 1040 @0x0E00 SetTrainerFlag 0x8004)
flags = ["0x84D"]
# the rematch party is TRISTAN_2 (trdata.json #765): STARLY lv19
log = ["auto_battle: battler \\d slot \\d \\(move \\d+, \\d+ PP\\) on species 396"]
