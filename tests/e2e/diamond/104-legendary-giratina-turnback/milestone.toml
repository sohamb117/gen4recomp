# Giratina in Turnback Cave (D/P: lv70, no story gate in the room script): A -> LegendaryBattle 487, 70.
# Unk00ED is sub_020480C8: 0 for a win (outcome 1) or a catch (4), 1 otherwise, so defeating it takes the
# caught path: SetFlag 0x121 + hide flag 0x26E, ClearFlag 0x296. "GIRATINA disappeared..." is the run-away path.
# Start: MAP_TURNBACK_CAVE_GIRATINA_ROOM (11,15) below Giratina (11,14). End: same map, Giratina gone.
title = "Legendary: Giratina in Turnback Cave"
priority = "P2"
version = "both"
estimate = 6000
refs = [
  "maps.h:274",
  "zone_event 0261 object 0",
  "scr_seq 0283 @0x0016-0x0027",
  "scr_seq 0283 @0x0029-0x0042",
  "scr_seq 0283 @0x0044-0x005D",
  "scr_seq 0283 @0x0067-0x0082",
  "scr_seq 0283 @0x0089-0x0091",
  "msg 0250 #0",
  "games/diamond/arm9/src/scrcmd_7.c:236-244",
  "games/diamond/arm9/asm/unk_020476CC.s:1207-1217",
]

[start]
recipe = "start.recipe"
# Path in game: Route 214 Spring Path (341) -> Sendoff Spring (267) -> Turnback Cave pillar rooms (zone_event 0261
# warps); no script gate on any of them [INFERENCE: the Spring Path obstacle is overworld]; skipped by the map line.

[run]
frames = 15000

[[step]]
do = "press"
keys = "A"
note = "Giratina SPRITE_SPPOKE10 (11,14) facing S, hidden 0x26E set only by this map's scripts (zone_event 0261 object 0)"

[[step]]
do = "advance_text"
max = 1500
note = "PlayCry 487, msg 250 #0, SetFlag 0x8E, LegendaryBattle 487, 70 (scr_seq 0283 @0x0044-0x005D)"

[[step]]
do = "wait_battle"
max = 1500
shot = "legendary"

[[step]]
do = "auto_battle"
note = "Garchomp lv100 leads with Dragon Claw (2x on Ghost/Dragon); Pressure takes 2 PP a turn. A-only never throws a ball"

[[step]]
do = "advance_text"
max = 1500
note = "defeated: Unk00ED -> 0 -> SetFlag 0x121, SetFlag 0x26E, ClearFlag 0x296 (@0x0078-0x0091); no text"

[[step]]
do = "wait_field"
shot = "after"

[[shots]]
frames = [2500]

[expect]
map = "MAP_TURNBACK_CAVE_GIRATINA_ROOM"
battles = 1
flags = ["0x121", "0x26E"]
flags_clear = ["0x296", "0x8E"]
