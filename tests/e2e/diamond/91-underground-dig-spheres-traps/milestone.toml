# Underground Man missions 1-2: entering pays three Traps (var 0x40B6 0->1), then descend with the
# registered kit, dig a wall (flag 0x96F) and bury a Sphere (flag 0x970).
# Start: MAP_ETERNA_UNDERGROUND_MAN_HOUSE door, mission 0 given and entered. End: MAP_UNDERGROUND.
title = "Underground: trap reward, digging and burying Spheres"
status = "planned"
priority = "P2"
version = "both"
estimate = 6000
refs = [
  "maps.h:88",
  "zone_event 0083 object 2",
  "scr_seq 0089 @0x015E-0x0164",
  "scr_seq 0089 @0x01D9-0x0235",
  "scr_seq 0089 @0x01EF",
  "scr_seq 0089 @0x01F5",
  "scr_seq 0089 @0x01FC-0x0228",
  "scr_seq 0089 @0x0237-0x0246",
  "scr_seq 0089 @0x00C8",
  "scr_seq 0089 @0x024D-0x0286",
  "scr_seq 0205 @0x08CB",
  "scr_seq 0205 @0x08ED",
  "msg 0571 #1",
  "msg 0571 #23",
  "msg 0571 #28",
  "msg 0097 #6",
  "msg 0097 #8",
  "games/diamond/arm9/src/unk_0205EC84.c:96",
  "games/diamond/arm9/src/unk_0205EC84.c:100",
  "games/diamond/arm9/src/unk_0205EC84.c:104",
  "games/diamond/arm9/overlays/18/asm/overlay_18.s:2717",
  "games/diamond/arm9/overlays/18/asm/overlay_18.s:7514",
]

[start]
recipe = "start.recipe"

[run]
frames = 9000

[[step]]
do = "walk_to"
x = 6
z = 6
face = "up"
interact = true
note = "Underground Man (6,5); var 0x40B6==0, 0x111 and 0x96E set -> L_01D9 payout"

[[step]]
do = "advance_text"
max = 2500
note = "SetVar 0x40B6 1, ClearFlag 0x111 (@0x01EF/@0x01F5); GiveUndergroundTrap 1 Move Trap, 23 Bubble Trap, 28 Leaf Trap (std 2013, @0x01FC-0x0228; msg 0571 #1/#23/#28)"
shot = "traps"

[[step]]
do = "press"
keys = "A"
note = "talk again: var 0x40B6==1, 0x111 clear -> L_00C8 SetFlag 0x111 + mission text msg 97 #8 (dig Treasure/Spheres)"

[[step]]
do = "advance_text"
max = 1500

[[step]]
do = "walk_to"
x = 4
z = 8
note = "door -> MAP_ETERNA warp 11"

[[step]]
do = "wait_map"
map = "MAP_ETERNA"

[[step]]
do = "wait_field"

[[step]]
do = "press"
keys = "Y"
note = "registered Explorer Kit (recipe register-item)"
# PHASE2: descent prompts after the kit ([INFERENCE] confirm + forced save, not located in the D/P
# decomp) -> wait_map MAP_UNDERGROUND; then touch-screen radar, walk to a sparkle, A at the wall,
# the mining minigame (touch taps; full dig -> sub_0205EDBC SetFlag 0x96F, overlay_18.s:2717), and
# UG menu > Spheres > bury on open ground (sub_0205EDCC SetFlag 0x970, overlay_18.s:7514).
# Spheres to bury come only from digging here or from the mission-2 payout (var 0x40B6 1->2, spheres
# 1/3/4 via std 2014, scr_seq 0089 @0x024D-0x0286) - no lab verb writes Underground goods.

[expect]
map = "MAP_UNDERGROUND"
vars = { "0x40B6" = 1 }
flags = ["0x111", "0x96E", "0x96F", "0x970"]
# PHASE2: traps are in the Underground save block, not in the np_save4 dump (reader-ext).
# PHASE2 lead (SysDP2): descent = 90's bag/Y path + YES comms, YES save, YES overwrite; the UG field never sets
# field_ready (advance_text/wait_field do not work there) and refuses the quick save (result 2): GO UP + descend
# again to save, [run] save = "game". Mining spots are the 3-byte condensed table (x lo, x hi|z hi<<4, z lo) at
# guest 0x0227115B after the first arrival (peek): nearest the Eterna entry (168,264) are (148,261), (147,261),
# (146,261), (145,267), (139,261) - walls; face one from a free neighbour and A starts the dig (ov18_0223AC24 sets 0x96F).
