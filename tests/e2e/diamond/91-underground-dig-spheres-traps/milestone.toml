# Spheres to bury come only from digging here or from the mission-2 payout (var 0x40B6 1->2, spheres
# 1/3/4 via std 2014, scr_seq 0089 @0x024D-0x0286) - no lab verb writes Underground goods.

[expect]
map = "MAP_UNDERGROUND"
vars = { "0x40B6" = 1 }
flags = ["0x111", "0x96E", "0x96F", "0x970"]
# Traps and spheres are in the Underground save block, not in the np_save4 dump; the flags are the proof.
# The board (13x10 cells, cell (c,r) at (16c+8, 32+16r+8) on the bottom screen) depends on every input before the
# dig: after any change upstream, re-read it from the contact sheet (the lattice shot) and move the sphere taps.
# The UG list select (ov18_02249684) needs armrec's Thumb bit on literal-pool function words; without it any
# sphere/trap choice is GF_AssertFail -> comm error -> reset.
