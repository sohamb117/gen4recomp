# collision grid. A bump while standing on a push tile (ov06_0224F834: x, z, kind, bar; kind 0 = facing east moves a
# bar from state 0 to 1, kind 1 = facing west moves it from 1 to 0; ov06_0224249C / ov06_022426AC) slides the bar.
