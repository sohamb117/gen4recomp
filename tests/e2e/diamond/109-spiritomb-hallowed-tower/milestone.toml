# Spiritomb at the Route 209 Hallowed Tower: with the Odd Keystone set in (var 0x408A 1) and 32+ Underground
# conversations (var 0x403E), A -> WildBattle 442, 25; after it, var 0x408A 0 and the counter reset.
# keystone.recipe: the Odd Keystone itself (YES -> TakeItem 111, SetVar 0x408A 1).
# Start: MAP_ROUTE_209 (566,715) below the tower (566..567,713..714). End: same map.
title = "Spiritomb at the Hallowed Tower"
status = "planned"
priority = "P2"
version = "both"
estimate = 4000
refs = [
  "maps.h:360",
  "zone_event 0341 bg 2",
  "zone_event 0341 bg 3",
  "zone_event 0341 bg 4",
  "zone_event 0341 bg 5",
  "scr_seq 0406 @0x00B7-0x0100",
  "scr_seq 0406 @0x00D3-0x00D9",
  "scr_seq 0406 @0x00F6",
  "scr_seq 0406 @0x0102-0x0147",
  "scr_seq 0406 @0x014D-0x015E",
  "scr_seq 0406 @0x0175-0x017B",
  "msg 0569 #12",
  "games/diamond/include/constants/items.h:352",
  "games/diamond/arm9/asm/unk_0205F314.s:502-515",
  "games/diamond/arm9/asm/unk_0204CB20.s:4114-4122",
]

[start]
recipe = "start.recipe"
# PHASE2: keystone run = this dir with keystone.recipe: press A, advance_text (msg 429 #2 Yes/No, VAR_RESULT 0 = YES
# @0x00D3-0x00D9; TakeItem 111, SetVar 0x408A 1 @0x00EE-0x00F6); expect vars 0x408A = 1, bag without item 111.

[run]
frames = 6000

[[step]]
do = "press"
keys = "A"
note = "tower bg 3 (566,714) (zone_event 0341 bg 3, script #2); var 0x408A==1 -> GetSpiritombTalkCounter >= 32 (scr_seq 0406 @0x0102-0x010C)"

[[step]]
do = "advance_text"
max = 1500
note = "PlayCry 442, msg 429 #9, WildBattle 442, 25 (@0x014D-0x015E)"

[[step]]
do = "wait_battle"
max = 1500
shot = "spiritomb"

[[step]]
do = "auto_battle"

[[step]]
do = "advance_text"
max = 1500
note = "won/fled: SetVar 0x408A 0, ResetSpiritombTalkCounter (@0x0175-0x017B)"

[[step]]
do = "wait_field"
shot = "after"

[expect]
map = "MAP_ROUTE_209"
battles = 1
vars = { "0x408A" = 0, "0x403E" = 0 }
# version: Route 209 wild bank differs (d/p_enc_data 0150, dp_script.py version-diff); the scripted
# Spiritomb is the same in both, and the station takes no grass steps.
