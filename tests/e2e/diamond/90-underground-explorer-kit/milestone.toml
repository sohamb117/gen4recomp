# Underground Man gives the Explorer Kit and becomes mentor (YES); walk out to Eterna and use the kit
# to enter the Underground. D/P has no lab underground hook (Platinum's PC_LAB_UNDERGROUND): input-driven.
# Start: MAP_ETERNA_UNDERGROUND_MAN_HOUSE door (warp 0, (4,8)). End: MAP_UNDERGROUND (2).
title = "Underground: Explorer Kit and first entry"
priority = "P1"
version = "both"
estimate = 6538
refs = [
  "maps.h:88",
  "maps.h:6",
  "zone_event 0083 object 2",
  "zone_event 0083 warp 0",
  "zone_event 0064 warp 11",
  "scr_seq 0089 @0x001E-0x003A",
  "scr_seq 0089 @0x0041-0x0050",
  "scr_seq 0089 @0x0054",
  "scr_seq 0089 @0x0058",
  "scr_seq 0089 @0x005F-0x0074",
  "scr_seq 0089 @0x0098",
  "scr_seq 0089 @0x015E-0x01D3",
  "scr_seq 0089 @0x01D9-0x01E8",
  "scr_seq 0089 @0x00B9",
  "scr_seq 0089 @0x011C",
  "scr_seq 0205 @0x09C1",
  "msg 0097 #0",
  "msg 0097 #4",
  "msg 0097 #5",
  "games/diamond/include/constants/items.h:653",
  "games/diamond/arm9/src/unk_0205EC84.c:96",
  "games/diamond/arm9/overlays/18/asm/overlay_18.s:8116",
  "games/diamond/arm9/asm/unk_0205F314.s:86-93",
]

[start]
recipe = "start.recipe"

[run]
frames = 9900
# no end quick save: the Underground refuses it (quicksave_result 2); the second descent's forced save is the end save
save = "game"

[[step]]
do = "walk_to"
x = 6
z = 6
face = "up"
interact = true
note = "Underground Man SPRITE_OLDMAN1 at (6,5) (zone_event 0083 object 2, script #1); [INFERENCE] (6,6) walkable"

[[step]]
do = "advance_text"
max = 2500
note = "msg 97 #0, ITEM_EXPLORER_KIT via std 2044 (scr_seq 0089 @0x0044-0x0050), SetFlag 0x79/ClearFlag 0x111, mentor Yes/No (@0x005F): VAR_RESULT 1 = NO -> L_0098; [INFERENCE] A takes the YES default -> SetFlag 0x113 (@0x0070) -> L_015E -> L_01D9 -> L_00B9 SetFlag 0x111 + msg 97 #4"
shot = "kit"

[[step]]
do = "walk_to"
x = 4
z = 8
note = "door warp 0 -> MAP_ETERNA warp 11 (310,530) (zone_event 0083 warp 0)"

[[step]]
do = "wait_map"
map = "MAP_ETERNA"

[[step]]
do = "wait_field"
shot = "eterna"

# The kit from the bag: the start menu without a Pokedex is POKEMON, BAG, <player>, SAVE, OPTIONS, EXIT with the
# cursor on POKEMON; the bag opens on ITEMS and LEFT wraps to KEY ITEMS, whose first row is the kit; A, USE.
[[step]]
do = "press"
keys = "X"
gap = 30

[[step]]
do = "press"
keys = "DOWN"
gap = 8

[[step]]
do = "press"
keys = "A"
gap = 90

[[step]]
do = "press"
keys = "LEFT"
gap = 40
shot = "key-items"

[[step]]
do = "press"
keys = "A"
gap = 30

[[step]]
do = "press"
keys = "A"
gap = 120
note = "USE: 'DS Wireless Communications will be launched.' YES/NO"
shot = "comms"

[[step]]
do = "press"
keys = "A"
gap = 120
note = "YES -> the forced 'Would you like to save the game?' YES/NO"

[[step]]
do = "press"
keys = "A"
gap = 150
note = "YES -> 'There is already a saved file. Is it OK to overwrite it?' YES/NO"

[[step]]
do = "press"
keys = "A"
note = "YES: the save, the hole, MAP_UNDERGROUND"

[[step]]
do = "wait_map"
map = "MAP_UNDERGROUND"
max = 1500

[[step]]
do = "wait_frames"
n = 400
shot = "roark"

# Roark's first-visit talk. The Underground field never reports field_ready (the probe's field state), so
# advance_text cannot see its end: A at a spacing that covers every page, then the UG menu.
[[step]]
do = "press"
keys = "A"
times = 60
gap = 20

# GO UP (the UG menu: TRAPS, SPHERES, GOODS, TREASURES, <player>, GO UP, CLOSE) and YES to 'return to the
# surface from where you entered?'; then down again so that the descent's save holds 0x96E, set on arrival.
[[step]]
do = "press"
keys = "X"
gap = 30

[[step]]
do = "press"
keys = "DOWN"
times = 5
gap = 8
shot = "go-up"

[[step]]
do = "press"
keys = "A"
gap = 60

[[step]]
do = "press"
keys = "A"

[[step]]
do = "wait_map"
map = "MAP_ETERNA"
max = 1500

[[step]]
do = "wait_field"
shot = "surface"

[[step]]
do = "press"
keys = "X"
gap = 30
shot = "menu-again"

[[step]]
do = "press"
keys = "DOWN"
gap = 8

[[step]]
do = "press"
keys = "A"
gap = 90
note = "the start menu is back on POKEMON after the Underground; the bag keeps KEY ITEMS and the kit's row"

[[step]]
do = "press"
keys = "A"
gap = 30
shot = "bag-again"

[[step]]
do = "press"
keys = "A"
gap = 120

[[step]]
do = "press"
keys = "A"
gap = 120

[[step]]
do = "press"
keys = "A"
gap = 150

[[step]]
do = "press"
keys = "A"

[[step]]
do = "wait_map"
map = "MAP_UNDERGROUND"
max = 1500

[[step]]
do = "wait_frames"
n = 400
shot = "underground"

[expect]
map = "MAP_UNDERGROUND"
# 0x96E: the first arrival (sub_0205EDAC, unk_0205EC84.c:96, caller overlay_18.s:8116), saved by the second descent
flags = ["0x79", "0x113", "0x111", "0x96E"]
save = ['any(i["item"] == 428 for p in s["bag"].values() for i in p)']   # ITEM_EXPLORER_KIT
