  '[m["species"] for m in s["party"]] == [400, 400, 400, 400, 399, 240]',
  'not any(m["is_egg"] for m in s["party"])',
  's["party"][4]["level"] == 1',
]
# Flame Body: fewer than 3000 lap attempts (without it 15 cycles of 255 steps, at least 3570)
log = ['hatch: a scene of \d+ frames after (1[5-9]\d\d|2\d\d\d) steps; 0 egg\(s\) left']

[[shots]]
frames = [38450, 38700, 38950, 39200]   # the hatch scene (from frame 38405)
