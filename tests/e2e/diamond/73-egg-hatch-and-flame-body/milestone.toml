# Egg hatch, played, with Flame Body: 72's BIDOOF egg (15 egg cycles) hatches while the player runs laps in Solaceon
# with MAGBY (Flame Body) in the party, which takes two cycles off per 255 steps instead of one (ov05_021ED190, called
# from Daycare_Update ov05_021ED378): about 2040 steps instead of about 3825.
# Start: 72's end, MAP_SOLACEON (555,649), egg in slot 4, + boost MAGBY. End: MAP_SOLACEON, BIDOOF hatched in slot 4.
title = "Egg hatch (and Flame Body cycle halving)"
priority = "P1"
version = "both"
estimate = 39347
refs = [
  "games/diamond/arm9/overlays/05/asm/ov05_021EC458.s:1653-1695",
  "games/diamond/arm9/overlays/05/asm/ov05_021EC458.s:1882-1917 (ov05_021ED334: 255 steps per cycle, 230 on special dates)",
  "games/diamond/arm9/overlays/05/asm/ov05_021EC458.s:1918-2051",
  "games/diamond/files/poketool/personal/personal.json:18807-18809",
  "games/diamond/files/poketool/personal/personal.json:31496",
]
notes = "Starts from 72's end (systems order: 72 first; run with 72's --out). The D/P lab has no Day Care or egg verb, so there is no standalone start."

[start]
from = "72-day-care-deposit-and-egg"
boost = "boost.recipe"

[run]
frames = 59100

[[step]]
do = "hatch"
x = 557
z = 649
note = "running laps until the egg hatches (bots.py hatch: the scene's text with B, the nickname question NO)"
