# Proves Team Galactic HQ up to Cyrus: the Galactic Key doors on 1F, the warp panels of 2F and 3F, the 4F key doors and
# Cyrus's coordinate trigger, his battle and the Master Ball.
# Start: HQ 1F at the front door (46's end) -> end: HQ 4F_1 after Cyrus leaves (var 0x40D6 = 1) (48's start).
title = "Galactic HQ: the key doors, the warp panels and Cyrus"
status = "planned"
priority = "P0"
version = "both"
estimate = 20000
refs = [
  "zone_event 0292 object 5",
  "zone_event 0292 warp 4",
  "zone_event 0293 warp 10",
  "zone_event 0293 warp 4",
  "zone_event 0294 warp 4",
  "zone_event 0294 warp 2",
  "zone_event 0295 object 1",
  "zone_event 0295 coord 0",
  "scr_seq 0336 @0x0074",
  "scr_seq 0336 @0x00D1",
  "scr_seq 0336 @0x0199",
  "trdata.json #403",
]
notes = "Route from the step layers (tests/e2e/tools/dp_warps.py): 1F lobby (8,22), the Galactic Key doors (22..23,18) (objects 5/6, hidden 0x242; YesNo, A = YES), (19,14) -> 2F (10,11), panel (29,13) -> 2F (52,6), (50,3) -> 3F (47,3), panel (15,13) -> 3F (6,14), (10,11) -> 4F_1 (3,15), the 4F doors (8..9,14) (objects 1/2, hidden 0x244, scr_seq 0336 @0x0154-@0x01A9), Cyrus's coord (8..9,11) when 0x40D6 == 0: TrainerBattle 403 (@0x0074), the Master Ball (std 2044), RemoveEvent 0 and SetVar 0x40D6 1 (@0x00CD-@0x00D1). Each walk avoids the other warps and panels of its floor."

[start]
from = "prev"
lab = "lab.recipe"

[run]
frames = 40000

[[step]]
do = "walk_to"
x = 22
z = 19
face = "up"
interact = true
avoid = [[8, 22], [29, 22], [42, 22], [4, 3], [27, 3], [11, 3], [46, 3], [52, 21], [41, 3], [39, 3], [32, 3], [36, 8], [1, 8], [41, 14], [19, 14]]
note = "below the 1F key doors (22..23,18) (zone_event 0292 objects 5/6)"

[[step]]
do = "advance_text"
shot = "hq-key-door"
note = "'Use the Galactic Key?' A = YES: the doors open, hidden 0x242 set"

[[step]]
do = "walk_to"
x = 19
z = 14
avoid = [[8, 22], [29, 22], [42, 22], [4, 3], [27, 3], [11, 3], [46, 3], [52, 21], [41, 3], [39, 3], [32, 3], [36, 8], [1, 8], [41, 14]]
note = "zone_event 0292 warp 4 -> MAP_VEILSTONE_GALACTIC_HEADQUARTERS_2F (10,11)"

[[step]]
do = "wait_map"
map = "MAP_VEILSTONE_GALACTIC_HEADQUARTERS_2F"

[[step]]
do = "walk_to"
x = 29
z = 13
avoid = [[7, 3], [24, 3], [10, 11], [12, 3], [50, 3], [1, 3], [17, 5], [1, 14], [45, 12], [52, 6], [52, 12], [18, 20], [1, 22], [45, 22]]
note = "warp panel zone_event 0293 warp 10 -> 2F (52,6)"

[[step]]
do = "walk_to"
x = 50
z = 3
avoid = [[7, 3], [24, 3], [10, 11], [12, 3], [1, 3], [17, 5], [1, 14], [45, 12], [52, 6], [29, 13], [52, 12], [18, 20], [1, 22], [45, 22]]
note = "zone_event 0293 warp 4 -> MAP_VEILSTONE_GALACTIC_HEADQUARTERS_3F (47,3)"

[[step]]
do = "wait_map"
map = "MAP_VEILSTONE_GALACTIC_HEADQUARTERS_3F"

[[step]]
do = "walk_to"
x = 15
z = 13
avoid = [[15, 3], [47, 3], [10, 11], [6, 14], [17, 11], [52, 12], [19, 11], [32, 22]]
note = "warp panel zone_event 0294 warp 4 -> 3F (6,14)"

[[step]]
do = "walk_to"
x = 10
z = 11
avoid = [[15, 3], [47, 3], [6, 14], [15, 13], [17, 11], [52, 12], [19, 11], [32, 22]]
note = "zone_event 0294 warp 2 -> MAP_VEILSTONE_GALACTIC_HEADQUARTERS_4F_1 (3,15)"

[[step]]
do = "wait_map"
map = "MAP_VEILSTONE_GALACTIC_HEADQUARTERS_4F_1"

[[step]]
do = "walk_to"
x = 8
z = 15
face = "up"
interact = true
avoid = [[3, 15], [22, 3], [21, 17]]
note = "below the 4F key doors (8..9,14) (zone_event 0295 objects 1/2)"

[[step]]
do = "advance_text"
note = "'Use the Galactic Key?' A = YES (scr_seq 0336 @0x0154): SetFlag 0x244, RemoveEvent 1/2"

[[step]]
do = "walk_to"
on_text = "stop"
x = 8
z = 11
avoid = [[3, 15], [22, 3], [21, 17]]
note = "Cyrus's coord (8..9,11) (zone_event 0295 coord 0)"

[[step]]
do = "advance_text"
shot = "cyrus-hq"
note = "msg 265 #0-#1, then TrainerBattle 403 (scr_seq 0336 @0x0074)"

[[step]]
do = "auto_battle"
send = "best"
shot = "cyrus-battle"
note = "TRAINER_GALACTIC_BOSS_CYRUS (trdata.json #403)"

[[step]]
do = "advance_text"
max = 6000
shot = "master-ball"
note = "msg 265 #2-#4, the Master Ball (std 2044), Cyrus walks off: RemoveEvent 0, SetVar 0x40D6 1"

[[step]]
do = "wait_field"

[expect]
map = "MAP_VEILSTONE_GALACTIC_HEADQUARTERS_4F_1"
flags = ["0x242", "0x244", "0x1DC"]
battles = 1
save = [
  'any(i["item"] == 1 for k, p in s["bag"].items() if k != "registered" for i in p)',  # ITEM_MASTER_BALL
]

[expect.vars]
"0x40D6" = 1
