max = 9000
note = "HM08 ball obj 10 (296,305); BFS (304,383)->(304,381)->(303,381)->(303,375)->(304,375)->(304,369)->(302,369)->(302,336)->(300,336)->(300,334)->(298,334)->(298,324)->(296,324)->(296,306); Dalton (307,369) W3 sees (304,369)"

