[expect]
map = "MAP_SNOWPOINT"
position = [367, 223]
flags = ["0x47B", "0x9BF"]
save = [
  'any(i["item"] == 427 and i["qty"] >= 1 for k, p in s["bag"].items() if k != "registered" for i in p)',  # ITEM_HM08 [INFERENCE: np_save4 D/P bag dump shaped like Platinum's]
