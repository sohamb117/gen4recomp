[[step]]
do = "wait_field"

[expect]
map = "MAP_ROUTE_205_SOUTH"
position = [213, 653]
# one of the two HONEY (94) slathered: TakeItem 94, 1 (scr_seq 0205 @0x065C)
save = ['[i["qty"] for i in s["bag"]["items"] if i["item"] == 94] == [1]']
