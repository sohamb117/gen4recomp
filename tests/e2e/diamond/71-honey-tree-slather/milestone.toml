shot = "slathered"

[[step]]
do = "press"
keys = "A"
note = "again at the tree: CheckHoneyTree 2 (timer 1440 > 1080) -> msg 199 #49 'The bark is slathered with Honey...' and the slather prompt again"

[[step]]
do = "wait_frames"
n = 90
shot = "still-slathered"

[[step]]
do = "press"
keys = "B"
note = "B through #49 and the prompt answers NO (scr_seq 0205 @0x064B-0x065A: NO releases, keeping the second HONEY: the end save holds one)"
