clock = "2009-03-22 09:00:00"   # 71b's clock is 7 hours later: the end.clock this run writes is replaced there

[[shots]]
frames = [1688, 1720]  # "Slather the bark with Honey?" YES/NO; "The bark was slathered with Honey."

[[step]]
do = "press"
keys = "A"
