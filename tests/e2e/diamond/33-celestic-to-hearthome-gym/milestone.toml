# Proves the walk back from Celestic Town (Routes 210 North/South, Solaceon, Route 209) to Hearthome City and into the
# Hearthome Gym, now open: 0x98D keeps the first room's elevator coord armed (var 0x4000 = 0).
# Start: Celestic Town ruins door (463,521) (32's end) -> end: Hearthome Gym first question room (9,22) (34's start).
title = "Celestic Town back to the Hearthome Gym"
priority = "P0"
version = "both"
estimate = 8825
refs = [
  "zone_event 0347 object 19",
  "zone_event 0341 warp 0",
  "zone_event 0109 warp 0",
  "zone_event 0085 warp 8",
  "zone_event 0085 coord 0",
  "zone_event 0087 warp 3",
  "zone_event 0087 coord 0",
  "scr_seq 0092 @0x001A",
  "scr_seq 0092 @0x0020",
  "scr_seq 0092 @0x0022",
  "scr_seq 0114 @0x012B",
  "scr_seq 0090 @0x013B",
  "games/diamond/arm9/asm/unk_02064CA8.s:32-57",
  "games/diamond/arm9/src/unk_0205EC84.c:47-49",
  "maps.h:92",
  "map_header.c:172",
]
notes = "Estimate: ~350 tiles (Platinum 20 walked most of it the other way in ~31000 with a rival battle). No story state changes on the way: Route 209/210 South ON_TRANSITIONs only swap time-of-day jogger flags (scr_seq 0406 #8, 0412 #7). Hearthome coord 0 (484..489,718) var 0x407B==1 is off the gate-to-gym path and was spent earlier (scr_seq 0090 @0x013B)."

[start]
from = "prev"
lab = "lab.recipe"

[run]
frames = 45000

