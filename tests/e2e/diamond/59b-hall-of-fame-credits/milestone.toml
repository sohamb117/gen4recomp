notes = "Conditional HoF respawns as minted for this chain: 0x15F clear (legendary KO'd, not caught, 50's end) -> var 0x4098 5 + ClearFlag 0x1E2; 0x120/0x125/0x11B clear and no National Dex -> nothing; 0x126/0x127 clear -> ClearFlag 0x1FE/0x1FF. Not script-visible / not lab-mintable: HoF record (Save_HOF_RecordParty, unk_020484A8.s:51), PlayerProfile game-clear bit, Champ ribbon, game stat 0x2E. Post-game start: sub_020377B0 copies UNK_020F2B9C {map 0x19F=415, warp -1, x 4, z 6, dir 0} (unk_020377B0.s:7-9) into the dynamic warp, sub_020377C8 copies {411 Twinleaf, (116,886), dir 1} (:12-14) into the special spawn warp; 415 is the player's 2F room (maps.h names 414/415 RIVAL_HOUSE, but tests/gameplay/dp/scenarios/1-rival.scn:6-10 has home = 414). The post-game Mom scene (var 0x410F==1, scr_seq 0911 @0x0011 on map 414) and Twinleaf's 0x40F4 scene (scr_seq 0978 @0x0026) belong to the next span."

[start]
from = "prev"
lab = "lab.recipe"

[run]
frames = 45000
save = "none"  # CallTask_GameClear saves by itself (SaveGame, unk_020484A8.s:165), then OS_ResetSystem (:245)

[[step]]
do = "advance_text"
max = 8000
map = "MAP_POKEMON_LEAGUE_HALL_OF_FAME"
note = "corridor ON_FRAME var 0x4003==0 (scr_seq 0654 @0x0006): walk 17 north, Cynthia + Rowan (ClearFlag 0x258/0x259 @0x001E/@0x0049), Warp 187,0,8,15 (@0x00F8)"

[[step]]
do = "wait_map"
map = "MAP_POKEMON_LEAGUE_HALL_OF_FAME"

[[step]]
do = "press"
keys = "A"
hold = 4
gap = 26
times = 60
note = "HoF ON_FRAME (scr_seq 0655 @0x0006 -> 0192): msg 0182 #4-#6, SetFlag 0x982 @0x00AD, SetVar 0x40F4 1 @0x0106, L_0178 respawns, ShowEndGameScreen @0x00F2 -> CallTask_GameClear (unk_020484A8.s:61-250)"

[[step]]
do = "wait_frames"
n = 3000
shot = "hall_of_fame"
note = "the HoF screen: each party member, then the trainer card"

[[step]]
do = "press"
keys = "A"
note = "the HoF screen waits for A on its last page"

[[step]]
do = "wait_frames"
n = 2400
shot = "credits"
note = "CallTask_GameClear saves (SaveGame, unk_020484A8.s:165: flags 0x964/0x966, the HoF record; np_gp stores the image as it settles), then the credits"

[[step]]
do = "wait_frames"
n = 8000
shot = "credits_late"

[[step]]
do = "wait_frames"
n = 7200
shot = "fin"

[[step]]
do = "wait_reset"
max = 15000
keys = "A"
note = "the credits application holds \"Fin\" until a button (A, held from the step's start); the GameClear task waits for it to end (FieldSystem_ApplicationIsRunning, unk_020484A8.s:236), then calls OS_ResetSystem (:245): the port traps it (games/platinum/pc/src/pc_os_lite.c, shared by D/P) and the run ends. The post-game spawn (map 415 (4,6), sub_020377B0) is in the save the game wrote, not visible to a probe after the reset."

[expect]
badges = 8
flags = ["0x964", "0x966", "0x982", "0xB4"]
flags_clear = ["0x98B", "0x1EF", "0x1E2", "0x1FE", "0x1FF", "0x195"]
vars = { "0x40F4" = 1, "0x410F" = 1, "0x4098" = 5 }
# the Hall of Fame block SaveHallOfFame wrote (np_save4 dump: hall_of_fame), with the whole party
save = ["s['hall_of_fame']['total'] >= 1",
        "len(s['hall_of_fame']['latest']['party']) == len([p for p in s['party'] if not p['is_egg']])"]
