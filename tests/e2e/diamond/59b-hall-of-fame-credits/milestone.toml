# Proves the Hall of Fame: corridor + HoF frame scripts, ShowEndGameScreen -> CallTask_GameClear (HoF record, flags 0x964/0x966,
# Champ ribbon, the game's own save, credits, OS_ResetSystem). Start: HoF corridor (5,23) after Cynthia -> end: the
# reset after "Fin" (wait_reset); [expect] reads the save the game wrote before the credits (its HoF block included).

title = "Hall of Fame, credits, reset"
priority = "P0"
version = "both"
estimate = 25211
refs = [
  "maps.h:190",
  "scr_seq 0654 @0x0006",
  "scr_seq 0191 @0x000A",
