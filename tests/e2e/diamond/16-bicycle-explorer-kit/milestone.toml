notes = "The Galactic-building cut trees (304..306,521) use map-temp hidden flags 0x20-0x22 (zone_event 0064 objects 14-16), cleared on every map load (ResetTempFlagsAndVars), so leaving the building puts the player north of a standing tree again. The Explorer Kit is story-blocking in D/P (scr_seq 0069 @0x005E-@0x0096 + coord 1). The mentor YES sets 0x113 and the first mission flag 0x111; a NO only skips those two flags. The Exp. Share aide in the gatehouse (object 2, needs 35 seen) is optional. Heal before 17: its sight trainers exceed Surf's 15 PP."

[start]
from = "prev"
lab = "lab.recipe"

[run]
frames = 13500

[[step]]
do = "walk_to"
x = 305
z = 520
face = "down"
interact = true
note = "tree (305,521) south of the door is back (map-temp flag 0x21); Cut prompt needs MOVE_CUT in the party (scr_seq 0375 @0x004A) and BADGE_FOREST (@0x005D) [INFERENCE: x 303/307 at z 521 are not walkable]"

[[step]]
do = "advance_text"
note = "YesNo opens on YES (A), Cut, RemoveEvent (scr_seq 0375 @0x0073-@0x00C3)"

[[step]]
do = "walk_to"
x = 310
z = 539
note = "Cycle Shop door (zone_event 0064 warp 2) -> MAP_ETERNA_BIKE_SHOP warp 0 (7,11)"

[[step]]
do = "wait_map"
map = "MAP_ETERNA_BIKE_SHOP"

[[step]]
do = "walk_to"
x = 3
z = 6
face = "up"
interact = true
note = "shop owner (3,5) DIR_SOUTH, hidden_flag 0x1B0 cleared by Jupiter's win (zone_event 0070 object 0)"

[[step]]
do = "advance_text"
shot = "bicycle"
note = "ITEM_BICYCLE via std 2044, SetFlag 0x82, SetSpawn 9, var 0x411B 0 -> 1 (scr_seq 0076 @0x002C-@0x0057)"

[[step]]
