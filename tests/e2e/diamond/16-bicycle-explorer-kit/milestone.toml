[expect]
map = "MAP_ETERNA_ROUTE_206_GATEHOUSE"
badge = ["BADGE_COAL", "BADGE_FOREST"]
flags = ["0x82", "0x79", "0x113", "0x111", "0x81"]
save = [
  'any(i["item"] == 450 and i["qty"] >= 1 for k, p in s["bag"].items() if k != "registered" for i in p)',  # ITEM_BICYCLE
  'any(i["item"] == 428 and i["qty"] >= 1 for k, p in s["bag"].items() if k != "registered" for i in p)',  # ITEM_EXPLORER_KIT
]

[expect.vars]
