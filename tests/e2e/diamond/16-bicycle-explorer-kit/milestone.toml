note = "ITEM_EXPLORER_KIT via std 2044, SetFlag 0x79, ClearFlag 0x111 (scr_seq 0089 @0x0044-@0x0058); mentor YesNo on YES (A): SetFlag 0x113 @0x0070, then mission 1 SetFlag 0x111 @0x00B9"

[[step]]
