shot = "sandgem-tour"
note = "ON_TRANSITION puts the friend at (168,845) (scr_seq 0985 @0x005F); ON_FRAME 0x4071==1 (scr_seq 0915 @0x000B): Pokemon Center and Poke Mart tour, friend leaves, 0x4071 2 (scr_seq 0985 @0x06CE-@0x06D2)"

