notes = "Estimate: walk Twinleaf -> Sandgem ~2000, escort ~1500, Rowan ~5000, tour ~2500. Twinleaf, Route 201 and Sandgem share matrix 0 (map_header.c:495,426,502), so the walk is seamless. Rowan's nickname YesNo is answered NO with B (YesNoMenu: 0 YES, 1 NO, scr_seq 0990 @0x0119 skips NamePokemonScreen on 1); B also answers NO to the Pokedex question, which only re-asks it (@0x0229-@0x0240), so the B burst may overshoot safely and A then answers YES. Pearl: no GetGameVersion on this path (scr_seq 0977 @0x0261 is the friend's own talk script, not run here)."

[start]
from = "prev"
lab = "lab.recipe"

[run]
frames = 16500

[[step]]
do = "walk_to"
x = 164
z = 844
max = 6000
note = "Sandgem coord 0 (164,842..847) 0x4071==0 (zone_event 0396): north up Route 201, east to Sandgem; Route 201 coords (zone_event 0327) are spent at 0x4086 == 3"

[[step]]
do = "press"
keys = "B"
times = 250
note = "escort, Barry's Thud (0985 @0x02C6-@0x0318), Warp into the lab (@0x0389), lab ON_FRAME 0x40A6==0: B advances text and answers NO to 'give it a nickname?' (scr_seq 0990 @0x0112-@0x011F) [INFERENCE: B advances D/P text and cancels YesNoMenu as NO]"

[[step]]
do = "wait_map"
map = "MAP_SANDGEM_ROWANS_LAB"

[[step]]
do = "advance_text"
shot = "pokedex"
note = "A = YES to 'help with the Pokedex?' (@0x0210/@0x022F) -> GiveSinnohDex, flag 0x90 (@0x024B-@0x024D), friend leaves (@0x0315), 0x40A6 1 (@0x031D)"

[[step]]
