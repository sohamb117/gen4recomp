# Proves the end of the game: Karen's exit to Lance's room, its coord (VAR_UNK_40C7 0) that starts Lance
# (TRAINER_CHAMPION_LANCE), Lyra/Elm/Oak's scene and the warp to the Hall of Fame, whose OnFrame records the team
# (HallOfFameAnim) and runs HOFCredits: CallTask_GameClear sets FLAG_GAME_CLEAR and the home spawn, the Hall of Fame
# registration screen (A), the game save, the credits (4976 frames), "The End" (A) and OS_ResetSystem.
# Start: MAP_POKEMON_LEAGUE_KAREN_ROOM (6,11) -> end: the reset after "The End" (wait_reset); [expect] reads the save
# Task_GameClear wrote.
title = "Champion Lance, the Hall of Fame, credits and the reset"
status = "planned"
priority = "P0"
version = "both"
estimate = 26000
refs = [
  "zone_event 275_T10R0501 warp 1 (6,2) -> MAP_POKEMON_LEAGUE_LANCE_ROOM 0 (6,28)",
  "scr_seq_0597_T10R0601_hdr.s (OnFrame VAR_UNK_40C8 0 -> 001: ClearFlag FLAG_UNK_210, VAR_UNK_40C8 1)",
  "zone_event 276_T10R0601 coord 0 (5,10) w3 VAR_UNK_40C7 0 -> 000",
  "scr_seq_0824_T10R0601.s:41-163 (VAR_UNK_4135 < 8 -> TRAINER_CHAMPION_LANCE :77; Lyra, Elm, Oak; ClearFlag FLAG_HIDE_OLIVINE_PORT_OAK, VAR_UNK_411A 1, Warp MAP_POKEMON_LEAGUE_HALL_OF_FAME (6,22))",
  "TRAINER_CHAMPION_LANCE (244, include/constants/trainers.h:249): GYARADOS 46, DRAGONITE 49, DRAGONITE 49, AERODACTYL 48, CHARIZARD 48, DRAGONITE 50",
  "scr_seq_0598_T10R0701_hdr.s (OnFrame VAR_TEMP_x4001 0 -> 000)",
  "scr_seq_0825_T10R0701.s:16-89 (HallOfFameAnim :40, no S.S. Ticket -> VAR_SCENE_PLAYERS_HOUSE_1F 3 :45-48, FLAG_UNK_97E, ClearFlag FLAG_HIDE_LAKE_OF_RAGE_PRYCE, uncaught legendaries reset, HOFCredits 0 :84)",
  "src/scrcmd_c.c:2023-2027 (HOFCredits -> CallTask_GameClear)",
  "src/game_clear.c:263-300 (CallTask_GameClear: Location_SetToPlayerRoom, SetGameClearFlag -> FLAG_GAME_CLEAR include/constants/flags.h:1710, league wins)",
  "src/game_clear.c:156-258 (RegisterHallOfFame app, SaveGameNormal + AddHallOfFameEntry (state 4), credits (state 10), OS_ResetSystem(0) (state 11))",
  "src/register_hall_of_fame.c:2207-2215 (REGHOF_WHOLE_SUBPROC_WAIT_BUTTON: the whole-team photo waits for a new A/B/touch, :2210)",
  "src/credits/credits.c:37-38,316-385 (CREDITS_FRAMES 4976; on the first clear only START/touch could skip, A is ignored :318; 'The End' waits for a new A/START/touch :363-382)",
]
notes = "Lance's three Dragonite: Pelipper's Ice Beam (18's boost) behind a fainted lead (send = best). After Lance every screen waits for input: the Hall of Fame photo waits for A/B (register_hall_of_fame.c:2210), 'The End' for a new A/START (credits.c:363-382); A does not skip the first clear's credits (credits.c:318). So one long A cadence from the Hall of Fame's arrival through the walk-in, Lance's speech, the registration and the photo (110 presses, 56 frames apart, ~6160 frames) [INFERENCE: the photo's wait is reached within that run], then the save and the credits (6500 frames), one A for 'The End', and wait_reset without keys (its keys are held, i.e. one press, and none is needed). The save the run is judged on is SaveGameNormal in Task_GameClear state 4, written after CallTask_GameClear set FLAG_GAME_CLEAR, so the E4 defeat flags are still set in it (the League entrance clears them only on its next OnTransition)."

[start]
from = "prev"
# lab = "lab.recipe"  # HG/SS lab recipes: not written yet

[run]
frames = 39000
save = "none"

[[step]]
do = "walk_to"
x = 6
z = 2
note = "Karen's exit (warp 1) -> Lance's room (6,28)"

[[step]]
do = "wait_map"
map = "MAP_POKEMON_LEAGUE_LANCE_ROOM"

[[step]]
do = "advance_text"
note = "OnFrame VAR_UNK_40C8 0 -> the door shuts behind"

[[step]]
do = "walk_to"
x = 6
z = 10
on_text = "stop"
note = "coord 0 (5..7,10) VAR_UNK_40C7 0 -> Lance (scr_seq_0824_T10R0601.s:41-77)"

[[step]]
do = "advance_text"
shot = "lance"

[[step]]
do = "auto_battle"
snap = true
send = "best"
note = "TRAINER_CHAMPION_LANCE: GYARADOS 46, DRAGONITE 49 x2, AERODACTYL 48, CHARIZARD 48, DRAGONITE 50"

[[step]]
do = "advance_text"
map = "MAP_POKEMON_LEAGUE_HALL_OF_FAME"
note = "Lyra, Elm, Oak; Warp MAP_POKEMON_LEAGUE_HALL_OF_FAME (scr_seq_0824_T10R0601.s:83-163)"

[[step]]
do = "wait_map"
map = "MAP_POKEMON_LEAGUE_HALL_OF_FAME"

[[step]]
do = "press"
keys = "A"
times = 110
gap = 56
shot = "hall-of-fame"
note = "OnFrame walk-in and Lance's speech (scr_seq_0825_T10R0701.s:16-38), HallOfFameAnim, the registration screen up to the whole-team photo's wait (register_hall_of_fame.c:2210) [INFERENCE: reached within these ~6160 frames]; later A's land on the save and the credits, which ignore A"

[[step]]
do = "wait_frames"
n = 6500
shot = "the-end"
note = "SaveGameNormal (game_clear.c:182-219) and the credits (CREDITS_FRAMES 4976, credits.c:37) up to 'The End'"

[[step]]
do = "press"
keys = "A"
note = "'The End' waits for a new A/START (credits.c:363-382)"

[[step]]
do = "wait_reset"
max = 1200
note = "OS_ResetSystem(0) (game_clear.c:249-255)"

[expect]
badges = 8
badge = ["BADGE_ZEPHYR", "BADGE_HIVE", "BADGE_PLAIN", "BADGE_FOG", "BADGE_STORM", "BADGE_MINERAL", "BADGE_GLACIER", "BADGE_RISING"]
flags = ["FLAG_GAME_CLEAR", "FLAG_UNK_97E", "FLAG_DEFEATED_WILL", "FLAG_DEFEATED_KOGA", "FLAG_DEFEATED_BRUNO", "FLAG_DEFEATED_KAREN"]
flags_clear = ["FLAG_HIDE_OLIVINE_PORT_OAK", "FLAG_HIDE_LAKE_OF_RAGE_PRYCE"]
battles = 1

[expect.vars]
VAR_UNK_411A = 1
VAR_SCENE_PLAYERS_HOUSE_1F = 3
