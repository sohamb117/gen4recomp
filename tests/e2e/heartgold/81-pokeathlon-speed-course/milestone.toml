notes = "Gates: Whitney's badge (VAR_UNK_40DA 1, 12) opens the gate's west half; JOIN needs 3 able Pokemon (party + PC, CountAliveMonsAndPC): 12's party is CYNDAQUIL/QUILAVA, Togepi (still an egg until it hatches) and SCYTHER [INFERENCE], so boost.recipe adds a fourth. Input: the Speed Course's events (Hurdle Dash, Pennant Capture, Relay Run [INFERENCE: course contents not read from the asm overlays]) are stylus minigames with no decompiled source to plan from: new touch bots are needed (tap rhythm for jumps, drags for running), hence P2. A last place still finishes the course and returns to the reception, so the end state does not need a win. No RTC dependency. The Pokeathlon save (points, medals, records: src/pokeathlon/pokeathlon_save.c) is not in np_save4's dump, so [expect] checks the map, the first-visit var and the fly point; a stronger check would be a log of the Pokeathlon opcode (PC_TRACE_SCRIPT, op=0263) [INFERENCE: the HG/SS guest's script trace is unproven]. Bots proven on HG/SS: walk_to, talk_to, advance_text; needed: touch-event bots for the three events, and the course app's party pick (3 of the party) [INFERENCE: the pick is inside the course app]. [INFERENCE] estimate 24000: ~3000 to the Dome, ~2500 Whitney, ~1500 reception menus, ~15000 for three events with intros and results, ~2000 the return."

[start]
from = "12-whitney-plain-squirtbottle"
boost = "boost.recipe"

[run]
frames = 36000

[expect]
map = "MAP_POKEATHLON_DOME_INTERIOR_1F"
flags = ["FLAG_SYS_FLYPOINT_POKEATHLON"]
save = ['s["vars"]["16610"] >= 1']  # VAR_UNK_40E2 (0x40E2): 1 after Whitney's scene, 2-4 after course milestones (scr_seq_0167.s:396-412)
