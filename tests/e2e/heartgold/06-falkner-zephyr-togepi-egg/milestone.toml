# Proves the first badge and the egg: Violet Gym (its elevator, Bird Keepers Abe/Rod), Falkner and the Zephyr Badge +
# TM51, Elm's call on leaving (OnFrame VAR_SCENE_VIOLET_CITY_OW 1), the aide's Togepi egg in the Poke Mart and the
# Kimono Girl's scene outside (OnFrame OW 3).
# Start: MAP_VIOLET (487,229) -> end: MAP_VIOLET outside the Poke Mart (469,258), badge Zephyr, egg in the party.
title = "Falkner: Zephyr Badge; the aide's Togepi egg"
status = "planned"
priority = "P0"
version = "both"
estimate = 18000
refs = [
  "zone_event 070_T22 warp 2 (479,257) -> MAP_VIOLET_GYM",
  "zone_event 131_T22GYM0101 coord 0 (15,20) VAR_TEMP_x4000 0 -> 004 (VioletGymElevator, scr_seq_0859_T22GYM0101.s:166-169)",
  "src/field/gymmick/violet.c:10-11,47-64,66-80 (the lift: dynamic height plate (14..16,19..21) at y 32 (down) or 496 (up); each ride toggles liftState); scr_seq_0859_T22GYM0101.s:16 (VioletGymInit)",
  "land data map_matrix_0087_T22GYM0101: ground floor rows 19-28 (door (15,28)), walkway maze rows 4-18 with Falkner's room rows 4-8",
  "zone_event 131_T22GYM0101 object 0 obj_T22GYM0101_gsleader1 (15,4); objects 1/2 TRAINER_BIRD_KEEPER_GS_ABE (12,15), TRAINER_BIRD_KEEPER_GS_ROD (18,11)",
  "scr_seq_0859_T22GYM0101.s:63-100 (TRAINER_LEADER_FALKNER_FALKNER, GiveBadge BADGE_ZEPHYR, VAR_SCENE_VIOLET_CITY_OW 1, VAR_SCENE_ELMS_LAB 6, FLAG_GOT_TM51_FROM_FALKNER)",
  "TRAINER_LEADER_FALKNER_FALKNER (20, include/constants/trainers.h:25): PIDGEY 9, PIDGEOTTO 13",
  "scr_seq_0857_T22_hdr.s (OnFrame VAR_SCENE_VIOLET_CITY_OW 1 -> 000, 3 -> 004)",
  "scr_seq_0857_T22.s:25-31 (FLAG_GOT_PICK_UP_EGG_CALL_FROM_ELM, OW 2, ClearFlag FLAG_HIDE_VIOLET_SHOP_LAB_AIDE)",
  "zone_event 070_T22 warp 10 (469,257) -> MAP_VIOLET_POKEMART; zone_event 152_T22FS0101 object 4 obj_T22FS0101_assistantm (6,8)",
  "scr_seq_0858_T22FS0101.s:37-80 (YES/NO, GiveTogepiEgg, FLAG_GOT_EGG_FROM_ELMS_ASSISTANT, OW 3, VAR_SCENE_ELMS_LAB 7)",
  "scr_seq_0857_T22.s:33-60 (Kimono Girl, FLAG_HIDE_VIOLET_KIMONO_GIRL, VAR_SCENE_VIOLET_CITY_OW 4)",
]
notes = "Falkner's Pidgeotto (lv13) outlevels a lv ~10 Cyndaquil: a boost (Ember + levels) is likely needed (AUTHORING.md, Boosts). The aide's YES/NO opens on YES [INFERENCE] (A takes the egg; NO only sets FLAG_UNK_06F and he asks again)."

[start]
from = "prev"
# lab = "lab.recipe"  # HG/SS lab recipes: not written yet

[run]
frames = 27000

[[step]]
do = "walk_to"
x = 479
z = 257
note = "Violet Gym door (warp 2)"

[[step]]
do = "wait_map"
map = "MAP_VIOLET_GYM"

[[step]]
do = "walk_to"
x = 15
z = 20
note = "the lift: a 3x3 dynamic-height plate on (14..16,19..21) (src/field/gymmick/violet.c:55, ELEVATOR_Y_DOWN 32 / _UP 496 :10-11); stepping onto its centre fires coord 0 (VAR_TEMP_x4000 0, which script 004 sets back to 0) -> VioletGymElevator: down -> up (violet.c:66-80)"

[[step]]
do = "wait_field"
note = "the lift rises with the player to the walkways' height"

[[step]]
do = "steps"
route = [[15, 18]]
note = "off the lift's north edge onto the raised walkway (rows 4-18 of the land data; the ground floor is rows 19-28) [INFERENCE: the walkways are the raised BDHC level the lift reaches; the probe's step layers show it]"

[[step]]
do = "talk_to"
id = 0
note = "Falkner (obj_T22GYM0101_gsleader1 (15,4)): walkway route (15,18) (15,15) (18,15) (18,13) (21,13) (21,8) (18,8) (18,5) (land-data BFS); Abe (12,15) faces east, sight 3: he spots (13..15,15); Rod (18,11) faces west, sight 3"

[[step]]
do = "advance_text"

[[step]]
do = "auto_battle"
snap = true
note = "TRAINER_LEADER_FALKNER_FALKNER: PIDGEY 9, PIDGEOTTO 13"

[[step]]
do = "advance_text"
