shot = "togepi-egg"
note = "YES -> GiveTogepiEgg, FLAG_GOT_EGG_FROM_ELMS_ASSISTANT, OW 3, VAR_SCENE_ELMS_LAB 7 (scr_seq_0858_T22FS0101.s:43-80)"

[[step]]
