[expect]
map = "MAP_CHERRYGROVE_POKECENTER_1F"
position = [11, 13]
log = ["dump: .* = \\(5, \\[\\(1, \\['TOGEPI'\\]\\)\\]\\)", "dump: .* = \\(5, \\[\\(2, \\['TOGEPI'\\]\\)\\]\\)"]
save = ['len(s["party"]) == 6', 's["party"][5]["species_name"] == "TOGEPI"', 'all(b["count"] == 0 for b in s["boxes"])']
