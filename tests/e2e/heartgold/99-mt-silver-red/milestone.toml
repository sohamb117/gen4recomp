# Proves the Mt. Silver gate and Red: Oak's call after Blue, HM08 Rock Climb and FLAG_UNLOCKED_MT_SILVER from Oak,
# the League reception gate's policeman stepping aside, Route 28, Mt. Silver to the summit, and Red.
# Start: 98's end (below Blue in the Viridian Gym) -> end: the game's save on MAP_MOUNT_SILVER_CAVE_SUMMIT (30,12) after
# Red, FLAG_UNLOCKED_MT_SILVER, VAR_UNK_40FD 1; the credits end in a reset.
title = "Mt. Silver and Red"
priority = "P2"
version = "both"
estimate = 72220
refs = [
  "scr_seq_0740_T01R0301.s:92-97,198-210 (Oak: VAR_UNK_4096 2 -> _0282: ITEM_HM08, VAR_UNK_4110 2, FLAG_UNLOCKED_MT_SILVER include/constants/flags.h:318, FLAG_GOT_HM08)",
  "scr_seq_0213_R22R0101.s:18-25 (MAP_ROUTE_22_POKEMON_LEAGUE_RECEPTION_GATE OnTransition: FLAG_UNLOCKED_MT_SILVER -> policeman_2 moved aside to (7,8))",
  "zone_event 419_D41R0108 object 0 obj_D41R0108_red (30,11) FLAG_UNK_25F -> 000; warp 0 (30,36) <- MAP_MOUNT_SILVER_CAVE_3F 1",
  "scr_seq_0107_D41R0108.s:10-49 (TRAINER_PKMN_TRAINER_RED_RED :17; loss -> WhiteOut :98; win -> HidePerson Red, FLAG_UNK_25F, VAR_UNK_40FD 1, VAR_UNK_4131 1 (Oak's Kanto starters, the 102 chain), HOFCredits 1)",
  "TRAINER_PKMN_TRAINER_RED_RED (260, include/constants/trainers.h:265)",
  "include/constants/badge.h (16 badges: BADGE_ZEPHYR..BADGE_EARTH)",
]
notes = "Gates: all 16 badges (Blue last, 98), Oak's call on leaving the Viridian Gym (VAR_UNK_4096 1 -> 2; the Pokegear's call, closed with B), then Oak in his lab: HM08 and FLAG_UNLOCKED_MT_SILVER. Scouted on HeartGold (core-proposal): back down the gym's arrow floor (the 98 BFS from (5,5)), Route 22 to the reception gate (the policeman aside), Route 28 (Cut tree, pond) to Mt. Silver's Pokemon Center (healed), the cave. Mt. Silver's floors are pockets joined by warps: a BFS over each map's tiles (surf, waterfall, rock walls 0x4B/0x4C) found 1F's hub unreachable from its mouth, so the way is 1F's rock wall (44,54..58) -> the Lower Mountainside -> 1F's hub -> 2F -> the Upper Mountainside (24,12) -> 2F (38,20) -> UM (39,43) -> 2F (34,38) -> UM (18,51), three rock walls -> 3F, its rock wall -> the summit. walk_to's own planner looped between a rock wall and the water when sent to 1F's far warp directly. The boost puts Rock Climb on FERALIGATR (the HM Oak gives) and levels the party to 100 with a heal for Red (PIKACHU 88 ... BLASTOISE 84; auto_battle won in 15 turns on HG). Winning: the game saves (the end save), HOFCredits 1 rolls the credits to 'The End', A, and OS_ResetSystem as after 38: the expectations read the save (on the summit (30,12)). Measured: HG 72220 frames, SS 71621; the sheets show the gym, Viridian after the call, Oak's lab, Route 28, Red's '...' on the summit, his PIKACHU lv88, 'The End'."

