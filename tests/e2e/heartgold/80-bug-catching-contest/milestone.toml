notes = "Day gate: GetWeekday must be 2 (Tue), 4 (Thu) or 6 (Sat); the port's default epoch 2009-03-22 is a Sunday (games/platinum/pc/src/pc_rtc.c:47-50), so [run] clock picks Tuesday 2009-03-24 10:00; the save's last RTC day is earlier, so the day rolls forward on load (src/unk_02055418.c:41-52: daily flags cleared, no penalty). The 20-minute limit counts RTC minutes (72000 frames at 60 fps): this run ends the contest early through the gate's ask_end prompt, never meeting time_up. No badge/flag gate besides the day; Route 35 north of Goldenrod is open from 11 on (13 walks it). Entry: talk to object 7 (24,3) (the contest-day receptionist); YES, YES to using the lead (11's party: QUILAVA/CYNDAQUIL, the Togepi egg or Togepi, SCYTHER [INFERENCE: 3 members, so the caught bug joins the party]). Catch: walk_to into the contest park's grass until a wild battle; the contest menu has BALL in the BAG slot (battle_input.c:1898-1901), so auto_battle (FIGHT) would only knock it out: a new 'throw' step is needed (tap the BAG-slot button repeatedly until the catch; a level ~10 bug at full HP with the Sport Ball's 1.5x is not a sure catch [INFERENCE]). Then walk to (40,86) -> the gate's OnFrame asks to end, YES; National Park's OnFrame runs the judging (A cadence through the three places, the prize, NO to the nickname). Bots proven on HG/SS: walk_to, talk_to, advance_text; needed: contest ball throw (tap at the BAG-slot coordinates). Optional outline: talk_to obj 7 / advance_text (YES, YES) / walk_to grass / throw / walk_to (40,86) / advance_text YES / advance_text through judging. [INFERENCE] estimate 14000: ~3000 walk Goldenrod->gate, ~1500 entry, ~4000 grass+catch, ~1500 back, ~3500 judging."

