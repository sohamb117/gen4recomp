# Proves the Bug-Catching Contest: on a contest day (Tuesday/Thursday/Saturday by the RTC) the Route 35 park gate's
# contest receptionist registers the player (one Pokemon kept, the rest held), 20 Sport Balls, the contest park,
# a bug caught with a Sport Ball, the gate's 'end the contest?' YES, the judging in National Park and the prize.
# Start: 11's end MAP_GOLDENROD outside the gym (366,335) -> end: MAP_NATIONAL_PARK by the judge (46,50) after the
# judging, FLAG_DAILY_DID_BUG_CONTEST, a Sport Ball mon in the party.
title = "Bug-Catching Contest: entry, Sport Balls, a catch, judging and prize"
priority = "P1"
version = "both"
estimate = 25937
refs = [
