  "scr_seq_0487_R35R0201_hdr.s (OnTransition -> 012; OnFrame VAR_UNK_4118 1 -> 010)",
  "scr_seq_0242_R35R0201.s:81-112 (012: GetWeekday; 2/4/6 or VAR_UNK_4118 1 -> SetFlag FLAG_UNK_1C3 / ClearFlag FLAG_UNK_1C4, other days the reverse)",
