# Proves the Azalea Gym: the entrance hall, the gym's twelve switch tiles (coord events (3|9|15, 32|24|17|9)), the
# Bug Catchers and Twins, Bugsy (TRAINER_LEADER_BUGSY_BUGSY) and the Hive Badge + TM89.
# Start: MAP_AZALEA_KURT_HOUSE (4,5) -> end: MAP_AZALEA outside the gym (405,472), badge Hive.
title = "Bugsy: Hive Badge"
priority = "P0"
version = "both"
estimate = 14493
refs = [
  "zone_event 071_T23 warp 2 (405,471) -> MAP_AZALEA_GYM_ENTRANCE; zone_event 132_T23GYM0101 warp 1 (7,3) -> MAP_AZALEA_GYM (9,37)",
  "zone_event 173_T23GYM0102 coords 0-11 (x 3/9/15, z 32/24/17/9) VAR_TEMP_x4000 0 -> 002..013",
  "zone_event 173_T23GYM0102 object 5 obj_T23GYM0102_gsleader2 (9,5) -> 001",
  "scr_seq_0869_T23GYM0102.s:65-93 (TRAINER_LEADER_BUGSY_BUGSY, GiveBadge BADGE_HIVE, FLAG_GOT_TM89_FROM_BUGSY)",
  "TRAINER_LEADER_BUGSY_BUGSY (21, include/constants/trainers.h:26): SCYTHER 17, KAKUNA 15, METAPOD 15",
  "zone_event 071_T23 object 1 obj_T23_rocketm_2 (405,472) FLAG_UNK_1A9: the Rocket at the gym door, hidden by the well (scr_seq_0060_D26R0102.s:58)",
]
notes = "Ember is super-effective on the whole team. Puzzle from src/field/gymmick/azalea.c: coords 0-11 are Spinarak stations (k = coord index); a ride needs a Spinarak at the station and follows sSpinarakRoutes_Froms[k][switches] (azalea.c:149-246); stations 0-2/6-8 ride forward (step on from the south), 3-5/9-11 backwards (step on from the north). Bugsy's island holds station 10, reached only from station 6 with switches 3 or station 7 with switches 2. Played: 0 -> 4, 7 -> 9 (switches 0), switch 0 at (4,7), 9 -> 6, switch 1 at (2,18), 6 -> 10. [INFERENCE: steps' single-tile moves onto a station start the ride and the probe settles after it]."

