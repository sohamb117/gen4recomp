# Proves the Mahogany Gym: its three rooms of sliding ice, the Skiers/Boarders, Pryce (TRAINER_LEADER_PRYCE_PRYCE), the
# Glacier Badge + TM07; outside, Mahogany's OnFrame (VAR_MIDGAME_BADGES 4) starts the Radio Tower takeover.
# Start: MAP_TEAM_ROCKET_HEADQUARTERS_B2F generator room (30,18) -> end: MAP_MAHOGANY outside the gym (523,184),
# VAR_SCENE_ROCKET_TAKEOVER 2.
title = "Pryce: Glacier Badge; the Rocket takeover begins"
status = "planned"
priority = "P0"
version = "both"
estimate = 25000
refs = [
  "zone_event 084_T28 warp 2 (523,183) -> MAP_MAHOGANY_GYM_ROOM_1 (4,19)",
  "zone_event 354_T28GYM0103 warp 1 (3,2) -> MAP_MAHOGANY_GYM_ROOM_2; zone_event 353_T28GYM0102 warp 1 (6,2) -> MAP_MAHOGANY_GYM_LEADER_ROOM",
  "zone_event 136_T28GYM0101 object 0 obj_T28GYM0101_gsleader7 (7,4)",
  "scr_seq_0932_T28GYM0101.s:69-102 (TRAINER_LEADER_PRYCE_PRYCE, GiveBadge BADGE_GLACIER, AddVar VAR_MIDGAME_BADGES 1, FLAG_GOT_TM07_FROM_PRYCE)",
  "TRAINER_LEADER_PRYCE_PRYCE (32, include/constants/trainers.h:37): SEEL 30, DEWGONG 32, PILOSWINE 34",
  "scr_seq_0930_T28_hdr.s (OnFrame VAR_MIDGAME_BADGES 4 -> 005); scr_seq_0930_T28.s:19-28 (VAR_SCENE_ROCKET_TAKEOVER 2, FLAG_UNK_0C5, FLAG_ROCKET_TAKEOVER_ACTIVE, VAR_UNK_40F8 2, VAR_MIDGAME_BADGES 5)",
  "scr_seq_0255_R43R0101.s:11-15, scr_seq_0934_T28GYM0103.s (gym entry before/after FLAG_ROCKET_HIDEOUT_CLEARED)",
  "the way out after the clear: B2F coords 0-6 test VAR_UNK_40AC 7/8/9 or VAR_UNK_40A9 2 (zone_event 234_D35R0103), now 10/4, so inert; every Rocket object carries FLAG_HIDE_MAHOGANY_SHOP_SHADY_SALESMAN (set scr_seq_0090_D35R0103.s:394); B2F OnResume keeps the doors open at (29,22) (VAR_UNK_40A9 >= 3, :25-38)",
  "B1F after the clear: the traps' vars are all 1 (scr_seq_0090_D35R0103.s:717-732; coords 5-20 fire on == 0); B1F OnResume sets the statue vars 40AD..40B1 to 2 once VAR_UNK_40AC >= 9 (scr_seq_0089_D35R0102.s:66-68, :141-147; coords 0-4 fire on == 0); coord 21 (16,28) VAR_UNK_40C2 == 0 stays live (never set) and warps to (50,4) (:1208-1219): avoided",
  "zone_event 113_D35R0101 warp 1 (6,3) <- B1F warp 0 (51,4); warp 0 (5,9) -> MAP_MAHOGANY 5",
]
notes = "Fire is super-effective on all three. The gym rooms are ice with SPRITE_ICE blocks the slide pushes (src/unk_0206D494.c: a slide that runs into a block facing south pushes it along the ice until it stops; meeting another object both turn north and freeze). Slides from `python3 tests/e2e/tools/hg_map.py MAP_MAHOGANY_GYM_<room> --solve X Z TX TZ` (simulated over the decoded ice; trainers' far sight avoided): room 1 (4,16) UP LEFT UP RIGHT UP -> (3,5) pushing block (4,12) onto (4,8) (both frozen); room 2: Boarder Patton (11,12) LOOK_WEST sight 2 is met adjacent at (10,12), then (10,12) UP LEFT UP RIGHT RIGHT UP -> (6,5) pushing (5,10) onto (8,10); leader room (6,17) UP LEFT UP LEFT DOWN RIGHT RIGHT UP -> (7,8) (Skier Jill (3,9) met adjacent at (4,9)). Back: leader room (7,8) DOWN LEFT DOWN -> (5,17); room 2 (6,5) DOWN RIGHT -> (10,11), valid with its blocks reset or as pushed; room 1 (3,5) DOWN RIGHT DOWN -> (4,16) [INFERENCE: map objects respawn at their event tiles on each room load; an 8-frame press from a standstill walks one tile as on Platinum 36]."

