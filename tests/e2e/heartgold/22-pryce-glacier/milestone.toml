map = "MAP_MAHOGANY_SOUVENIR_SHOP"

[[step]]
do = "walk_to"
x = 5
z = 9
note = "shop door (warp 0)"

[[step]]
do = "wait_map"
map = "MAP_MAHOGANY"

[[step]]
do = "walk_to"
x = 523
z = 183
note = "Mahogany Gym (warp 2)"

[[step]]
do = "wait_map"
map = "MAP_MAHOGANY_GYM_ROOM_1"

