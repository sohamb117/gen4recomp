# Proves the Rising Badge: Dragon's Den by Surf to the shrine, the Elder's five-question quiz (OnFrame VAR_UNK_40C3 0),
# Clair's Rising Badge, then her TM59 at the den entrance (coord VAR_UNK_40C4 1). Sets VAR_SCENE_ELMS_LAB 8 (Elm's
# Master Ball) and VAR_SCENE_NEW_BARK_EAST_EXIT 1.
# Start: MAP_BLACKTHORN (668,152) -> end: MAP_BLACKTHORN outside the den (672,133), badge Rising.
title = "Dragon's Den: the Elder's quiz, Rising Badge"
status = "planned"
priority = "P0"
version = "both"
estimate = 20000
refs = [
  "zone_event 086_T30 warp 2 (672,132) -> MAP_DRAGONS_DEN_ENTRANCE; zone_event 122_D44R0101 warp 1 (6,5) -> MAP_DRAGONS_DEN (28,6)",
  "zone_event 239_D44R0102 warp 2 (28,50) -> MAP_DRAGONS_DEN_SHRINE (6,19)",
  "scr_seq_0112_D44R0103_hdr.s (OnFrame VAR_UNK_40C3 0 -> 003)",
  "scr_seq_0112_D44R0103.s:57-120 (five MenuInitStdGmm 1, 1, 0, 0 questions: cursor on item 0, not cancellable; an item with value 1 is wrong -> _0310 FLAG_FAILED_DRAGONS_DEN_QUIZ): Q1 items 280/281/282 = 0/1/0, Q2 283/284/285 = 0/0/1, Q3 286/287/288 = 1/0/0, Q4 289/290/291 = 0/1/0, Q5 292/293/294 = 1/0/0",
  "src/scrcmd_c.c:992-1000 (sub_02041770: x, y, initCursorPos, cancellable); asm/overlay_01_021EDAFC.s:1303-1330 (ov01_021EE49C: ListMenu_ProcessInput; B does nothing on a menu that cannot be cancelled, the list does not wrap)",
  "scr_seq_0112_D44R0103.s:121-192 (Clair: GiveBadge BADGE_RISING :153, FLAG_UNK_0EA, VAR_UNK_40C4 1, VAR_UNK_40C3 1, VAR_UNK_407B 1, VAR_SCENE_ELMS_LAB 8, ClearFlag FLAG_HIDE_ELMS_LAB_FRIEND, VAR_SCENE_NEW_BARK_EAST_EXIT 1)",
  "zone_event 239_D44R0102 coord 0 (27,14) w3 VAR_UNK_40C4 1 -> 000 (TM59, FLAG_GOT_TM59_FROM_CLAIR, VAR_UNK_40C4 2, scr_seq_0111_D44R0102.s:125-181)",
  "scr_seq_0941_T30_hdr.s (OnFrame VAR_UNK_407B 1 -> 007: VAR_UNK_407B 2)",
]
notes = "Quiz answers (0-based items): Q1 0 or 2, Q2 0 or 1, Q3 1 or 2, Q4 0 or 2, Q5 1 or 2; the plan takes item 0 or item 2 (DOWN x2: the list does not wrap, so extra DOWNs stay on the last item). B advances the Elder's messages but does nothing on the menus (not cancellable), so generous B runs before each A are safe: the intro (msgs 00000/00001) takes 7 presses, each question after a right answer 1 (msg 00009, then the next question). The den's water route to the shrine needs Surf only (no whirlpool tiles in MAP_DRAGONS_DEN: tools/hg_map.py) [INFERENCE: walk_to surf = true]."

[start]
from = "prev"
# lab = "lab.recipe"  # HG/SS lab recipes: not written yet

[run]
frames = 30000

[[step]]
do = "walk_to"
x = 672
z = 132
note = "Dragon's Den (warp 2); the guard steps aside after Clair"

[[step]]
do = "wait_map"
map = "MAP_DRAGONS_DEN_ENTRANCE"

[[step]]
do = "walk_to"
x = 6
z = 5

[[step]]
