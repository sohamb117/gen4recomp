map = "MAP_DRAGONS_DEN_SHRINE"

[[step]]
do = "press"
keys = "B"
times = 10
gap = 30
note = "the Elder's walk-up and intro to Q1 (msg 00000, 00001: 7 presses); the extra B's land on the open menu, which ignores B"

[[step]]
