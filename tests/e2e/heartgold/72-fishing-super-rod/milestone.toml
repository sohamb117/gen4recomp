# Proves the Super Rod: the fishing brother in Route 12's house (5,5) gives it, it is registered to Y in the Bag, and
# it is cast from Route 12's pier into the water east of it until a bite is hooked; the hooked Pokemon's battle is
# fought.
# Start: 95's end (Fuchsia Gym, Kanto) -> end: MAP_ROUTE_12 (1434,318) on the pier by the house, after the hooked
# Pokemon's battle.
title = "The Super Rod: Route 12's house (Kanto)"
priority = "P1"
version = "both"
estimate = 10435
refs = [
  "games/heartgold/files/fielddata/script/scr_seq/scr_seq_0200_R12R0101.s:15-25 (GetItemQuantity ITEM_SUPER_ROD 0 -> the question, YES -> GiveItemNoCheck ITEM_SUPER_ROD; no flag)",
  "zone_event 017_R12 warp 2 (1429,318) -> MAP_ROUTE_12_FISHING_BROTHER_HOUSE; zone_event R12R0101 object 0 SPRITE_FISHING_2 (5,5), warp 0 (4,8)",
  "games/heartgold/src/field_use_item.c:460-465 (the Super Rod's field use: Task_OverworldFish with ROD_TYPE_SUPER)",
  "games/heartgold/asm/overlay_01_021FC66C.s:273-379 (SetFishWait, WaitForFish, CheckForReelInFish), :973-975 (windows 45/30/15 frames)",
  "games/heartgold/pc/src/pc_hg_field.c fish_trace (PC_TRACE_FISH=1: Platinum's pc-fish lines)",
  "tools/hg_world.py grid 1418 310 1439 326: the pier x 1432..1434 at z 315..320, water east of it at x 1435",
]
notes = "Gates: the Kanto post-game as far as Lavender; 95's end save continues in Fuchsia Gym. The way is Fly to Lavender, then 95's legs south over Route 12's water to the house's door (1429,318); the water's wild battles are fled. The fishing brother asks 'Am I right, or am I right?' only while the Bag has no Super Rod; the touch menu's YES (A) gives it. The start menu remembers its cursor: the fly step leaves it on POKEMON, DOWN is BAG. The Super Rod is KEY ITEMS' 11th (95's end save on both games: Apricorn Box .. S.S. Ticket, then the rod): page 2, slot 5 (60,131); REGISTER (155,143) as 70; 'Super Rod 1 SET', bag.registered 447. walk_to (1434,318) facing east stands on the pier's east edge over the water. Scouted on HeartGold (core-proposal, no fishing; the gift's five A presses on the trace core). Needs the core with the HG/SS fishing trace. Measured on the trace core: HG 10401 frames (MAGIKARP lv40 hooked), SS 10435 (TENTACOOL lv40). Probe-only as 70: the replay without PC_TRACE_FISH gave the same hash (HG bb4b2bbdc2eab3b9, SS 2f166872c2f4cef9)."

[start]
