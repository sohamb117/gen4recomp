# Proves talking to the walking partner: the lead Pokemon following the player (obj_partner_poke 253, script
# std_following_mon), turned to and A pressed: FollowMonFacePlayer, FollowMonInteract (the mood/location message),
# its cry/hop, and the field released again.
# Start: 29's end MAP_NEW_BARK (684,394), the first able member following (HG SCYTHER, SS TYPHLOSION) -> end: MAP_NEW_BARK (680,397).
title = "Walking partner: talk to the following Pokemon"
priority = "P1"
version = "both"
estimate = 2077
refs = [
  "include/constants/scrcmd.h:41 obj_partner_poke 253; src/follow_mon.c:1902-1905 (the follower object: id 253, script std_following_mon)",
  "include/constants/std_script.h:622-623 std_following_mon 9700; src/script_manager.c:48 (-> scr_seq_0163, msg_0266)",
  "scr_seq_0163.s:11-16 (0163_000: FollowMonFacePlayer, FollowMonInteract, GoTo _00F0 ReleaseAll); :18-62 (cry / hop movements by facing)",
  "src/scrcmd_c.c:4799-4802 (ScrCmd_FollowMonInteract -> FieldSystem_FollowMonInteract, asm/overlay_02_02248728.s:13939-14200: message picked by map section, species and mood, FieldSystem_UnkSub108_GetMonMood; no save write found in its callees)",
  "src/follow_mon.c:1930-1992 (MON_DATA_MOOD helpers: the mood the message reads)",
  "asm/macros/script.inc:4050-4052 FollowMonInteract = opcode 711 (0x2c7)",
]
notes = "No gate: the first able party member follows (HeartGold 29's TYPHLOSION is fainted, so SCYTHER; SoulSilver's TYPHLOSION is not, so it follows). Observable: the interaction writes nothing to the save (mood is only read; np_save4's dump has no mood field), the probe's object list does not carry the follower (no id 253), and HG/SS has no script trace (PC_TRACE_SCRIPT is a Platinum patch). So the run places the follower: walk_to (680,396) then (680,397), the last step south, so it trails one tile north on (680,396) (scouted: nothing else on that tile: no object, no bg event; facing west there, A starts nothing); UP turns the player to it and A must start a script (press until field_ready=0, which fails the run otherwise); the sheet shows the emote bubble and the message (HeartGold: 'Your Pokemon stretched out its body and is relaxing.'; SoulSilver: 'TYPHLOSION seems to be about to fall over!'; the scout saw 'SCYTHER is staring intently at the sky.': the message is drawn per interaction). Measured: HeartGold 2076 frames, SoulSilver 2077."

[start]
from = "29-new-bark-elm-master-ball"

[run]
frames = 3200

[[step]]
do = "walk_to"
x = 680
z = 396

[[step]]
do = "walk_to"
x = 680
z = 397
note = "the last step south: the follower trails one tile north, on (680,396)"

[[step]]
do = "press"
keys = "up"
hold = 2
gap = 10
note = "a turn in place toward the follower"

[[step]]
do = "press"
keys = "a"
hold = 2
gap = 30
times = 3
until = "field_ready=0"
note = "A facing the follower: std_following_mon (FollowMonFacePlayer, FollowMonInteract)"

[[step]]
do = "wait_frames"
n = 120
shot = "emote"
note = "the follower turns and shows its emote bubble"

[[step]]
do = "wait_frames"
n = 120
shot = "message"
note = "its message"

[[step]]
do = "advance_text"

[expect]
map = "MAP_NEW_BARK"
position = [680, 397]
