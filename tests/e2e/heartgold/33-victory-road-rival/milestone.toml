# Proves Victory Road: 1F-3F (Strength boulders, the 3F holes; 3F's Rock Smash rocks are off the route), the rival's
# last story battle on 3F (TRAINER_RIVAL_SILVER_13), out to Indigo Plateau and into the Pokemon League entrance.
# Start: MAP_ROUTE_22_POKEMON_LEAGUE_RECEPTION_GATE (11,15) -> end: MAP_POKEMON_LEAGUE_ENTRANCE (11,24), VAR_UNK_40C5 1.
title = "Victory Road: the rival, Indigo Plateau"
status = "planned"
priority = "P0"
version = "both"
estimate = 30000
refs = [
  "zone_event 270_R22R0101 warp 1 (11,2) -> MAP_VICTORY_ROAD_1F 0 (46,59)",
  "zone_event 121_D43R0101 warps 1/2 (19,7/6) -> 2F 0 (7,31); objects 3-5 Strength boulders (43,52) (25,17) (24,15)",
  "zone_event 171_D43R0102 warps 1-8 -> 3F; zone_event 172_D43R0103 warps 1-4 back to 2F, warps 0/5 (38,14/13) -> MAP_INDIGO_PLATEAU (912,218)",
  "zone_event 172_D43R0103 coords 1-5 (55,42) (26,38) (29,44) (20,18) (56,28) VAR_UNK_40C9 0 -> 2F (57,42) (28,38) (31,44) (22,17) (58,28) (scr_seq_0110_D43R0103.s:174-236)",
  "zone_event 172_D43R0103 coord 0 (37,21) w3 VAR_UNK_40C5 0 -> 000",
  "scr_seq_0110_D43R0103.s:17-97 (rival: 155 -> TRAINER_RIVAL_SILVER_13 :60, FLAG_HIDE_VICTORY_ROAD_RIVAL, VAR_UNK_40C5 1)",
  "TRAINER_RIVAL_SILVER_13 (272, include/constants/trainers.h:277): SNEASEL 36, GOLBAT 38, MAGNETON 37, HAUNTER 37, KADABRA 37, FERALIGATR 40",
  "zone_event 055_T10 warp 1 (912,200) -> MAP_POKEMON_LEAGUE_ENTRANCE 0 (11,25)",
  "scr_seq_0819_T10R0101.s:19-31 (OnTransition: E4 retreat/exit flags reset, FLAG_DEFEATED_WILL/KOGA/BRUNO/KAREN cleared)",
  "zone_event 171_D43R0102 object 4 obj_D43R0102_rock_2 (50,28) std_field_strength; FLAG_STRENGTH_ACTIVE is cleared on every map change (src/field_warp_tasks.c:232-236 -> sub_02067AE4/sub_02067A88, asm/unk_02067A60.s:53-54,101-102 StrengthFlagAction FLAG_ACTION_CLEAR), so 2F needs Strength again after the fall",
  "zone_event 172_D43R0103 objects 4-10 SPRITE_BREAKROCK std_field_rock_smash (33,31) (33,32) (33,33) (43,19) (45,21) (47,20) (42,21): BFS over 3F (jumps one-way, holes avoided) reaches the same goals with them standing ((49,39) -> (55,42), (54,22) -> (29,44), (25,45) -> (38,21) -> (38,14)); 1F/2F have no breakrocks (zone_event 121_D43R0101, 171_D43R0102): no Rock Smash needed",
]
notes = "Route from the decoded floors (`python3 tests/e2e/tools/hg_map.py MAP_VICTORY_ROAD_<n>F`; BFS over collision with jump tiles 0x38-0x3B taken in their direction, which carry the collision bit here): 1F: Strength boulder 3 (43,52) pushed up from (43,53) opens the way to the 2F ladder; 2F: the arrival part reaches only the 3F ladder (51,38) whose 3F part is closed but for hole coord 1 (55,42) -> 2F (57,42) (scr_seq_0110_D43R0103.s:174-177,199-236; VAR_UNK_40C9 is never set); that 2F pocket holds Strength boulder 4 (50,28), next to the part with the 3F ladder (56,21): the pocket reaches (51,28) ((57,42) (57,31) (54,31) (54,28) (51,28)); one push LEFT puts the boulder on (49,28), the pocket's only way to (49,27) -> row 26 -> (52..53,25) -> the ladder part, so a second push LEFT (boulder -> (48,28), floor, not on any later path) opens it: (49,28) (49,26) (52,26) (52,22) (56,22) (BFS: after one push the ladder is unreachable, after two it is); the boulder cannot go up ((50,27) wall) and pushing from (50,29) would need it on (50,27); 3F from (54,22): hole coord 3 (29,44) -> 2F (31,44) -> 2F ladder (27,44) -> 3F (25,45), the part with the rival's coord 0 and the exit; holes avoided elsewhere. Strength needs HM04 + Plain Badge (the 26 boost's Feraligatr carries it); no trainers on the floors. The 2D model ignores BDHC heights (1F has bridge tiles 0x70/0x72): walk_to plans with the probe's layers [INFERENCE]. The League entrance rival (TRAINER_RIVAL_SILVER_19/20/21, scr_seq_0819_T10R0101.s:75-131) only appears post-game (:34-48)."

