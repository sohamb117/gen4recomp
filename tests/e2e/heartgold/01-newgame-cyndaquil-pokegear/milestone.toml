# Proves the HG/SS new game from a blank chip: the recorded intro (touch tutorial, Oak, boy, default name), the
# bedroom, Mom's OnFrame scene (Bag, Trainer Card, Save, Options), Lyra and Marill outside, Elm's lab (his intro, the
# starter machine: CYNDAQUIL), the aide's Potions, Lyra's second scene, Mom's Pokegear and Elm's phone number at the
# west exit.
# Start: blank chip -> end: MAP_NEW_BARK west exit (676,399), VAR_SCENE_NEW_BARK_WEST_EXIT 1, party Cyndaquil.
title = "New game, the bedroom, Mom, Elm's lab: Cyndaquil, Pokegear, Elm's number"
status = "planned"
priority = "P0"
version = "both"
estimate = 30000
refs = [
  "docs/HANDOFF-hgss.md:84-104 (intro schedule, both games)",
  "zone_event 061_T20R0202 warp 0 (3,4) -> MAP_NEW_BARK_PLAYER_HOUSE_1F",
  "scr_seq_0618_T20R0201_hdr.s:12-13 (OnFrame VAR_SCENE_PLAYERS_HOUSE_1F 0 -> script 000)",
  "scr_seq_0845_T20R0201.s:17-52 (Mom: FLAG_GOT_BAG, FLAG_GOT_TRAINER_CARD, FLAG_GOT_SAVE_BUTTON, FLAG_GOT_OPTIONS_BUTTON, VAR_SCENE_PLAYERS_HOUSE_1F 1)",
  "zone_event 060_T20R0201 warp 0 (3,10) -> MAP_NEW_BARK",
  "scr_seq_0615_T20_hdr.s (OnFrame VAR_SCENE_PLAYERS_HOUSE_1F 1 -> 003, VAR_SCENE_NEW_BARK_TOWN_OW 1 -> 008)",
  "scr_seq_0842_T20.s:1066-1096 (Lyra/Ethan + Marill: VAR_SCENE_PLAYERS_HOUSE_1F 2, FLAG_HIDE_NEW_BARK_MARILL, FLAG_HIDE_NEW_BARK_FRIEND)",
  "zone_event 057_T20 warp 0 (684,393) -> MAP_NEW_BARK_ELMS_LAB_1F",
  "zone_event 058_T20R0101 coord 1 (3,10) w4 VAR_SCENE_ELMS_LAB 0 -> 011",
  "scr_seq_0843_T20R0101.s:53-101 (Elm's intro and phone call: FLAG_ELMS_LAB_PREVENT_PLAYER_ESCAPE)",
  "zone_event 058_T20R0101 bg (8,4) dir 0 -> scr_seq_T20R0101_012",
  "scr_seq_0843_T20R0101.s:164-216 (ChooseStarter, FLAG_GOT_STARTER, SetStarterChoice, nickname menu, VAR_SCENE_ELMS_LAB 1, VAR_SCENE_NEW_BARK_TOWN_OW 1)",
  "src/choose_starter_app.c:307-311 (Chikorita, Cyndaquil, Totodile)",
  "src/choose_starter_app.c:1071-1104 (A / LEFT / RIGHT; one nav input plus two A presses)",
  "src/choose_starter_app.c:383-387,976-1007 (LEFT = clockwise: curSelection + 1)",
  "src/scrcmd_c.c:2394-2398 (SetStarterChoice -> VAR_PLAYER_STARTER, include/constants/vars.h:63)",
  "zone_event 058_T20R0101 coord 0 (3,11) w4 VAR_SCENE_ELMS_LAB 1 -> 003",
  "scr_seq_0843_T20R0101.s:492-553 (aide: 5 ITEM_POTION, VAR_SCENE_ELMS_LAB 2)",
  "scr_seq_0842_T20.s:1181-1215 (Lyra's starter scene: VAR_SCENE_NEW_BARK_TOWN_OW 2)",
  "zone_event 057_T20 warp 1 (695,396) -> MAP_NEW_BARK_PLAYER_HOUSE_1F",
  "scr_seq_0845_T20R0201.s:100-144 (Mom after FLAG_GOT_STARTER: FLAG_GOT_POKEGEAR, YES/NO)",
  "zone_event 057_T20 coord 0 (676,396) h7 VAR_SCENE_NEW_BARK_WEST_EXIT 0 -> 002",
  "scr_seq_0842_T20.s:269-282 (no Pokegear: pushed back), :493-621 (Elm: RegisterGearNumber PHONE_CONTACT_PROF__ELM, VAR_SCENE_NEW_BARK_WEST_EXIT 1)",
  "TRAINER_LEADER_FALKNER_FALKNER (20, include/constants/trainers.h:25): PIDGEY 9, PIDGEOTTO 13",
  "TRAINER_LEADER_BUGSY_BUGSY (21, include/constants/trainers.h:26): SCYTHER 17, KAKUNA 15, METAPOD 15",
  "TRAINER_LEADER_JASMINE_JASMINE (33, include/constants/trainers.h:38): MAGNEMITE 30, MAGNEMITE 30, STEELIX 35",
