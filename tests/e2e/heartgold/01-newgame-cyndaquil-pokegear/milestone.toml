notes = "Starter: CYNDAQUIL (VAR_PLAYER_STARTER 155). Fire hits Bugsy's whole team (Scyther/Kakuna/Metapod), Jasmine's Magnemite/Steelix and Pryce's Ice types super-effectively and is neutral on Falkner (Pidgey/Pidgeotto), Whitney (Clefairy/Miltank) and Morty; Chikorita is weak to Falkner and Bugsy, Totodile only helps against Chuck's Primeape. Cost: the rival takes Totodile (Cherrygrove TRAINER_PASSERBY_BOY_3, then the Croconaw/Feraligatr teams, scr_seq_0850_T21.s:548-561). Starter machine: curSelection starts at 0 = Chikorita [INFERENCE: the work struct is zero-filled; no other init writes curSelection]; LEFT rotates clockwise to index 1 = Cyndaquil, then A (zoom in, confirm) and A (choose). The nickname question (GetMenuChoice, :186) is answered NO with B. Mom's Pokegear YES/NO (:130) either answer only changes the text. Intro: 16101 frames to the boy's silhouette (HANDOFF-hgss.md:44-47)."

[start]
blank = true

[run]
frames = 45000
options = ["text_instant=0"]  # intro.press was recorded at the real text speed

[[step]]
do = "schedule"
file = "intro.press"
note = "touch tutorial, Oak, boy, default name Chase (docs/HANDOFF-hgss.md:44-47, 84-104)"

[[step]]
do = "wait_field"
max = 4000
shot = "bedroom"
note = "field load in the player's room, MAP_NEW_BARK_PLAYER_HOUSE_2F"

[[step]]
do = "walk_to"
x = 3
z = 4
note = "2F stairs (zone_event 061_T20R0202 warp 0) -> 1F"

[[step]]
do = "wait_map"
map = "MAP_NEW_BARK_PLAYER_HOUSE_1F"

[[step]]
do = "advance_text"
shot = "mom-bag-card"
note = "OnFrame VAR_SCENE_PLAYERS_HOUSE_1F 0 -> Mom: Bag, Trainer Card, Save, Options -> VAR 1 (scr_seq_0845_T20R0201.s:17-52)"

[[step]]
do = "walk_to"
x = 3
z = 10
note = "1F door (zone_event 060_T20R0201 warp 0) -> New Bark warp 1 (695,396)"

[[step]]
do = "wait_map"
map = "MAP_NEW_BARK"

[[step]]
do = "advance_text"
note = "OnFrame VAR_SCENE_PLAYERS_HOUSE_1F 1 -> Lyra/Ethan and Marill -> VAR 2 (scr_seq_0842_T20.s:1066-1096)"

[[step]]
do = "walk_to"
x = 684
z = 393
note = "Elm's lab door (zone_event 057_T20 warp 0) -> lab (4,14)"

[[step]]
do = "wait_map"
map = "MAP_NEW_BARK_ELMS_LAB_1F"

[[step]]
do = "walk_to"
x = 4
z = 10
on_text = "stop"
note = "coord 1 (3..6,10) VAR_SCENE_ELMS_LAB 0 -> Elm walks the player up, his phone rings (scr_seq_0843_T20R0101.s:53-101); the z=11 coord needs VAR 1, not yet"

[[step]]
do = "advance_text"
shot = "elm-intro"

[[step]]
do = "walk_to"
x = 8
z = 5
face = "up"
interact = true
note = "the starter machine: bg (8,4) dir 0 -> scr_seq_T20R0101_012 ChooseStarter [INFERENCE: approached from below]"

[[step]]
do = "wait_frames"
n = 150
note = "the starter scene fades in and its camera settles (CHOOSE_STARTER_STATE_HANDLE_INPUT waits for the camera, src/choose_starter_app.c:355-358)"

[[step]]
do = "press"
keys = "LEFT"
note = "clockwise: Chikorita (0) -> Cyndaquil (1), and into SELECT_STATE_INSPECT (src/choose_starter_app.c:383-387, 997-1000, 416-436)"

[[step]]
do = "wait_frames"
n = 90
note = "rotation of 120 degrees at 0.5/frame"

[[step]]
do = "press"
keys = "A"
note = "INSPECT -> CONFIRM_CHOICE (zoom in, Elm asks; src/choose_starter_app.c:1078-1080)"

[[step]]
do = "wait_frames"
n = 90

[[step]]
do = "press"
keys = "A"
shot = "starter-chosen"
note = "CONFIRM -> CHOSE_STARTER (src/choose_starter_app.c:1076-1077): Cyndaquil, FLAG_GOT_STARTER"

[[step]]
do = "wait_frames"
n = 240
note = "the scene fades out to the field; ScrCmd_605/608 follower setup (scr_seq_0843_T20R0101.s:171-177)"

[[step]]
do = "press"
keys = "A"
times = 2
gap = 40
note = "'... received CYNDAQUIL' + fanfare, then the nickname question (msg 00007/00008) [INFERENCE: count]"

[[step]]
do = "press"
keys = "B"
note = "nickname YES/NO -> NO (GetMenuChoice :186; README: B answers YES/NO as NO)"

[[step]]
do = "advance_text"
note = "Elm's errand speech -> VAR_SCENE_ELMS_LAB 1, VAR_SCENE_NEW_BARK_TOWN_OW 1 (:200-216)"

[[step]]
do = "walk_to"
x = 4
z = 11
on_text = "stop"
note = "coord 0 (3..6,11) VAR_SCENE_ELMS_LAB 1 -> the aide's 5 Potions -> VAR 2 (scr_seq_0843_T20R0101.s:492-553)"

[[step]]
do = "advance_text"

[[step]]
do = "walk_to"
x = 4
z = 14
note = "lab door (zone_event 058_T20R0101 warp 0) -> New Bark (684,393)"

[[step]]
do = "wait_map"
map = "MAP_NEW_BARK"

[[step]]
do = "advance_text"
shot = "lyra-starter"
note = "OnFrame VAR_SCENE_NEW_BARK_TOWN_OW 1 -> Lyra's scene -> OW 2 (scr_seq_0842_T20.s:1181-1215)"

[[step]]
do = "walk_to"
x = 695
z = 396
note = "home (zone_event 057_T20 warp 1); the west exit pushes back without the Pokegear (scr_seq_0842_T20.s:269-282)"

[[step]]
do = "wait_map"
map = "MAP_NEW_BARK_PLAYER_HOUSE_1F"

[[step]]
do = "talk_to"
id = 0
note = "Mom (obj_T20R0201_gsmama): FLAG_GOT_POKEGEAR (scr_seq_0845_T20R0201.s:115-144)"

[[step]]
do = "advance_text"
shot = "pokegear"
note = "'Do you remember how?' YES/NO: A picks YES, either branch only changes the text (:129-140)"

[[step]]
do = "walk_to"
x = 3
z = 10

[[step]]
do = "wait_map"
map = "MAP_NEW_BARK"

[[step]]
do = "walk_to"
x = 676
z = 399
on_text = "stop"
note = "coord 0 (676,396..402) VAR_SCENE_NEW_BARK_WEST_EXIT 0 with the Pokegear -> Elm runs out, registers his number (scr_seq_0842_T20.s:493-621)"

[[step]]
do = "advance_text"
shot = "elm-number"

[expect]
map = "MAP_NEW_BARK"
flags = ["FLAG_GOT_BAG", "FLAG_GOT_TRAINER_CARD", "FLAG_GOT_SAVE_BUTTON", "FLAG_GOT_OPTIONS_BUTTON", "FLAG_GOT_STARTER", "FLAG_GOT_POKEGEAR", "FLAG_HIDE_NEW_BARK_FRIEND", "FLAG_HIDE_NEW_BARK_MARILL"]
flags_clear = ["FLAG_ELMS_LAB_PREVENT_PLAYER_ESCAPE"]
party = ["SPECIES_CYNDAQUIL"]
party_size = 1

[expect.vars]
VAR_PLAYER_STARTER = "SPECIES_CYNDAQUIL"
VAR_SCENE_PLAYERS_HOUSE_1F = 2
VAR_SCENE_ELMS_LAB = 2
VAR_SCENE_NEW_BARK_TOWN_OW = 2
VAR_SCENE_NEW_BARK_WEST_EXIT = 1
