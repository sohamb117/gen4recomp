notes = "Gates: 14 (Burned Tower) starts the roamers; nothing else. The roamers' locations are random per map change (field_roamer.c), so a deterministic run needs either a hunt bot (walk/fly between Johto routes, walk in grass until a roamer encounter, Mean Look/fast ball) - none exists in tests/e2e/bots.py - or a start recipe placing the player on the roamer's current route (recipes cannot set roamer save data). The roamer flees on turn 1: catching needs a trapping move or the Master Ball (29) [INFERENCE]. Check possible: np_save4 HG/SS dump has no roamer keys, so the only check is party species (243 Raikou / 244 Entei) via save = [...] over s['party']; VAR_ROAMER_*_STATUS via [expect.vars] if the status values are confirmed [INFERENCE]. Suicune is scripted (Route 25 after Misty / Route 14 sighting, then a Burned Tower static if it was knocked out) and could be a separate deterministic milestone from 93. RTC: none. [INFERENCE] estimate."

