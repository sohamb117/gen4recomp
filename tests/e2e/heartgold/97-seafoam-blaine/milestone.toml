# Proves the Kanto gym Blaine (Volcano Badge) in the Seafoam Islands.
# Start: 96-pewter-brock's end -> end: MAP_SEAFOAM_ISLANDS_CINNABAR_GYM after the leader, BADGE_VOLCANO.
title = "Kanto gym: Blaine (Volcano Badge) in the Seafoam Islands"
priority = "P2"
version = "both"
estimate = 51410
refs = [
  "scr_seq_0015_D11R0106.s:20-58 (OnTransition: hour hiding of FLAG_HIDE_SEAFOAM_GYM_BLAINE only with BADGE_EARTH / rematch)",
  "scr_seq_0015_D11R0106.s:83-92 (CheckBadge BADGE_VOLCANO, TRAINER_LEADER_BLAINE_BLAINE :88, GiveBadge BADGE_VOLCANO)",
  "TRAINER_LEADER_BLAINE_BLAINE (259, include/constants/trainers.h:264)",
  "scr_seq_0815_T09.s:85-166 (Blue on Cinnabar: FLAG_UNK_128; VAR_UNK_4135 >= 7 -> FLAG_UNK_129, FLAG_HIDE_VIRIDIAN_CITY_OLD_MAN_OUTSIDE_GYM_LOCKED set, ..._UNLOCKED cleared :163-166) - feeds 98",
]
notes = "From Pewter (96) south: Route 2 east (the Cut trees (1034,137), (1041,218)), the southeast gatehouse, Viridian (the ledge at (1035,267) is jumped south), the Route 1 gatehouse, Pallet, then Surf down Route 21 to Cinnabar (its Pokemon Center heals) and east along Route 20 to the Seafoam Islands' east mouth (1127,501) (the legs keep off the trainers standing on the static route: (1077,502), (1085,502), (1111,504)). Blaine's gym is warp 4 (55,24) of Seafoam 1F. Its trainers stand in the rock maze's gaps and step aside once beaten, some to the side the player's facing picks (scr_seq_0015_D11R0106.s _002.._007); a search over tools/hg_map.py's maze with each one's moved tile gives Lowell (object 2) from (15,18), Cary (5) from (19,14), Merle (7) from (8,12), Blaine from (13,13) (talk_to plans only the side an object faces, so each is a walk_to, a turn and A). Volcano Badge: Kanto badge 6. Then Fly to Cinnabar: Blue (object 0, (1036,494)) after the 7th Kanto badge opens the Viridian Gym (98: the gym old man flags swap). Measured: HG 49618 frames, SS 51410; the sheets show Brock's gym (start), Blaine's cave gym after the badge, Cinnabar after Blue, Blaine's Magcargo lv54 against Typhlosion lv70."

