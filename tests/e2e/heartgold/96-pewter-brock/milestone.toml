# Proves the Kanto gym Brock (Boulder Badge) and the Pewter wing.
# Start: 95-fuchsia-janine's end -> end: MAP_PEWTER_GYM after the leader, BADGE_BOULDER.
title = "Kanto gym: Brock (Boulder Badge) and the Pewter wing"
priority = "P2"
version = "both"
estimate = 39982
refs = [
  "scr_seq_0752_T03GYM0101.s:14-62 (OnTransition: hour hiding of FLAG_HIDE_PEWTER_GYM_BROCK only with BADGE_EARTH / rematch)",
  "scr_seq_0752_T03GYM0101.s:94-98 (TRAINER_LEADER_BROCK_BROCK, GiveBadge BADGE_BOULDER)",
  "TRAINER_LEADER_BROCK_BROCK (253, include/constants/trainers.h:258)",
  "zone_event 048_T03 object 0 obj_T03_gsoldman1 (1069,94) -> 000; scr_seq_0750_T03.s:44-79 (HG: ITEM_SILVER_WING, FLAG_UNK_094, ClearFlag FLAG_HIDE_WHIRL_ISLAND_LUGIA; SS: ITEM_RAINBOW_WING, FLAG_UNK_093, ClearFlag FLAG_HIDE_BELL_TOWER_HO_OH) - feeds 100",
  "scr_seq_0741_T02.s:42-46 (Viridian OnTransition: FLAG_UNLOCKED_WEST_KANTO)",
]
notes = "Way to Pewter, scouted on HeartGold (core-proposal): Route 22's reception-gate policeman sends the player back (scr_seq R22R0101_001, VAR_UNK_4121), and the sea way to Cinnabar/Pallet is closed by the Seafoam Islands (97), so the way is Diglett's Cave from Route 11, whose mouth Snorlax blocks. Lavender's radio director (object 5) gives the EXPN Card once the power is back (93, scr_seq_0775_T05R0701.s); the Pokegear radio (X, POKEGEAR (46,155), the radio tab (82,178)) is tuned by dragging the tuner from where the chain left it to (128,48), the Poke Flute's spot (sTuningHitboxes_KantoEXPN 8/9, station 4); the music keeps playing in the field, and A on Snorlax (1354,304) starts WildBattle SNORLAX 50; fleeing sets FLAG_SNORLAX_MEET and hides it. Diglett's Cave: the ladder (4,4) -> (34,86), the corners tools/hg_map.py --solve gives to the ladder (10,38) -> (43,6), the exit (37,10) -> Route 2 east (1048,138); the Cut tree (1034,137); Pewter. The old man (1069,94) gives the version's wing (HG: Silver Wing, SS: Rainbow Wing; HG's chain already holds a Rainbow Wing). Brock (object 1, (7,4)): the Boulder Badge, Kanto badge 0. Measured: HG 37831 frames, SS 39982; the sheets show Janine's gym (start), the radio station after the EXPN Card, the radio tuned to the Poke Flute, Pewter after the old man's wing, Brock's gym after the badge, his Graveler lv51 against Typhlosion lv69."

