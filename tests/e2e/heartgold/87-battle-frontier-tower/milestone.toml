# Proves the Battle Frontier's Battle Tower: the Route 40 gatehouse (its guard steps aside only after the Hall of
# Fame), Frontier Access, the Tower lobby's CHALLENGE -> SINGLE BATTLE, 3 Pokemon picked, the save before the climb,
# the elevator, 7 Level 50 battles in a row and the return to the lobby with the streak recorded.
# Start: 38's end save, continued in MAP_NEW_BARK_PLAYER_HOUSE_2F (6,6) -> end: MAP_BATTLE_TOWER lobby after the
# 7th win, VAR_UNK_414B 0.
title = "Battle Frontier: Battle Tower singles, 7 wins"
priority = "P1"
version = "both"
estimate = 60698
refs = [
  "src/game_clear.c:267-292 + src/location_backup.c:1-34 (the game-clear save continues in MAP_NEW_BARK_PLAYER_HOUSE_2F (6,6))",
  "zone_event W40R0101 (MAP_ROUTE_40_BATTLE_FRONTIER_GATEHOUSE) warps (5,12) -> MAP_ROUTE_40, (5,2) -> MAP_BATTLE_FRONTIER_FRONTIER_ACCESS; object gsmiddleman1 (5,3) blocks the north warp",
  "scr_seq_0963_W40R0101.s:10-18 (OnTransition: FLAG_GAME_CLEAR -> MovePersonFacing the guard to (3,3)); :19-50 (before: turned back)",
  "zone_event 367_D32R0102 coord 0 (12,28) w6 VAR_UNK_40E5 0 -> 001 (first-visit walk-in, VAR_UNK_40E5 1, FLAG_UNK_25B: scr_seq_0081_D32R0102.s:65-117); warps 2/3 (14/15,7) -> MAP_BATTLE_FRONTIER_FRONTIER_ACCESS_GATEHOUSE",
  "zone_event 244_D32R0101 warps 0-2 (6-8,2) -> MAP_BATTLE_FRONTIER; zone_event 243_D32 warps 0/1 (48/49,17) -> MAP_BATTLE_TOWER",
  "zone_event 240_D31R0201 object 0 bfsm (15,5) -> 000",
  "scr_seq_0069_D31R0201.s:173-243 (000: CHALLENGE/INFO/EXIT msg_0191.gmm 143-145; SINGLE BATTLE/DOUBLE BATTLE/CANCEL 475/476/94; ScrCmd_410 0, 0 single :221)",
  "scr_seq_0069_D31R0201.s:244-513 (party checks ScrCmd_412 53 / DaycareSanitizeMon, pick, SaveGameNormal :503, Warp MAP_BATTLE_TOWER_ELEVATOR (3,6) :513)",
  "scr_seq_0070_D31R0202.s:13-92 (elevator: ScrCmd_412 43 mode, Warp to the battle rooms)",
  "src/scrcmd_9.c:61-200 (ScrCmd_412 Battle Tower sub-commands; 43 = FrontierFieldSystem_GetBattleTowerMode); src/frontier/ (the battle rooms' frontier script engine)",
  "scr_seq_0330_D31R0201_hdr.s (OnFrame VAR_UNK_414B 1 -> 003, 2 -> 004, 3 -> 007, 255 -> 005); scr_seq_0069_D31R0201.s:973-1000 (003: back in the lobby after the set, results), :349-387 (004), :388-413 (005)",
  "scr_seq_0069_D31R0201.s:96-170 (006: the prize receptionist's trophies at 20/50/100 BP-level streaks: FLAG_HIDE_PLAYERS_ROOM_*_TROPHY)",
  "include/constants/vars.h:92 VAR_BATTLE_TOWER_PRINT_PROGRESS, :346 VAR_UNK_414B",
]
notes = "Gate: FLAG_GAME_CLEAR (the Route 40 gatehouse guard, scr_seq_0963_W40R0101.s:10-18), so the start is 38's game-clear save, continued in the player's room. Scouted on HeartGold (core-proposal): Fly to Olivine lands at (272,258); Route 40's gatehouse door is (237,266); the gatehouse's north mat (5,2) leads to Frontier Access (14,34), whose first-visit coord scene ran no text; its gatehouse (14,7) has a warp panel at (7,20) that moves the player to (7,17) (walk_to stops on it as 'an unexpected warp panel'; a second walk_to goes on), and its north mats lead to the Battle Frontier (48,52); the Tower door is (48,17), the lobby arrival (15,19). The attendant (object 0, 15,5): 'Welcome', CHALLENGE, SINGLE BATTLE, 'Please select the Pokemon', the pick screen (two columns: slot 0 top left, 1 top right, 2 and 3 the middle row, 4 and 5 the bottom; A opens ENTER, A enters it; after the third the cursor jumps to CONFIRM): TYPHLOSION (0), AMPHAROS (3: RIGHT, DOWN), FERALIGATR (5: DOWN), all lv50 under the Tower's rules; then YES to the save, YES to overwrite, 'I will now show you to the Battle Room.', the elevator (map 266) and the frontier engine's corridor and Battle Room (the map id stays 266). Frontier battles start from the frontier engine (Frontier_LaunchApplication with gOverlayTemplate_Battle), not Encounter_New, so NP_STAT_IN_BATTLE needs the battle-app flag (pc/patches/src/launch_application.c.patch, as Platinum's unk_0203D1B8.c.patch). The rooms drew black until armrec's extended-palette fix (tests/e2e/DEFECTS.md: G at mst 4, ofs 1). Between battles the attendant's menu is answered with A (its first entry, CONTINUE). The boost: Earthquake on TYPHLOSION and FERALIGATR (the first run lost its third battle to a Volt Absorb Chinchou). After the seventh win the Battle Video question starts on NO; the lobby (a FieldSystem_Control map type with no SAVE) is left by its door for the end save. Measured on the trace core: HG 60698 frames (Porygon, Kabuto, Chinchou, Koffing, Castform, Smoochum, Electabuzz), SS 54518 (Farfetch'd, Squirtle, Larvitar, Azumarill, Chimchar, Mantyke, Mightyena); in_battle rose and fell 7 times on each. The sheets show the elevator, the corridor and the Battle Room drawn (floor, walls, pillars, the yellow carpet), the room again after each win."

