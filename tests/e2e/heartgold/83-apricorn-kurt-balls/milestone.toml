notes = "RTC: the ball needs a new day (FLAG_DAILY_KURT_MAKING_BALLS is a daily flag). The port's clock advances one second per 60 frames from the epoch (games/platinum/pc/src/pc_rtc.c:1-30), so a whole day cannot pass in a run: [run] clock boots at 23:55 on the chain's own day (2009-03-22, the default epoch; 08's save last saw 10:xx that day, so this is forward: no reset, no penalty), the apricorn is picked and given before midnight (~50 s of play), then the player waits in the house past 00:00 (frame ~18000 from boot; the field's per-frame RTC check rolls the day) and talks to Kurt again. Input: the Apricorn Box app (ScrCmd_739, overlay 58) is undecompiled asm; it is assumed to take D-pad/A like the bag [INFERENCE: not traced] - with one apricorn in the box the first entry is the WHT one. The granddaughter's phone YES/NO follows the first gift. Gates: Kurt home and FLAG_UNK_07C set (08); the box (02). Bots proven on HG/SS: walk_to, talk_to, advance_text; new: a wait_frames step to pass midnight (exists: wait_frames), and the apricorn-box choice (press A/arrows, unproven). Outline: walk_to (399,455) out, talk_to the tree (A, YES if asked), walk_to the door, talk_to Kurt (box app: A on the WHT apricorn, confirm), advance_text through the phone scene (YES), wait_frames to ~frame 18600, talk_to Kurt, advance_text. [INFERENCE] estimate 20000 (18000 of it the wait)."

[start]
from = "08-slowpoke-well-proton-kurt"

[run]
frames = 30000
clock = "2009-03-22 23:55:00"   # 5 game minutes (18000 frames) before the day rolls over: give before, collect after

[expect]
map = "MAP_AZALEA_KURT_HOUSE"
flags = ["FLAG_GOT_APRICORN_BOX"]
flags_clear = ["FLAG_DAILY_KURT_MAKING_BALLS"]
save = ['sum(i["qty"] for i in s["bag"]["balls"] if i["item"] == 492) >= 2']  # 08's Fast Ball plus Kurt's

[expect.vars]
VAR_UNK_4080 = 4
VAR_UNK_413B = 1
