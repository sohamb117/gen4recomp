# Proves Kurt's Apricorn balls: Azalea's apricorn tree picked into the Apricorn Box (a WHT Apricorn), the Apricorn
# handed to Kurt through the box app (FLAG_DAILY_KURT_MAKING_BALLS, the granddaughter's phone-number scene), the RTC
# day rolling past midnight (daily flags cleared), and Kurt's Fast Ball the next day.
# Start: 08's end MAP_AZALEA_KURT_HOUSE (4,5) -> end: MAP_AZALEA_KURT_HOUSE by Kurt, a second Fast Ball in the bag,
# VAR_UNK_413B 1, FLAG_DAILY_KURT_MAKING_BALLS clear.
title = "Apricorns: Azalea tree, Kurt, the ball the next day"
priority = "P1"
version = "both"
estimate = 22733
refs = [
  "zone_event 071_T23 object 10 obj_T23_bonguri (396,453) std_apricorn_tree, param0 30; src/apricorn_tree_sys.c:8-39 (tree 30 = Azalea Town, APRICORN_WHT)",
  "zone_event 071_T23 warp 6 (399,454) -> MAP_AZALEA_KURT_HOUSE; zone_event 158_T23R0501 warp (4,9) -> MAP_AZALEA",
  "scr_seq_0150.s (std_apricorn_tree 2800, src/script_manager.c:61: HasItem ITEM_APRICORN_BOX, AnimApricornTree, GiveApricornFromTree) - the box came in 02 (scr_seq_0227_R30.s:106, FLAG_GOT_APRICORN_BOX)",
  "zone_event 158_T23R0501 object 0 obj_T23R0501_gantetsu (4,4) hidden by FLAG_UNK_19E -> 001",
  "scr_seq_0874_T23R0501.s:26-40 (005, played in 08: VAR_UNK_4080 3, item 492 = ITEM_FAST_BALL x1, FLAG_UNK_07C)",
  "scr_seq_0874_T23R0501.s:93-128 (001 with FLAG_UNK_07C -> _011A: ScrCmd_735 Kurt's apricorn 0, GetTotalApricornCount > 0 -> ScrCmd_739 the Apricorn Box app (mode 2, src/field/scrcmd_pokemon_misc.c:870-875) :109; one given -> SetFlag FLAG_DAILY_KURT_MAKING_BALLS :120)",
  "scr_seq_0874_T23R0501.s:173-207 (first time, VAR_UNK_4080 3: VAR_UNK_4080 4, the granddaughter's YES/NO, RegisterGearNumber PHONE_CONTACT_KURT :195)",
  "scr_seq_0874_T23R0501.s:130-167 (next talk: FLAG_DAILY_KURT_MAKING_BALLS set -> 'not ready' :154-156; clear -> ScrCmd_737 ball id, std_give_item_verbose :134-137, ClearKurtApricorn :138, VAR_UNK_413B +1 :139-143)",
  "src/unk_02055418.c:41-52 (a new RTC day -> sub_02055508 -> ClearDailyFlags :78, apricorn trees regrow :89-90 unless a penalty); src/field/fieldmap.c:416-419 (checked every field frame with no task running)",
  "src/sav_system_info.c:91-112 (the RTC penalty only after continuing on another console; a forward clock adds none)",
  "include/constants/flags.h:128 FLAG_GOT_APRICORN_BOX, :143 FLAG_UNK_07C, :2032 FLAG_DAILY_KURT_MAKING_BALLS; include/constants/vars.h:143 VAR_UNK_4080, :330 VAR_UNK_413B",
  "include/constants/items.h:911 ITEM_WHT_APRICORN 490, :913 ITEM_FAST_BALL 492",
  "asm/overlay_58.s:7-124 (the Apricorn Box app: runs a child overlay, undecompiled)",
]
notes = "RTC: the ball needs a new day (FLAG_DAILY_KURT_MAKING_BALLS is a daily flag). The port's clock advances one second per 60 frames from the epoch (games/platinum/pc/src/pc_rtc.c:1-30), so a whole day cannot pass in a run: [run] clock boots at 23:55 on the chain's own day (2009-03-22, the default epoch; 08's save last saw 10:xx that day, so this is forward: no reset, no penalty), the apricorn is picked and given before midnight (~50 s of play), then the player waits in the house past 00:00 (frame ~18000 from boot; the field's per-frame RTC check rolls the day) and talks to Kurt again. The granddaughter's phone YES/NO follows the first gift. Gates: Kurt home and FLAG_UNK_07C set (08); the box (02). Bots proven on HG/SS: walk_to, talk_to, advance_text; new: a wait_frames step to pass midnight (exists: wait_frames), and the apricorn-box choice (press A/arrows, unproven). Outline: walk_to (399,455) out, talk_to the tree (A, YES if asked), walk_to the door, talk_to Kurt (box app: A on the WHT apricorn, confirm), advance_text through the phone scene (YES), wait_frames to ~frame 18600, talk_to Kurt, advance_text. [INFERENCE] estimate 20000 (18000 of it the wait). Scouted (gap-fill): the Apricorn Box app (ScrCmd_739, overlay 58, undecompiled) takes the D-pad and A: the hand opens on the first slot (column 1, row 1); the Wht Apricorn is column 2, row 3 (RIGHT, DOWN x2); A 'Give how many?' 1, A (OK) 'Give 1 Wht Apricorn?' with the cursor on NO, UP to YES, A. A touch on the apricorn did nothing. Measured: HeartGold 22732 frames, SoulSilver 22733; Fast Ball x2 in both end saves."

[start]
from = "08-slowpoke-well-proton-kurt"

[run]
frames = 34100
clock = "2009-03-22 23:55:00"   # 5 game minutes (18000 frames) before the day rolls over: give before, collect after

[[step]]
do = "walk_to"
x = 4
z = 9
note = "out of Kurt's house (warp (4,9))"

[[step]]
do = "walk_to"
x = 396
z = 454
face = "up"
interact = true
note = "below Azalea's apricorn tree (396,453): 'It's an Apricorn Tree!'"

[[step]]
do = "advance_text"
shot = "apricorn"
note = "'...It's a Wht Apricorn!' 'Ross obtained the Wht Apricorn!' 'put ... in the Apricorn Box!'"

[[step]]
do = "walk_to"
x = 399
z = 454
note = "Kurt's door (warp 6)"

[[step]]
do = "wait_map"
map = "MAP_AZALEA_KURT_HOUSE"

[[step]]
do = "talk_to"
id = 0
note = "Kurt (4,4): 'Fine! I'll turn them into Poke Balls.' then the Apricorn Box app (ScrCmd_739)"

[[step]]
do = "press"
keys = "a"
hold = 2
gap = 60
times = 7
note = "through Kurt's walk-up and text ('Fine! I'll turn them into Poke Balls.') into the box; an A that lands in the box hits its empty first slot and does nothing (scouted: nine such presses); three presses in the second run still left the text up"

[[step]]
do = "wait_frames"
n = 150
note = "the fade into the Apricorn Box app: 'Select which Apricorns to give.', the hand on the first slot (the first run's D-pad presses fell in the fade)"

[[step]]
do = "press"
keys = "right"
hold = 2
gap = 25
note = "the box's second column"

[[step]]
do = "press"
keys = "down"
hold = 2
gap = 25
times = 2
shot = "box"
note = "the Wht Apricorn (column 2, row 3): 'Wht Apricorn / A white Apricorn.'"

[[step]]
do = "press"
keys = "a"
hold = 2
gap = 40
note = "'Give how many?' 1"

[[step]]
do = "press"
keys = "a"
hold = 2
gap = 40
note = "OK: 'Give 1 Wht Apricorn?' YES/NO with the cursor on NO"

[[step]]
do = "press"
keys = "up"
hold = 2
gap = 20
note = "YES"

[[step]]
do = "press"
keys = "a"
hold = 2
gap = 60

[[step]]
do = "advance_text"
shot = "given"
note = "'Kurt: It'll take a day to make you a Poke Ball. Come back for it later.' (FLAG_DAILY_KURT_MAKING_BALLS)"

[[step]]
do = "dump"
expr = '(0xAA2 in s["flags"], [(i["item"], i["qty"]) for i in s["bag"]["balls"]])'
note = "FLAG_DAILY_KURT_MAKING_BALLS (0xAA2, include/constants/flags.h:2032) set before midnight; 08's one Fast Ball"

[[step]]
do = "wait_frames"
n = 19000
note = "past midnight (the run's clock started 23:55): the field's per-frame RTC check rolls the day and clears the daily flags (src/unk_02055418.c:41-52)"

[[step]]
do = "talk_to"
id = 0
note = "Kurt again: 'Ah, Ross!' and the Fast Ball"

[[step]]
do = "advance_text"
shot = "ball"

[expect]
map = "MAP_AZALEA_KURT_HOUSE"
flags = ["FLAG_GOT_APRICORN_BOX"]
flags_clear = ["FLAG_DAILY_KURT_MAKING_BALLS"]
log = ["dump: .* = \\(True, \\[\\(4, 5\\), \\(492, 1\\)\\]\\)"]
save = ['sum(i["qty"] for i in s["bag"]["balls"] if i["item"] == 492) >= 2']  # 08's Fast Ball plus Kurt's

[expect.vars]
VAR_UNK_4080 = 4
VAR_UNK_413B = 1
