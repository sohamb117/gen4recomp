# Trainers, Clair (TRAINER_LEADER_CLAIR_CLAIR) who withholds the badge and sends the player to the Dragon's Den
# (FLAG_UNK_0D1, the den guard steps aside).
# Start: MAP_BLACKTHORN (697,145) -> end: MAP_BLACKTHORN outside the gym (668,152), FLAG_UNK_0D1.
