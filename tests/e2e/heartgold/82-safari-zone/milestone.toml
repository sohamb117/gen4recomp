  'any(m["ball"]["id"] == 5 for m in s["party"])',  # a Safari Ball catch (ITEM_SAFARI_BALL 5)
  's["vars"]["16471"] >= 2',  # VAR_UNK_4057 (0x4057): 2 after Baoba's intro; a Baoba call during the run may move it on (4/7)
]
