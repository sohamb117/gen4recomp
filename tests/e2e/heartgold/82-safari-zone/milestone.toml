notes = "Gate: VAR_UNK_4057 1 from Baoba's call when Olivine's OnFrame runs after Jasmine leaves the Lighthouse (19); entering the gate building then plays Baoba's intro once (4057 2). The receptionist (4,4) takes 500 (money from the chain is ample [INFERENCE]) and refuses a full party with a full PC: 19's party is 5 (18's boost.recipe: CYNDAQUIL line, Togepi, SCYTHER, FLAAFFY, PELIPPER), so the catch joins the party. No RTC or badge gate besides that. Route: Fly to Cianwood (proven fly bot), Cliff Edge Gate north, Route 47 to Route 48 and the Safari Zone Gate [INFERENCE: Route 47 -> Route 48 runs through Cliff Cave and the overworld connection; whether Surf, Strength or Rock Smash is needed on the way is not traced - tools/hg_map.py and hg_world.py need the built map_matrix.naix]. Catch: walk_to laps in the entrance area's grass (encounters per safari area: src/safari_zone.c) until a wild battle; the safari menu's BALL sits in auto_battle's FIGHT slot (battle_input.c:1890-1893), as Platinum's 79-great-marsh-safari does - unproven on HG/SS. Leave: walk into the (79,100) warp, YES at the exit prompt. Bots proven on HG/SS: fly, walk_to, talk_to, advance_text, auto_battle; unproven here: auto_battle as the safari thrower (repeat until caught or the mon flees), field_move if a Rock Smash/Strength turns out to be on the path. [INFERENCE] estimate 18000: ~1500 fly, ~6000 Route 47/48, ~1500 Baoba, ~1500 entry, ~5000 grass and throws, ~1500 exit."

