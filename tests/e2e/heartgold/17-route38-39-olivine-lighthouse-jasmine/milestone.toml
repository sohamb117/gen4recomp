  "zone_event 074_T26 coord 0 (272,239) h5 VAR_UNK_4078 0 -> 001 (rival scene: ClearFlag/SetFlag FLAG_HIDE_OLIVINE_RIVAL, VAR_UNK_4078 1, scr_seq_0911_T26.s:74-165; no battle)",
