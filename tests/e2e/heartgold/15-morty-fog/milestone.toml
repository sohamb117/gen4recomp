# Proves the Ecruteak Gym: the invisible-floor maze (coord events that warp a misstep back to the entrance), the
# Mediums, Morty (TRAINER_LEADER_MORTY_MORTY), the Fog Badge + TM30.
# Start: MAP_ECRUTEAK (376,150) -> end: MAP_ECRUTEAK outside the gym (376,184), badge Fog.
