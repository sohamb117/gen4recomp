# Path (HM07 Waterfall item ball on 1F, the Kimono Girl, the B1F boulder holes, the ice slides) into Blackthorn City.
# Start: MAP_GOLDENROD_RADIO_TOWER_OBSERVATION_DECK -> end: MAP_BLACKTHORN outside the Ice Path (697,145), HM07.
