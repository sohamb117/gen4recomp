x = 8
z = 12
note = "observation deck -> elevator (warp 0)"

[[step]]
do = "wait_map"
map = "MAP_GOLDENROD_RADIO_TOWER_ELEVATOR"

[[step]]
do = "advance_text"

[[step]]
do = "walk_to"
x = 3
z = 6

[[step]]
do = "wait_map"
map = "MAP_GOLDENROD_RADIO_TOWER_5F"

[[step]]
do = "walk_to"
x = 633
z = 169
surf = true
note = "down the tower and across Johto to Route 44's Ice Path mouth (warp 0) [INFERENCE: one walk_to per map in practice]"

[[step]]
do = "wait_map"
map = "MAP_ICE_PATH_1F"

# PHASE2: the Ice Path floors: B1F's boulders (Strength) into coords 0-3, then B2F/B3F slides (slide bot) and the
