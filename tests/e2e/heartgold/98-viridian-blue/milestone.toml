# Proves the Kanto gym Blue (Earth Badge).
# Start: 97-seafoam-blaine's end -> end: MAP_VIRIDIAN_GYM after the leader, BADGE_EARTH.
title = "Kanto gym: Blue (Earth Badge)"
priority = "P2"
version = "both"
estimate = 31425
refs = [
  "scr_seq_0815_T09.s:91-111 (Blue on Cinnabar: VAR_UNK_40FD 0 and VAR_UNK_4135 >= 7 -> unlocks the gym :163-166)",
  "scr_seq_0743_T02GYM0101.s:15-41 (OnTransition: before Red (VAR_UNK_40FD 0) Blue is always shown; the weekday hiding only after Red)",
  "scr_seq_0743_T02GYM0101.s:46-66 (CheckBadge BADGE_EARTH, TRAINER_LEADER_BLUE_BLUE :51, GiveBadge BADGE_EARTH, FLAG_UNK_998/97F, VAR_UNK_4096 1 :66)",
  "TRAINER_LEADER_BLUE_BLUE (261, include/constants/trainers.h:266)",
  "scr_seq_0514_T02_hdr.s:14 + scr_seq_0741_T02.s:49-52 (back in Viridian: OnFrame VAR_UNK_4096 1 -> Oak's phone call, VAR_UNK_4096 2) - feeds 99",
]
notes = "Gate: the 7 other Kanto badges (VAR_UNK_4135) and Blue's Cinnabar talk (97: the Viridian Gym's old man flags swapped). Scouted on HeartGold (core-proposal): Fly to Viridian, heal (the scouting run met Blue unhealed after 97 and lost in 20 turns), the gym door (1045,239) -> (5,47). The gym's floor is arrows (TILE_BEHAVIOR_SLIDE_* 0x40..0x43) over a shiny floor (0x2D) with stop tiles (0x4D): a plain step onto the shiny floor stops there, but a slide begun on an arrow carries on across it until a stop tile or a wall. A BFS over those rules (tools/hg_map.py's tiles) gives the 25 presses below; bots.py slide plays them (each press waits for the slide to settle, a press that only turned the player is repeated). Stepping onto row 46 starts the guide's coord talk. The route meets none of the gym's trainers. Blue (object 5, (5,4)): A from (5,5). Earth Badge: Kanto badge 7. Measured: HG 31425 frames, SS 30433; the sheets show Cinnabar (start), Blue's dais with the player below him, the same after the badge, his Exeggutor lv55 against Typhlosion."

[start]
from = "97-seafoam-blaine"

[run]
frames = 47200

[[step]]
do = "fly"
map = "MAP_VIRIDIAN"

[[step]]
do = "heal"
x = 1032
z = 262
note = "Viridian's Pokemon Center"

[[step]]
do = "walk_to"
x = 1045
z = 240

[[step]]
do = "walk_to"
x = 1045
z = 239
note = "the gym door -> (5,47)"

[[step]]
do = "wait_map"
map = "MAP_VIRIDIAN_GYM"

[[step]]
do = "press"
keys = "UP"
hold = 8
gap = 30
note = "onto row 46: the guide's coord talk"

[[step]]
do = "advance_text"

[[step]]
do = "slide"
dirs = "UP UP UP UP RIGHT UP RIGHT RIGHT RIGHT UP UP LEFT LEFT UP UP UP RIGHT RIGHT RIGHT RIGHT RIGHT UP UP UP UP"
max = 12000
note = "(5,46) -> (5,5) below Blue: the arrows' stops (5,42) (6,41) (9,40) (7,35) (3,31) (7,29) (5,25) (7,21) (5,9)"
shot = "below-blue"

[[step]]
do = "press"
keys = "A"
gap = 30
note = "Blue (5,4)"

[[step]]
do = "advance_text"

[[step]]
do = "auto_battle"
snap = true
note = "TRAINER_LEADER_BLUE_BLUE"

[[step]]
do = "advance_text"
note = "the Earth Badge"
shot = "after-badge"

[expect]
map = "MAP_VIRIDIAN_GYM"
battles = 1
save = ['s["trainer"]["kanto_badge_mask"] >> 7 & 1']
