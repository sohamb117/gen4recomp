# HeartGold only: proves Kyogre at the Embedded Tower. NOTE: HG gets the Blue Orb and Kyogre, SS the Red Orb and Groudon
# (scr_seq_0229_R30R0201.s version branch; scr_seq_0133_D52R0101.s hides Groudon in HG). No distribution event: the chain
# is Red -> Oak's Kanto starter -> Mr. Pokemon's orb -> Cliff Edge Gate -> Route 47's Embedded Tower.
# Start: 99-mt-silver-red's end -> end: MAP_EMBEDDED_TOWER_KYOGRE_ROOM (16,12), FLAG_CAUGHT_KYOGRE, VAR_SCENE_EMBEDDED_TOWER 4.
title = "HeartGold: Blue Orb and Kyogre"
priority = "P2"
version = "heartgold"
estimate = 34296
refs = [
  "scr_seq_0107_D41R0108.s:28-29,50 (beating Red: VAR_UNK_4131 1, Oak's Kanto starter balls shown)",
  "scr_seq_0513_T01R0301_hdr.s:14 (Oak's lab OnFrame VAR_UNK_4131 1 -> 006); scr_seq_0740_T01R0301.s:505-526 (a Kanto starter chosen -> Call _0801), :601-673 (... VAR_SCENE_EMBEDDED_TOWER 1)",
  "include/constants/vars.h:264 VAR_SCENE_EMBEDDED_TOWER (0x40F9)",
  "scr_seq_0229_R30R0201.s:14-21 (VAR_SCENE_EMBEDDED_TOWER 1: Mr. Pokemon moved), :165-205 (MAP_ROUTE_30_MR_POKEMON_HOUSE scene with Oak: VAR_SCENE_EMBEDDED_TOWER 2; GetGameVersion 7 (HG) -> item 535 ITEM_BLUE_ORB, else 534 ITEM_RED_ORB (include/constants/items.h:955-956))",
  "scr_seq_0121_D48R0101.s:60-93 (MAP_CLIFF_EDGE_GATE: Chuck's scene, FLAG_HIDE_CLIFFS_EDGE_GATE_CHUCK, VAR_SCENE_EMBEDDED_TOWER 3)",
  "scr_seq_0134_D52R0102.s:13-45 (MAP_EMBEDDED_TOWER_KYOGRE_ROOM OnTransition: VAR_SCENE_EMBEDDED_TOWER >= 4 -> done; HG -> FLAG_BEAT_OR_ESCAPED_FROM_GROUDON_OR_KYOGRE unset and HasItem ITEM_BLUE_ORB -> ClearFlag FLAG_HIDE_EMBEDDED_TOWER_KYOGRE; SS -> hidden)",
  "zone_event 477_D52R0102 object 0 obj_D52R0102_tsure_poke_static_kyogre (16,11) -> 000; warp 0 (16,29) <- MAP_ROUTE_47 5",
  "scr_seq_0134_D52R0102.s:65-89 (WildBattle SPECIES_KYOGRE 50; fled/beaten -> FLAG_BEAT_OR_ESCAPED_FROM_GROUDON_OR_KYOGRE; caught -> VAR_SCENE_EMBEDDED_TOWER 4, FLAG_CAUGHT_KYOGRE include/constants/flags.h:397)",
  "scr_seq_0825_T10R0701.s:170 (_023A: Hall of Fame re-arms uncaught Kyogre)",
]
notes = "Gates: Red (99: VAR_UNK_4131 1), then Oak's lab, Mr. Pokemon's house, the Cliff Edge Gate, Route 47. Scouted on HeartGold (core-proposal). 99's save continues in the player's room. Oak's Kanto starter needs a free party slot (_0801 refuses at 6), so TOGEPI goes to BOX 1 first by 77's BILL'S PC presses (Cherrygrove). Oak's lab OnFrame offers the starters; CHARMANDER's ball (7,3) from (7,4): A for YES, B through the messages and 'Give a nickname?' (VAR_SCENE_EMBEDDED_TOWER 1). Mr. Pokemon's house OnFrame scene gives the orb (2); Chuck's scene in the Cliff Edge Gate plays on the walk through (3). Route 47's cliff paths west of Cliff Cave drop into pockets (a first walk_to west was stranded on one and had to Fly out), so the way is Cliff Cave: warp 1 in, the ladder (8,5), out at (26,13) onto the beach (131,392), Surf west to (89,396), Rock Climb up to the tower (87,389), whose door leads to the version's room. The catch is the Master Ball the chain never threw (Elm's, 29), as in 100: BAG, POKE BALLS, the Master Ball, USE; the party is full again (CHARMANDER), so the legendary goes to BOX 1. Rayquaza needs both orbs' legendaries: one is the other version's (a trade). Measured: 34296 frames; the sheet shows the deposit, CHARMANDER's prompt, Mr. Pokemon's house after the Blue Orb, KYOGRE lv50, 'Gotcha! KYOGRE was caught!', the empty room."

