# Proves the champion room frame script, the single battle vs Cynthia and the auto-warp to the HoF hallway.
# Start: Lucian room after the win (54's end) -> lift -> champion room (8,18) -> end: hallway to the Hall of Fame (186) at (5,23).

title = "Champion Cynthia"
priority = "P0"
estimate = 10977
refs = [
  "scripts_pokemon_league_champion_room.s:14-48",
  "scripts_pokemon_league_champion_room.s:48",
  "champion_cynthia.json:15",
  "scripts_pokemon_league_champion_room.s:21",
  "scripts_pokemon_league_champion_room.s:27",
  "scripts_pokemon_league_champion_room.s:41",
  "scripts_pokemon_league_champion_room.s:42",
  "scripts_pokemon_league_champion_room.s:78-79",
]

[start]
from = "prev"
lab = "lab.recipe"

[run]
frames = 16500

[[step]]
do = "walk_to"
x = 8
z = 2
note = "exit to POKEMON_LEAGUE_ELEVATOR_TO_CHAMPION_ROOM (events_pokemon_league_lucian_room warp 0, the exit door removed after the win)"

[[step]]
do = "wait_map"
map = "MAP_HEADER_POKEMON_LEAGUE_ELEVATOR_TO_CHAMPION_ROOM"

[[step]]
do = "walk_to"
x = 4
z = 19
note = "the platform lift's coord (4,19) (scripts_pokemon_league_elevator_to_champion_room.s CoordEvent_PlatformLift: TriggerPlatformLift)"

[[step]]
do = "wait_field"

[[step]]
do = "walk_to"
x = 4
z = 2
note = "lift top, warp 0 (4,2) -> POKEMON_LEAGUE_CHAMPION_ROOM"

[[step]]
do = "wait_map"
map = "MAP_HEADER_POKEMON_LEAGUE_CHAMPION_ROOM"

[[step]]
do = "advance_text"
shot = "champion_cynthia_battle"
note = "frame table: walk 4 north, intro, battle (scripts_pokemon_league_champion_room.s:14-48)"

[[step]]
do = "auto_battle"
send = "best"
shot = "champion_cynthia"
note = "TRAINER_CHAMPION_CYNTHIA (267), single (champion_cynthia.json:15)"

[[step]]
do = "advance_text"
max = 8000
map = "MAP_HEADER_POKEMON_LEAGUE_HALLWAY_TO_HALL_OF_FAME"
note = "Cynthia's words after the battle and the walk out; stops as the hallway loads: its OnFrame (Cynthia, Rowan, the walk into the Hall of Fame) is 56's. The end quick save lands in the field's two free frames before that OnFrame locks it (pc_np_field.c pc_np_frame), so 56 continues into it"

[expect]
map = "MAP_HEADER_POKEMON_LEAGUE_HALLWAY_TO_HALL_OF_FAME"
# the save is made at (5,23); the live probe after it has the OnFrame's walk-in under way, so the save is checked
save = ["(s['location']['x'], s['location']['z']) == (5, 23)"]
flags = ["FLAG_DEFEATED_CYNTHIA"]
battles = 1
