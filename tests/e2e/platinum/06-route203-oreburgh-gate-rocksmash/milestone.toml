[[step]]
do = "wait_map"
map = "MAP_HEADER_OREBURGH_CITY"

[[step]]
do = "walk_to"
x = 266
move = 3
z = 749
note = "coord (266,748..751) VAR_OREBURGH_CITY_STATE==0 -> the youngster walks you to the gym -> 1 (scripts_oreburgh_city.s:388)"

[[step]]
do = "advance_text"
shot = "oreburgh-gym-tour"

[expect]
map = "MAP_HEADER_OREBURGH_CITY"
flags = ["FLAG_RECEIVED_HM06", "FLAG_FIRST_ARRIVAL_OREBURGH_GATE", "FLAG_HIDE_ROUTE_203_RIVAL"]
battles = 1
save = [
  'any(i["item"] == 425 and i["qty"] >= 1 for k, p in s["bag"].items() if k != "registered" for i in p)',  # ITEM_HM06
]

[expect.vars]
VAR_ROUTE_203_RIVAL_STATE = 1
VAR_OREBURGH_CITY_STATE = 1
VAR_OREBURGH_GATE_1F_HIKER_STATE = 2
