# Proves the platform lift up to the Bertha room, its enter-room frame script, the single battle and the exit door.
# Start: Aaron room after the win (51's end) -> lift -> end: Bertha room after the win, FLAG_DEFEATED_BERTHA.

title = "Elite Four: Bertha"
status = "planned"
priority = "P0"
estimate = 12000
refs = [
  "scripts_pokemon_league_bertha_room.s:61-69",
  "scripts_pokemon_league_bertha_room.s:66",
  "scripts_pokemon_league_bertha_room.s:22",
]

[start]
from = "prev"
lab = "lab.recipe"

[run]
frames = 18000

[[step]]
do = "walk_to"
x = 8
z = 2
note = "exit to POKEMON_LEAGUE_ELEVATOR_TO_BERTHA_ROOM (events_pokemon_league_aaron_room warp 0, the exit door removed after the win)"

[[step]]
do = "wait_map"
map = "MAP_HEADER_POKEMON_LEAGUE_ELEVATOR_TO_BERTHA_ROOM"

[[step]]
do = "walk_to"
x = 4
z = 11
note = "the platform lift's coord (4,11) (scripts_pokemon_league_elevator_to_bertha_room.s CoordEvent_PlatformLift: TriggerPlatformLift)"

[[step]]
do = "wait_field"

[[step]]
do = "walk_to"
x = 4
z = 2
note = "lift top, warp 0 (4,2) -> POKEMON_LEAGUE_BERTHA_ROOM"

[[step]]
do = "wait_map"
map = "MAP_HEADER_POKEMON_LEAGUE_BERTHA_ROOM"

[[step]]
do = "wait_field"
note = "frame table walks the player 2 north and closes the entrance door (scripts_pokemon_league_bertha_room.s:61-69)"

[[step]]
do = "walk_to"
x = 8
z = 6
face = "up"
interact = true
note = "Bertha at (8,5)"

[[step]]
do = "advance_text"

[[step]]
do = "auto_battle"
send = "best"
shot = "e4_bertha"
note = "TRAINER_ELITE_FOUR_BERTHA (262): WHISCASH 50, GLISCOR 53, HIPPOWDON 52, GOLEM 52, RHYPERIOR 55"

[[step]]
do = "advance_text"

[expect]
map = "MAP_HEADER_POKEMON_LEAGUE_BERTHA_ROOM"
