# Level-up evolution at the end of a battle: CATERPIE lv6 fights wild Pokemon in Route 202's tall grass
# (Dragon Rage, 40 fixed, one-shots every lv2-4 there) until it reaches lv7, and evolves into METAPOD after
# the battle that levels it (battle_main.c:274-297; evolution allowed, never B).
# Start: Route 202 (188,812) beside the grass. End: Route 202, slot 0 METAPOD lv7.
title = "Level-up evolution after battle: Caterpie -> Metapod"
priority = "P1"
estimate = 10408
refs = [
  "src/battle/battle_main.c:274-297",
  "res/field/encounters/encounters_route_202.json",
  "tests/e2e/tools/probe_map.py (Route 202 grass x 181..191, z 811..817)",
]

[start]
recipe = "start.recipe"

[run]
frames = 15700

[[step]]
do = "grind"
x = 188
z = 813
level = 7
note = "wild battles in the grass (188,813)/(189,813) until the lead is lv7; the last one ends in the evolution scene"

[[step]]
do = "wait_field"
shot = "evolved"

[expect]
map = "MAP_HEADER_ROUTE_202"
battles = 1
party = ["SPECIES_METAPOD"]
save = ['s["party"][0]["species"] == 11', 's["party"][0]["level"] >= 7', '10 in s["pokedex"]["caught_list"] or 11 in s["pokedex"]["seen_list"]']

[[shots]]
frames = [8140, 9000, 9500, 9900, 10300]
