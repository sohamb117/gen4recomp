# Battle Factory single set with rentals: Single -> pick 3 rentals -> 7 battles with swap prompts.
# Start: BATTLE_FACTORY (21,7) below the single attendant (21,6). End: Factory lobby.
# Lab party is irrelevant (rentals) but the post-98 recipe is reused.
title = "Battle Factory: first single set"
status = "planned"
priority = "P2"
estimate = 45000
refs = [
  "res/field/scripts/scripts_battle_frontier.s",
  "res/field/scripts/scripts_battle_factory.s:59-67",
  "res/field/events/events_battle_frontier.json",
  "res/field/scripts/scripts_battle_frontier_gate_to_fight_area.s:20-40",
  "res/field/scripts/scripts_init_battle_frontier_gate_to_fight_area.s",
  "src/unk_02049D08.c:161-206",
  "src/unk_02049D08.c:750-787",
  "src/unk_020494DC.c:72-78",
  "src/wifi_battle_tower_save.c:156-176",
  "src/overlay104/frscrcmd.c:1567-1580",
  "pc/src/pc_lab.c:798-800",
  "src/clear_game.c:204-206",
  "src/scrcmd_system_flags.c:151",
  "src/system_flags.c:69-71",
]

[start]
recipe = "start.recipe"

[run]
frames = 67500

[[step]]
do = "press"
keys = "A"
note = "single attendant (21,6) -> BattleFactory_TryTakeSingleChallenge (no party check)"
shot = "attendant"

[[step]]
do = "wait_frames"
n = 120
# PHASE2 (measured with tools/pt_poke.py on start.sav): A at 40-frame gaps goes 'Welcome', 'designed for a single
# Trainer', SINGLE BATTLE, LEVEL 50, save YES, overwrite YES, 'saved', 'Right this way', the walk to the rental
# room (~f2440), 'I've done a bit of research...', 'we will hold your Pokemon...', then the rental screen
# (~f2750): six balls in a row, 'Please choose Pokemon no. 1.'; A on a ball opens SUMMARY / RENT / CANCEL with
# the cursor on SUMMARY, so blind A opens the summary page. Next: per pick DOWN, A (RENT), RIGHT to the next
# ball, three times, then the confirm prompt; swap prompts after each win (NO keeps the team).

[expect]
map = 562
battles = 7
# PHASE2: reader-ext Battle Points (WifiBattleTowerRecord_UpdateBattlePoints, wifi_battle_tower_save.c:156-176)
# == 3 after the first solo set (unk_02049D08.c:750-787) or > 0; np_save4 has no BP field. Meanwhile
# the in-run Common_SaveGame saves advance the save counter.
