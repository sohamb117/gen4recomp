# Battle Arcade single set: GARCHOMP, METAGROSS, SALAMENCE (Lv 50 in the Arcade). Before each battle the game board
# spins; its STOP button is touch only (the circle at (128,96), r 32: battle_arcade/main.c sStopButtonHitBox) and it
# stops by itself after 900 ticks. Start: BATTLE_ARCADE (14,6) below the single attendant (14,5). End: Arcade lobby.
title = "Battle Arcade: first single set"
priority = "P2"
estimate = 48993
refs = [
  "res/field/events/events_battle_frontier.json",
  "res/field/scripts/scripts_battle_frontier_gate_to_fight_area.s:20-40",
  "res/field/scripts/scripts_init_battle_frontier_gate_to_fight_area.s",
  "src/unk_02049D08.c:161-206",
  "src/unk_02049D08.c:750-787",
  "src/unk_020494DC.c:72-78",
  "src/wifi_battle_tower_save.c:156-176",
  "src/overlay104/frscrcmd.c:1567-1580",
  "pc/src/pc_lab.c:798-800",
  "src/clear_game.c:204-206",
  "src/scrcmd_system_flags.c:151",
  "src/system_flags.c:69-71",
]

[start]
recipe = "start.recipe"

[run]
frames = 80000

[[step]]
do = "press"
keys = "A"
gap = 40
times = 5
note = "the single attendant (14,5): the welcome, SINGLE BATTLE, 'Please select the Pokemon you wish to enter.' -> the party select"
shot = "attendant"

[[step]]
do = "wait_frames"
n = 120

[[step]]
do = "press"
keys = "A"
gap = 30
times = 2
note = "GARCHOMP (slot 0): A, ENTER -> FIRST"

[[step]]
do = "press"
keys = "RIGHT"
gap = 20

[[step]]
do = "press"
keys = "A"
gap = 30
times = 2
note = "METAGROSS (slot 1): ENTER -> SECOND"

[[step]]
do = "press"
keys = "DOWN"
gap = 20

[[step]]
do = "press"
keys = "LEFT"
gap = 20

[[step]]
do = "press"
keys = "A"
gap = 30
times = 2
note = "SALAMENCE (slot 2): ENTER -> THIRD; the cursor jumps to CONFIRM"
shot = "three-entered"

[[step]]
do = "press"
keys = "A"
gap = 60
note = "CONFIRM -> 'Would you like to save the game?'"

[[step]]
do = "press"
keys = "A"
gap = 50
times = 7
note = "save YES, overwrite YES, 'saved', 'Right this way, please!', the walk to the game room"

[[step]]
