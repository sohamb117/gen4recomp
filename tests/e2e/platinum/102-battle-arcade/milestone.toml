x = 128
y = 96
gap = 26
times = 12
note = "STOP once the board spins (taps before that do nothing); the cursor lands on the event"
shot = "board-1"

[[step]]
do = "advance_text"
max = 3000
note = "'This is our current event!', the event, 'OK! Let the battle commence!'; stops at the battle"

[[step]]
do = "wait_battle"
max = 3000

[[step]]
