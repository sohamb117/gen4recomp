max = 4000
note = "'Right this way', the walk to the hall, 'Please choose the type of Pokemon you will battle.', the type board (the cursor on NORMAL): A, 'Will you battle the NORMAL-type, Rank 1 Pokemon?' YES; stops at the battle"

[[step]]
do = "wait_battle"
max = 3000

[[step]]
do = "auto_battle"
