# Battle Hall single set: one mon (GARCHOMP), ten battles (HALL_BATTLES_PER_ROUND), a different type panel each
# battle so every opponent is Rank 1 (Lv 70; NORMAL nine times climbs to a Lv 86 STARAPTOR that wins). Start: BATTLE_HALL (7,9) facing the single attendant (6,9). End: Hall lobby.
title = "Battle Hall: first single set"
priority = "P2"
estimate = 40000
refs = [
  "res/field/scripts/scripts_battle_frontier.s",
  "src/scrcmd_battle_hall.c:510-514",
  "res/field/events/events_battle_frontier.json",
  "res/field/scripts/scripts_battle_frontier_gate_to_fight_area.s:20-40",
  "res/field/scripts/scripts_init_battle_frontier_gate_to_fight_area.s",
  "src/unk_02049D08.c:161-206",
  "src/unk_02049D08.c:750-787",
  "src/unk_020494DC.c:72-78",
  "src/wifi_battle_tower_save.c:156-176",
  "src/overlay104/frscrcmd.c:1567-1580",
  "pc/src/pc_lab.c:798-800",
  "src/clear_game.c:204-206",
  "src/scrcmd_system_flags.c:151",
  "src/system_flags.c:69-71",
]

[start]
recipe = "start.recipe"

[run]
frames = 90000

[[step]]
do = "press"
keys = "A"
gap = 40
times = 4
note = "the single attendant (6,9): 'Welcome to the Battle Hall!', 'designed for a single Trainer', SINGLE BATTLE (the first entry), 'Please choose the Pokemon you wish to enter.'"
shot = "attendant"

[[step]]
do = "press"
keys = "A"
gap = 40
times = 3
note = "the party select: GARCHOMP (slot 0) A, ENTER -> FIRST; the cursor jumps to CONFIRM"
shot = "select"

[[step]]
