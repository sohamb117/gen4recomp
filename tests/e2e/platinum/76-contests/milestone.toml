# Super Contest, Normal rank Cool, via the lab contest hook (skips the lobby menus, which never
# finish their map change headless). ROSELIA with every condition at 255 takes first place.
# Start: Hearthome City (0x1D1,0x2BA). End: Hearthome after the contest, Super Cool ribbon on slot 0.
title = "Contests: Normal Cool, first place"
status = "planned"
priority = "P1"
estimate = 52000
refs = [
  "res/field/events/events_hearthome_city.json",
  "res/field/scripts/scripts_contests.s:178-470",
  "res/field/scripts/scripts_contest_hall_lobby.s:38",
  "res/field/scripts/scripts_contest_hall_lobby.s:85",
  "generated/pokemon_contest_ranks.txt",
  "generated/pokemon_contest_types.txt",
  "src/applications/party_menu/main.c:1128-1153",
  "src/contest.c:90-121",
  "src/contest.c:214-253",
  "src/contest.c:1536-1582",
  "generated/vars_flags.txt:2415-2419",
  "pc/src/pc_lab.c:902-911",
  "pc/src/pc_lab.c:1829-1956",
  "pc/src/pc_lab.c:1855-1913",
  "pc/src/pc_lab.c:1908",
  "pc/tests/corpus/contest-win.recipe",
  "pc/tests/corpus/contest-win.spec",
  "pc/tests/corpus/contest-cool.recipe",
  "pc/tests/corpus/contest-master.recipe",
  "pc/replays/lab-contest.txt",
  "pc/tests/pc_corpus.py:346",
]

[start]
recipe = "start.recipe"

[run]
frames = 78000
# lab contest hook: NORMAL rank, COOL, slot 0; skips the lobby menus (pc_lab.c:1829-1956)
env = { PC_LAB_CONTEST = "0 0 0", PC_LAB_CONTEST_AT = "2600" }
clock = "2009-03-22 21:00:00"

[[step]]
do = "wait_frames"
n = 2400
note = "the contest hook fires at PC_LAB_CONTEST_AT; dress-up and dance rounds run on timers"
shot = "contest-start"
# PHASE2: port pc/replays/lab-contest.txt frames 5000-44690 to contest.press (schedule step): each
# acting turn is a direction key walking the 2x2 move grid (RIGHT, DOWN, LEFT, UP) then A (move)
# then A (judge); A alone picks EXIT on the judge screen and loops forever (replay header).
# The replay's frames are absolute from boot; rebase them on this step's start.

[expect]
map = 86
log = ['pc_lab: contest over at frame \d+, placement=0']
# PHASE2: reader-ext ribbon 0.MON_DATA_SUPER_COOL_RIBBON=1 (pc_save `ribbon`, pc_corpus.py:346); np_save4 does not dump ribbons
