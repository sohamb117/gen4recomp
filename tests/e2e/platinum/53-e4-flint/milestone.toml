# Proves the platform lift up to the Flint room, its enter-room frame script, the single battle and the exit door.
# Start: Bertha room after the win (52's end) -> lift -> end: Flint room after the win, FLAG_DEFEATED_FLINT.

title = "Elite Four: Flint"
status = "planned"
priority = "P0"
estimate = 12000
refs = [
  "scripts_pokemon_league_flint_room.s:106",
  "scripts_pokemon_league_flint_room.s:23",
  "scripts_pokemon_league_flint_room.s:16-17",
  "scripts_pokemon_league_flint_room.s:28-29",
  "scripts_pokemon_league_flint_room.s:61-69",
]

[start]
from = "prev"
lab = "lab.recipe"

[run]
frames = 18000

[[step]]
do = "walk_to"
x = 8
z = 2
note = "exit to POKEMON_LEAGUE_ELEVATOR_TO_FLINT_ROOM (events_pokemon_league_bertha_room warp 0, the exit door removed after the win)"

[[step]]
do = "wait_map"
map = "MAP_HEADER_POKEMON_LEAGUE_ELEVATOR_TO_FLINT_ROOM"

[[step]]
do = "walk_to"
x = 4
z = 11
note = "the platform lift's coord (4,11) (scripts_pokemon_league_elevator_to_flint_room.s CoordEvent_PlatformLift: TriggerPlatformLift)"

[[step]]
do = "wait_field"

[[step]]
do = "walk_to"
x = 4
z = 2
note = "lift top, warp 0 (4,2) -> POKEMON_LEAGUE_FLINT_ROOM"

[[step]]
do = "wait_map"
map = "MAP_HEADER_POKEMON_LEAGUE_FLINT_ROOM"

[[step]]
do = "wait_field"
note = "frame table walks the player 2 north and closes the entrance door (scripts_pokemon_league_flint_room.s:61-69)"

[[step]]
do = "walk_to"
x = 8
z = 6
face = "up"
interact = true
note = "Flint at (8,5)"

[[step]]
do = "advance_text"

[[step]]
do = "auto_battle"
send = "best"
shot = "e4_flint"
note = "TRAINER_ELITE_FOUR_FLINT (263): HOUNDOOM 52, FLAREON 55, RAPIDASH 53, INFERNAPE 55, MAGMORTAR 57"

[[step]]
do = "advance_text"

[expect]
map = "MAP_HEADER_POKEMON_LEAGUE_FLINT_ROOM"
flags = ["FLAG_DEFEATED_FLINT"]
battles = 1
