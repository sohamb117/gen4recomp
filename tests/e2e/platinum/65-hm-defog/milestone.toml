# HM05 Defog from the party menu on foggy Route 210 North.
# Start: ROUTE_210_NORTH (516,540), weather FOG. End: same map, FLAG_DEFOG_ACTIVE set, fog gone.
title = "HM05 Defog: clear Route 210 North fog"
priority = "P1"
estimate = 2051
refs = [
  "res/field/scripts/scripts_visible_items.s:923-927",
  "res/field/scripts/scripts_solaceon_ruins_room_2.s:15",
  "src/field_move_tasks.c:504",
  "src/field_move_tasks.c:285-288",
  "src/field_map_change.c:273-279",
  "include/data/map_headers.h:~8030",
  "res/field/scripts/scripts_field_moves.s:342",
  "res/field/scripts/scripts_field_moves.s:379-392",
  "res/field/scripts/scripts_field_moves.s:389",
  "src/system_flags.c:458-461",
  "generated/vars_flags.txt:2434",
  "pc/replays/lab-menu-party.txt",
  "generated/journal_location_events.txt:24",
]

[start]
recipe = "start.recipe"

[run]
frames = 3100
# pc-journal trace for the log expect (pc/src/pc_probe2d.c:262-267)
env = { PC_TRACE_JOURNAL = "1" }

[[step]]
do = "wait_field"
shot = "fog-before"

[[step]]
do = "field_move"
move = "MOVE_DEFOG"
note = "X, POKEMON, STARAPTOR, DEFOG (FieldMoves_UseDefogFromMenu, scripts_field_moves.s:379-392), text advanced"
shot = "fog-after"

[expect]
map = 363
badge = ["BADGE_ID_RELIC"]
flags = ["FLAG_DEFOG_ACTIVE"]
log = ['pc-journal: f=\d+ event=23 ']   # LOCATION_EVENT_USED_DEFOG
