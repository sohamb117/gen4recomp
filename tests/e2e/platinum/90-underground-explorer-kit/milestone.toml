# Underground Man gives the Explorer Kit and becomes mentor; walk out to Eterna, use the kit from the bag,
# enter the Underground for the first time (Roark's intro), and go back up.
# Start: ETERNA_CITY_UNDERGROUND_MAN_HOUSE door (warp 0). End: Eterna City (65), back from the Underground.
title = "Underground: Explorer Kit and first entry"
priority = "P1"
estimate = 3649
refs = [
  "res/field/events/events_eterna_city_underground_man_house.json",
  "res/field/events/events_eterna_city.json",
  "res/field/scripts/scripts_eterna_city_underground_man_house.s:17-35",
  "res/field/scripts/scripts_eterna_city_underground_man_house.s:170-185",
  "src/item_use_functions.c:365-367",
  "res/field/scripts/scripts_underground.s:173-188",
  "src/underground/comm_manager.c:68-85",
  "src/underground/comm_manager.c:236-276",
  "src/underground/manager.c:162",
  "src/system_flags.c:119-121",
  "src/underground/menus.c",
  "tests/gameplay/scenarios/7-underground.scn",
]

[start]
recipe = "start.recipe"

[run]
frames = 5500
clock = "2009-03-22 21:00:00"

[[step]]
do = "walk_to"
x = 6
z = 6
face = "up"
interact = true
note = "Underground Man at (6,5); stand (6,6)"

[[step]]
do = "advance_text"
max = 2000
note = "kit given (FLAG_RECEIVED_EXPLORER_KIT), then the mentor Yes/No; A takes the YES default"
shot = "kit"

[[step]]
do = "walk_to"
x = 4
z = 8
note = "door warp 0 -> Eterna City (house door is Eterna warp 11 at (310,530))"

[[step]]
do = "wait_map"
map = 65

[[step]]
do = "wait_field"

[[step]]
do = "press"
keys = "X"
note = "start menu, cursor on POKEMON (no Pokedex yet)"

[[step]]
do = "press"
keys = "DOWN"
note = "BAG"

[[step]]
do = "press"
keys = "A"
gap = 90
note = "the bag opens on ITEMS"

[[step]]
do = "press"
keys = "LEFT"
gap = 30
note = "wraps to KEY ITEMS; the cursor is on the Explorer Kit, the only key item"

[[step]]
do = "press"
keys = "A"
gap = 30
note = "USE / REGISTER / CANCEL"

[[step]]
do = "press"
keys = "A"
note = "USE"
shot = "use"

[[step]]
do = "advance_text"
max = 4000
note = "'DS Wireless Communications will be launched', save YES, overwrite YES, the hole, Roark's intro ('Hey! GQ!')"
shot = "underground"

[[step]]
do = "press"
keys = "X"
gap = 30
note = "the Underground menu: TRAPS, SPHERES, GOODS, TREASURES, GQ, GO UP, CLOSE"

[[step]]
do = "press"
keys = "DOWN"
times = 5
gap = 10
note = "GO UP"
shot = "go-up"

[[step]]
do = "press"
keys = "A"

[[step]]
do = "advance_text"
max = 2000
map = 65
note = "the return to Eterna"

[[step]]
do = "wait_field"
shot = "eterna"

[expect]
map = 65
flags = ["FLAG_RECEIVED_EXPLORER_KIT", "FLAG_ACCEPTED_UNDERGROUND_MAN_AS_MENTOR", "FLAG_ENTERED_UNDERGROUND", "FLAG_HAS_SEEN_UNDERGROUND_ROARK_INTRO"]
save = ['any(i["item"] == 428 for p in s["bag"].values() for i in p)']   # ITEM_EXPLORER_KIT
