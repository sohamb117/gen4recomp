# Super Rod: fish on Route 205: cast the registered Super Rod at the Route 205 South river, hook the bite, win the battle.
# Start: ROUTE_205_SOUTH (162,604) facing water. End: same tile after the wild battle.
# The hook press is frame-exact for this save + clock (bite window measured with PC_TRACE_FISH).
title = "Super Rod: fish on Route 205"
status = "planned"
priority = "P2"
estimate = 6800
refs = [
  "res/field/scripts/scripts_fight_area.s:418-438",
  "src/item_use_functions.c:819-851",
  "src/overlay006/wild_encounters.c:380-398",
  "src/overlay006/wild_encounters.c:1332-1333",
  "src/overlay005/fishing.c:252-256",
  "src/overlay005/fishing.c:261-268",
  "src/overlay005/fishing.c:574-578",
  "res/field/encounters/encounters_route_205_south.json",
  "res/field/encounters/encounters_fuego_ironworks_outside.json",
  "pc/tests/corpus/rod-super.recipe",
  "pc/tests/corpus/rod-super.spec",
  "pc/replays/lab-fish-super.txt",
  "pc/tests/pc_corpus.py:422-436",
]

[start]
recipe = "start.recipe"

[run]
frames = 10200
# pc-fish trace for the log expect (pc/src/pc_probe2d.c:305)
env = { PC_TRACE_FISH = "1" }
clock = "2009-03-22 21:00:00"

[[step]]
do = "press"
keys = "Y"
hold = 24
note = "the cast that bites"

[[step]]
do = "wait_frames"
n = 26
note = "replay lab-fish-super.txt bites on the first cast; 15-frame hook window, the tightest"
# PHASE2: the A below must land inside the bite window; the replay presses it at an absolute
# frame. Re-measure with PC_TRACE_FISH=1 relative to field_ready after the e2e boot and fix this wait.

[[step]]
do = "press"
keys = "A"
hold = 24
note = "hook"
shot = "hooked"

[[step]]
do = "wait_battle"
max = 1200

[[step]]
do = "auto_battle"
note = "GARCHOMP 70 Dragon Claw one-shots"
shot = "battle"

[[step]]
do = "advance_text"

[expect]
map = 347
position = [162, 604]
battles = 1
# wild species GYARADOS/LUMINEON/SHELLDER (super_rod_rate 75; Dragon Claw one-shot [INFERENCE]): dex seen grows by one (party GARCHOMP is the only prior entry)
save = ['s["pokedex"]["seen"] >= 2']
log = ['pc-fish: f=\d+ rod=\d+ bite', 'pc-fish: f=\d+ rod=\d+ caught']
