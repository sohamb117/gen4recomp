note = "Rafael (11,13) LOOK_SOUTH sight 4 spots (11,17) and walks to (11,16): fought. Column x=11 is the only way from the south half to the west half, so he now blocks it for good (as Darren at (16,14) blocks the ring's row 14 when he spots from (18,14)): leave and re-enter, which puts every gym trainer back on its event tile. Entering also resets the bags and stacks (OnTransition InitPersistedMapFeaturesForVeilstoneGym, scripts_veilstone_city_gym.s:15; src/persisted_map_features_init.c:113-120), so kick 1 is done again"

