# Egg hatch, played, with Flame Body: 72's BIDOOF egg (15 egg cycles) hatches while the player runs laps in
# Solaceon with MAGBY (Flame Body) in the party, which takes two cycles off per 255 steps instead of one
# (daycare.c Party_GetEggCyclesToSubtract, Daycare_Update): about 2040 steps instead of about 3825.
# Start: 72's end, Solaceon (555,649), egg in slot 2. End: Solaceon, BIDOOF hatched in slot 2.
title = "Egg hatch (and Flame Body cycle halving)"
priority = "P1"
estimate = 39347
refs = [
  "src/overlay005/daycare.c:556-560",
  "src/overlay005/daycare.c:672",
  "src/overlay005/daycare.c:715",
  "src/overlay005/daycare.c:779",
  "src/overlay005/daycare.c:783-800",
  "src/overlay005/daycare.c:885-916",
  "src/overlay005/daycare.c:948-952",
  "src/overlay005/daycare.c:953-975",
  "src/overlay005/field_control.c:827-836",
  "res/field/scripts/scripts_common.s:1429-1437",
  "res/pokemon/magby/data.json",
  "res/pokemon/bidoof/data.json (hatch_cycles 15)",
  "pc/src/pc_lab.c:848-901",
  "pc/tests/corpus/egg-hatch.recipe",
  "pc/tests/corpus/egg-hatch.spec",
  "pc/replays/lab-walk.txt",
  "pc/tests/pc_corpus.py:375",
]

[start]
from = "72-day-care-deposit-and-egg"
lab = "start.recipe"

[run]
frames = 59100

[[step]]
do = "hatch"
x = 557
z = 649
note = "running laps until the egg hatches (bots.py hatch: the scene's text with B, the nickname question NO)"
shot = "hatched"

[expect]
map = "MAP_HEADER_SOLACEON_TOWN"
party_size = 3
party = ["SPECIES_BIDOOF", "SPECIES_MAGBY"]
save = [
  '[m["species"] for m in s["party"]] == [400, 240, 399]',
  'not any(m["is_egg"] for m in s["party"])',
  's["party"][2]["level"] == 1',
]
# Flame Body: the hatch scene came 1786..2040 steps after the laps began (7 or 8 cycles of 255 after a partial
# one); without it 14..15 cycles, 3571..3825 steps. hatch counts lap attempts (a wandering NPC in the way costs
# one without a step), so fewer than 3000 attempts proves the halving (measured: 2294)
log = ['hatch: a scene of \d+ frames after (1[7-9]\d\d|2\d\d\d) steps; 0 egg\(s\) left']

[[shots]]
frames = [38500, 38800, 39100, 39300]   # the hatch scene (from frame 38405)
