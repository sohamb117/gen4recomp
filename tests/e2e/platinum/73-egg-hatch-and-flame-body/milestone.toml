# Egg hatch: an egg one step from hatching (egg cycles 0, shared counter 254) hatches into BIDOOF
# on the next step. Flame Body halving is the second recipe (flame-body.recipe, see PHASE2 below).
# Start: Solaceon spawn (566,657). End: (565,657) after one step, BIDOOF in slot 1.
title = "Egg hatch (and Flame Body cycle halving)"
status = "planned"
priority = "P1"
estimate = 9000
refs = [
  "src/overlay005/daycare.c:556-560",
  "src/overlay005/daycare.c:672",
  "src/overlay005/daycare.c:715",
  "src/overlay005/daycare.c:779",
  "src/overlay005/daycare.c:783-800",
  "src/overlay005/daycare.c:885-916",
  "src/overlay005/daycare.c:948-952",
  "src/overlay005/daycare.c:953-975",
  "src/overlay005/field_control.c:827-836",
  "res/field/scripts/scripts_common.s:1429-1437",
  "res/pokemon/magby/data.json",
  "pc/src/pc_lab.c:848-901",
  "pc/tests/corpus/egg-hatch.recipe",
  "pc/tests/corpus/egg-hatch.spec",
  "pc/replays/lab-walk.txt",
  "pc/tests/pc_corpus.py:375",
]

[start]
recipe = "start.recipe"

[run]
frames = 13500
clock = "2009-03-22 21:00:00"   # not one of the 12 special dates (cycle length 255, daycare.c:885-916)

[[step]]
do = "press"
keys = "LEFT"
hold = 48
note = "one step: counter 254 -> 255 = cycle boundary; egg at 0 cycles hatches (daycare.c:953-975)"

[[step]]
do = "wait_frames"
n = 300

[[step]]
do = "advance_text"
max = 3000
note = "CommonScript_HatchEgg cutscene needs A presses"
shot = "hatch"

[[step]]
do = "wait_field"

[expect]
map = 433
position = [565, 657]
party = ["SPECIES_BIDOOF"]
party_size = 2
save = ['s["party"][1]["is_egg"] == False', 's["party"][1]["species"] == 399']
# PHASE2: flame-body.recipe (Magby slot 0 + Piplup egg, egg-cycles 1 2, counter 254): one step
# then reader-ext friendship of slot 1 == 0 (with Magby) vs 1 (control without Magby)
# (pc_save `friendship: 1=0`, pc_corpus.py:375). np_save4 dumps party friendship, so
# s["party"][1]["friendship"] == 0 also works; needs a second run of this dir with that recipe.
