[[step]]
do = "moves"
max = 8000
dirs = [["U", "z14"], ["A", "U"]]
shot = "giratina"
note = "Giratina room: shadow/arrival coords (15,1,24..14), talk to Giratina (15,13) -> StartGiratinaOriginBattle SPECIES_GIRATINA 47, fought (a KO continues, scripts_distortion_world_giratina_room.s:61-85), Cyrus and Cynthia after"

[[step]]
