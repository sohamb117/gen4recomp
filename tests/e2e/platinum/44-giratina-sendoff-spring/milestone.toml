# north of the B7F one collides, :1952-1969); Giratina and later the portal at (15,13) (ov9 object table :13745-13830).

[[step]]
do = "moves"
max = 6000
dirs = [["W", 200], ["R", "x89"], ["U", "z57"], ["U", 1], ["W", 120]]
