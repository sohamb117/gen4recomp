[expect]
map = "MAP_HEADER_FLOAROMA_TOWN"
flags = ["FLAG_OBTAINED_FLOAROMA_MEADOW_WORKS_KEY", "FLAG_DEFEATED_FLOAROMA_MEADOW_GRUNTS", "FLAG_HIDE_FLOAROMA_TOWN_GRUNTS", "FLAG_FIRST_ARRIVAL_RAVAGED_PATH", "FLAG_FIRST_ARRIVAL_FLOAROMA_MEADOW"]
battles = 2
save = [
  'any(i["item"] == 438 and i["qty"] >= 1 for k, p in s["bag"].items() if k != "registered" for i in p)',  # ITEM_WORKS_KEY
  'any(i["item"] == 94 and i["qty"] >= 10 for k, p in s["bag"].items() if k != "registered" for i in p)',  # ITEM_HONEY x10
]

[expect.vars]
VAR_FLOAROMA_MEADOW_STATE = 1
VAR_VALLEY_WINDWORKS_STATE = 1
