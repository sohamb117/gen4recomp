[[step]]
do = "walk_to"
move = 3
x = 162
z = 641
note = "back west through Floaroma to the meadow entrance (events_floaroma_town warp 7) -> meadow (12,54)"

[[step]]
do = "wait_map"
map = "MAP_HEADER_FLOAROMA_MEADOW"

[[step]]
