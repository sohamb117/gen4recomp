lab = "lab.recipe"
boost = "boost.recipe"

[run]
frames = 29600

[[step]]
do = "walk_to"
move = 3
x = 171
z = 705
max = 8000
note = "north exit (grunts gone at VAR_JUBILIFE_CITY_STATE 4) -> Route 204 South -> Ravaged Path door (events_route_204_south warp 0); Sarah (172,725), Tyler (167,722), Samantha (171,712) may engage"

[[step]]
do = "wait_map"
map = "MAP_HEADER_RAVAGED_PATH"

[[step]]
do = "walk_to"
move = 3
x = 21
z = 42
face = "right"
interact = true
note = "the three rows east (z 42..44) are closed by rocks (22,42), (22,43), (23,44) and the Potion ball (22,44) (tests/e2e/tools/pt_map.py MAP_HEADER_RAVAGED_PATH); face rock 3 (22,42)"

[[step]]
do = "advance_text"
note = "'use Rock Smash?' A = YES (field move needs BADGE_ID_COAL: src/field_move_tasks.c:545); the rock breaks (may start a wild battle, fought by the next walk)"

[[step]]
do = "walk_to"
move = 3
x = 28
z = 44
note = "Ravaged Path exit (warp 1) -> Route 204 North (180,698)"

[[step]]
do = "wait_map"
map = "MAP_HEADER_ROUTE_204_NORTH"

[[step]]
do = "walk_to"
move = 3
x = 211
z = 660
max = 8000
