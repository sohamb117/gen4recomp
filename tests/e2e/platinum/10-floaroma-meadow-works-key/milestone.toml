priority = "P0"
estimate = 19685
refs = [
  "scripts_ravaged_path.s:8",
  "scripts_route_205_south.s:129-131",
  "scripts_floaroma_meadow.s:16",
  "scripts_floaroma_meadow.s:22",
  "scripts_floaroma_meadow.s:26",
  "scripts_floaroma_meadow.s:30",
  "scripts_floaroma_meadow.s:107-109",
  "scripts_floaroma_meadow.s:112",
  "scripts_floaroma_meadow.s:117-127",
  "scripts_floaroma_meadow.s:134",
  "src/field_move_tasks.c:545",
  "events_ravaged_path (27 Rock Smash rocks; warps (19,50), (28,44))",
  "events_route_204_south (warp 0 (171,705))",
  "events_route_205_south (coords (211,659..664), (217,653); grunts (216,653)/(218,653))",
  "events_floaroma_town (warps 7-8 (162..163,641) meadow)",
  "events_floaroma_meadow (coord (12..13,48); warps (12..13,54))",
  "TRAINER_GALACTIC_GRUNT_FLOAROMA_MEADOW_1 (296)",
  "TRAINER_GALACTIC_GRUNT_FLOAROMA_MEADOW_2 (297)",
  "TRAINER_LASS_SARAH (12)",
  "TRAINER_YOUNGSTER_TYLER (10)",
  "TRAINER_LASS_SAMANTHA (11)",
  "TRAINER_AROMA_LADY_TAYLOR (14)",
  "TRAINER_BUG_CATCHER_BRANDON (13)",
  "TRAINER_TWINS_LIV_AND_LIZ (15)",
]
notes = "Liv & Liz (Route 204 N) is a true double with a party of one. boost.recipe teaches Rock Smash (HM06, 06) and Bite."

[start]
