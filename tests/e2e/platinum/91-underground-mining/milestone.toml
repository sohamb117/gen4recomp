# Underground mining: enter from Oreburgh with the kit, the lab hook starts the mining minigame
# (same task the wall-sparkle confirm starts). Board RNG is seeded from PC_RTC + frame.
# Start: Oreburgh (0x12F,0x2F5) with a registered kit. End: UNDERGROUND (2), dig done.
title = "Underground: dig a wall"
status = "planned"
priority = "P1"
estimate = 6500
refs = [
  "src/underground/mining.c:1727-1729",
  "src/underground/mining.c:1735",
  "src/underground.c:601",
  "res/field/scripts/scripts_eterna_city_underground_man_house.s:192-194",
  "pc/src/pc_lab.c:1972-1974",
  "pc/src/pc_lab.c:2040-2055",
  "pc/tests/pc_corpus.py:354-357",
  "pc/tests/pc_corpus.py:497-504",
  "pc/replays/lab-poketch-tap.txt",
  "pc/src/pc_lab.c:950-990",
  "pc/src/pc_lab.c:1958-2062",
  "pc/tests/pc_corpus.py:495-513",
  "pc/tests/corpus/ug-enter.recipe",
  "pc/tests/corpus/ug-enter.spec",
  "pc/replays/lab-ug-enter.txt",
  "src/item_use_functions.c:365-367",
  "src/underground/comm_manager.c:82",
]

[start]
recipe = "start.recipe"

[run]
frames = 9800
# lab underground hook `mine` (pc_lab.c:1958-2062; corpus ug-enter.spec `underground: mine`)
env = { PC_LAB_UNDERGROUND = "mine", PC_LAB_UNDERGROUND_AT = "4900" }
clock = "2009-03-22 21:00:00"

[[step]]
do = "press"
keys = "Y"
hold = 24
note = "use the registered Explorer Kit"

[[step]]
do = "press"
keys = "A"
hold = 24
gap = 176
times = 9
note = "comms confirm + the game's forced save (lab-ug-enter.txt: A every 200 frames from 3800)"

[[step]]
do = "wait_map"
map = 2
max = 3000
note = "the hook sets FLAG_HAS_SEEN_UNDERGROUND_ROARK_INTRO after arrival (solo first-visit path, pc_lab.c:1958-1992)"

[[step]]
do = "wait_frames"
n = 300
note = "mining task started by the hook (Mining_StartGameForLab)"
shot = "mining-board"
# PHASE2: hammer/pick are touch input; a tap script that hits one cell repeatedly sets the flag but
# may dig nothing (wall collapse ends early). Record taps (format as lab-poketch-tap.txt), then B/A out.

[expect]
map = 2
flags = ["FLAG_DIGGING_FOR_FOSSILS"]
log = ['pc_lab: mining started at frame \d+']
# PHASE2: reader-ext sphere bag `sphere: filled=N` > 0 if a sphere was dug (pc_save, pc_corpus.py:354-357)
# IN SITU (measured after the solo-Underground port fix, see tests/gameplay/scenarios/7-underground.scn): the lab
# hook is no longer needed. Y, advance_text (comms, save YES, overwrite YES, the hole, Roark's intro) leaves the
# player free at (168,375); field_ready now reads 1 in the Underground. tools/pt_ugspots.py lists the mining spots
# (seeded from the save's Underground seed, so stable per recipe): for this recipe the nearest is the wall
# (180,401), so walk_to x=181 z=401 face="left" interact=true, A = YES ('The wall is bulging slightly'), then A x7
# through 'Something pinged... 3 confirmed', '...' and the first-dig tutorial. Taps: board cells x<208, y>=32
# (16 px); the sidebar hammer (x 214-252, y 43-110) costs the wall 8, the pickaxe (y 114-174) 4
# (mining.c Mining_MainGameLoop). A blind row sweep with the hammer collapses the wall by row 88 with a red sphere
# half uncovered: next, tap only the cells around the items (the shine) with the pickaxe. Expect then
# FLAG_DIGGING_FOR_FOSSILS and np_save4 `underground` spheres/treasures non-empty after GO UP (X, DOWN x5, A).
