# Underground mining, in situ: the Explorer Kit on Y, the nearest wall spot, the first dig (3 items, no rocks) dug
# out completely by touch, GO UP. The mining spots come from the save's Underground seed (tools/pt_ugspots.py); the
# board is generated from the mining RNG when the dig starts, so it is the same in every run with the same inputs:
# tools/pt_mine.py reads it out of guest memory and plans the taps.
# Start: Oreburgh (0x12F,0x2F5) with a registered kit. End: Oreburgh, three spheres in the Underground bag.
title = "Underground: dig a wall"
priority = "P1"
estimate = 6500
refs = [
  "src/underground/mining.c:2257-2329",
  "src/underground/mining.c:2567-2599",
  "src/underground/mining.c:2711-2785",
  "src/underground/mining.c:1904-1918",
  "src/underground/mining.c:1727-1729",
  "src/underground/mining.c:1735",
  "src/underground.c:601",
  "res/field/scripts/scripts_eterna_city_underground_man_house.s:192-194",
  "pc/src/pc_lab.c:1972-1974",
  "pc/src/pc_lab.c:2040-2055",
  "pc/tests/pc_corpus.py:354-357",
  "pc/tests/pc_corpus.py:497-504",
  "pc/replays/lab-poketch-tap.txt",
  "pc/src/pc_lab.c:950-990",
  "pc/src/pc_lab.c:1958-2062",
  "pc/tests/pc_corpus.py:495-513",
  "pc/tests/corpus/ug-enter.recipe",
  "pc/tests/corpus/ug-enter.spec",
  "pc/replays/lab-ug-enter.txt",
  "src/item_use_functions.c:365-367",
  "src/underground/comm_manager.c:82",
]

[start]
recipe = "start.recipe"

[run]
frames = 12000
clock = "2009-03-22 21:00:00"

[[step]]
do = "press"
keys = "Y"
hold = 24
note = "use the registered Explorer Kit"

[[step]]
do = "advance_text"
max = 5000
note = "'DS Wireless Communications', the save YES, overwrite YES, the hole, Roark's first-visit intro; the player is left free at (168,375)"
shot = "underground"

[[step]]
do = "walk_to"
x = 181
z = 401
face = "left"
interact = true
note = "the nearest mining spot (180,401) (tools/pt_ugspots.py): 'The wall is bulging slightly'"

[[step]]
do = "press"
keys = "A"
gap = 40
times = 12
note = "YES, 'Something pinged...', '3 confirmed', the first-dig tutorial to 'You can do it! Good luck, youngster!' (11 A; A does nothing on the board)"
shot = "mining-board"

[[step]]
do = "tap"
x = 40
y = 152
gap = 12
times = 2
note = "the board read with tools/pt_mine.py (the first dig: 3 items, no rocks): a small green sphere at cells (2,7)-(3,8), a large red sphere at (10,6)-(12,8), a small red sphere at (4,3)-(5,4); its plan clears them in 16 taps (2 with the hammer), the wall left at 124 of 196. Cell (c,r) is tapped at (16c+8, 16(r+2)+8)"

[[step]]
do = "tap"
x = 56
y = 168
gap = 12
times = 2

[[step]]
do = "tap"
x = 40
y = 168
gap = 12

