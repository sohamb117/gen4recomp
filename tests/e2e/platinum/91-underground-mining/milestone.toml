# np_save4 underground: the three spheres (MINING_SMALL_GREEN_SPHERE, MINING_LARGE_RED_SPHERE, MINING_SMALL_RED_SPHERE)
save = ['s["underground"]["has_mined"]', 'len(s["underground"]["spheres"]) >= 3']
