# Battle Castle single set: GARCHOMP, METAGROSS, SALAMENCE (Lv 50 in the Castle), BATTLE from the SELF / OPPONENT /
# BATTLE menu before each of the seven battles, no CP spent. Start: BATTLE_CASTLE (6,9) facing the single attendant
# (5,9). End: Castle lobby.
