title = "Pal Park: gate refuses without a GBA cartridge"
priority = "P2"
estimate = 1823
refs = [
  "res/field/scripts/scripts_pal_park_lobby.s:111",
  "res/field/scripts/scripts_pal_park_lobby.s:172-176",
  "res/field/scripts/scripts_pal_park_lobby.s:347",
  "res/field/scripts/scripts_pal_park_lobby.s:364-383",
  "res/field/scripts/scripts_pal_park_lobby.s:382",
