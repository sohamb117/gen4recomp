# Game Corner: buy 50 coins from the clerk (1000 money), then play slot machine 0 once.
# Start: GAME_CORNER (11,6) facing machine 0 at (12,6). End: same tile, money -1000, coins changed from 50.
title = "Game Corner: play the slots"
priority = "P2"
estimate = 3183
refs = [
  "res/field/events/events_veilstone_city.json",
  "res/field/events/events_game_corner.json",
  "res/field/scripts/scripts_veilstone_city_southeast_house.s:11-60",
  "res/field/scripts/scripts_game_corner.s:80-99",
  "res/field/scripts/scripts_game_corner.s:126-170",
  "src/scrcmd.c:5824-5830",
  "src/unk_0203D1B8.c:1535-1551",
  "src/unk_0203D1B8.c:1569-1600",
  "features/tools/np_save4.c:8",
  "features/tools/np_save4.c:348",
  "features/tools/np_save4.c:584-587",
  "generated/journal_location_events.txt:17",
]

[start]
recipe = "start.recipe"

[run]
frames = 4800
# pc-journal trace for the log expect (pc/src/pc_probe2d.c:262-267)
env = { PC_TRACE_JOURNAL = "1" }

[[step]]
do = "walk_to"
x = 2
z = 6
face = "up"
interact = true
note = "the coin clerk across the counter"

[[step]]
do = "press"
keys = "A"
times = 2
gap = 40
note = "greeting, then the coin menu"
shot = "coin-menu"

[[step]]
do = "press"
keys = "A"
gap = 150
note = "50 coins for 1000; the thanks takes no A until the coin jingle ends"
shot = "bought"

[[step]]
do = "press"
keys = "A"
times = 2
gap = 40
note = "the thanks, 'Did you want some game Coins?': the coin menu again"
shot = "menu-again"

[[step]]
do = "press"
keys = "DOWN"
times = 2
gap = 12

[[step]]
do = "press"
keys = "A"
note = "No thanks"

[[step]]
do = "advance_text"
max = 1200

[[step]]
do = "walk_to"
x = 11
z = 6
face = "right"
interact = true
note = "machine 0 bg event (12,6): Coin Case present -> ScrCmd_267 slot app"

[[step]]
do = "wait_frames"
n = 120
shot = "slots"

[[step]]
do = "press"
keys = "X"
gap = 40
note = "insert coins"

[[step]]
do = "press"
keys = "DOWN"
gap = 90
note = "lever: the reels spin"
shot = "spinning"

[[step]]
do = "press"
keys = "Y"
gap = 40
note = "stop reel 1"

[[step]]
do = "press"
keys = "B"
gap = 40
note = "stop reel 2"

[[step]]
do = "press"
keys = "A"
gap = 180
note = "stop reel 3, payout"
shot = "stopped"

[[step]]
do = "press"
keys = "START"
gap = 60
note = "leave the machine"

[[step]]
do = "advance_text"
max = 1500

[expect]
map = 136
position = [11, 6]
save = ['s["trainer"]["money"] == 19000', 's["trainer"]["coins"] != 50']
log = ['pc-journal: f=\d+ event=16 ']   # LOCATION_EVENT_GAME_CORNER
