# Legendary birds: Prof. Oak in the Eterna south house (shown after the Pal Park first visit)
# gives the Upgrade and activates MOLTRES/ZAPDOS/ARTICUNO roamers (lv60).
# Start: ETERNA_CITY_SOUTH_HOUSE (4,6) below Oak (4,5). End: same.
title = "Roamer: legendary birds from Prof. Oak"
priority = "P2"
estimate = 4155
refs = [
  "src/roaming_pokemon.c:199-213",
  "src/roaming_pokemon.c:322-356",
  "src/applications/poketch/marking_map/main.c:109-115",
  "src/applications/poketch/marking_map/main.c:311-321",
  "src/field_map_change_flags.c:48-52",
  "res/field/scripts/scripts_pal_park_lobby.s:347",
  "res/field/scripts/scripts_init_new_game.s:59",
  "res/field/scripts/scripts_eterna_city_south_house.s:7-40",
  "res/field/scripts/scripts_eterna_city_south_house.s:61-64",
  "src/roaming_pokemon.c:267-278",
  "pc/src/pc_lab.c:789-793",
]

[start]
recipe = "start.recipe"

[run]
frames = 6300

[[step]]
do = "press"
keys = "A"
note = "Prof. Oak (4,5)"

[[step]]
do = "advance_text"
max = 3000
note = "ITEM_UPGRADE (bag-full check), then the three roamers activate"
shot = "oak-birds"

[[step]]
do = "wait_field"

[[step]]
do = "wait_frames"
n = 90
note = "the Pokétch Marking Map (bottom screen) shows the active roamer's face on its route"
shot = "marking-map"

[[step]]
do = "dump"
expr = '[r["map"] for r in s["roamers"]["slots"]]'
note = "the roamers' maps (np_save4 roamers): placed on a random route at activation"

[[step]]
do = "walk_to"
x = 4
z = 8
note = "out (a warp: InitFlagsWarp moves no roamer, field_map_change_flags.c:55-77)"

[[step]]
do = "wait_map"
map = "MAP_HEADER_ETERNA_CITY"

[[step]]
do = "advance_text"
max = 3000

[[step]]
do = "walk_to"
x = 351
z = 533
note = "Eterna City's east edge: Route 211 West is a seamless neighbour"

[[step]]
do = "moves"
dirs = [["R", 1]]
note = "into Route 211 West: a seamless map change moves every roamer (field_map_change_flags.c:48-52)"

[[step]]
do = "wait_frames"
n = 30
shot = "roamed-1"

[[step]]
do = "dump"
expr = '[r["map"] for r in s["roamers"]["slots"]]'
note = "after map change 1"

[[step]]
do = "moves"
dirs = [["L", 1]]
note = "back into Eterna City: another"

[[step]]
do = "wait_frames"
n = 30
shot = "roamed-2"

[[step]]
do = "dump"
expr = '[r["map"] for r in s["roamers"]["slots"]]'
note = "after map change 2"

[[step]]
do = "moves"
dirs = [["R", 1]]
note = "Route 211 West again"

[[step]]
do = "wait_frames"
n = 30
shot = "roamed-3"

[[step]]
do = "dump"
expr = '[r["map"] for r in s["roamers"]["slots"]]'
note = "after map change 3"

[expect]
map = "MAP_HEADER_ROUTE_211_WEST"
flags = ["FLAG_ACTIVATED_ROAMING_LEGENDARY_BIRDS", "FLAG_RECEIVED_ETERNA_CITY_SOUTH_HOUSE_UPGRADE"]
save = ['any(i["item"] == 252 for p in s["bag"].values() for i in p)', '[r["species"] for r in s["roamers"]["slots"] if r["active"]] == [146, 145, 144]']   # ITEM_UPGRADE; Moltres, Zapdos, Articuno
# the roamers' maps change between the dumps: they roam (roaming_pokemon.c RoamingPokemon_MoveAllLocations)
log = ['dump: [^\n]* = (\[[\d, ]+\])\n[\s\S]*dump: [^\n]* = (?!\1)\[']
