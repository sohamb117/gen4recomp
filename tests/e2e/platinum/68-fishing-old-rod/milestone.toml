# Old Rod: fish a Magikarp: cast the registered Old Rod at the Route 205 South river, hook the bite, win the battle.
# Start: ROUTE_205_SOUTH (180,604) on the river bank facing the water. End: same tile after the wild battle.
# The hook press is frame-exact for this save + clock (bite window measured with PC_TRACE_FISH).
title = "Old Rod: fish a Magikarp"
priority = "P2"
estimate = 4151
refs = [
  "res/field/scripts/scripts_route_218_gate_to_jubilife_city.s:12-25",
  "res/field/scripts/scripts_route_218_gate_to_jubilife_city.s:60",
  "src/item_use_functions.c:819-851",
  "src/overlay006/wild_encounters.c:380-398",
  "src/overlay006/wild_encounters.c:1332-1333",
  "src/overlay005/fishing.c:252-256",
  "src/overlay005/fishing.c:261-268",
  "src/overlay005/fishing.c:574-578",
  "res/field/encounters/encounters_route_205_south.json",
  "res/field/encounters/encounters_fuego_ironworks_outside.json",
  "pc/tests/corpus/rod-old.recipe",
  "pc/tests/corpus/rod-old.spec",
  "pc/replays/lab-fish-old.txt",
  "pc/tests/pc_corpus.py:422-436",
]

[start]
recipe = "start.recipe"

[run]
frames = 6300
# pc-fish trace for the log expect (pc/src/pc_probe2d.c:305)
env = { PC_TRACE_FISH = "1" }
clock = "2009-03-22 21:00:00"

[[step]]
do = "fish"
note = "Y casts the registered Old Rod; A at the trace's bite line hooks (bots.py fish); no-nibble casts are closed with B and recast"
shot = "hooked"

[[step]]
do = "auto_battle"
snap = true
note = "GARCHOMP Dragon Claw one-shots the hooked Pokemon"

[[step]]
do = "advance_text"
shot = "after"

[expect]
map = 347
position = [180, 604]
battles = 1
# wild species MAGIKARP (old_rod_rate 25, 5x MAGIKARP): dex seen grows by one (party GARCHOMP is the only prior entry)
save = ['s["pokedex"]["seen"] >= 2']
log = ['pc-fish: f=\d+ rod=\d+ bite', 'pc-fish: f=\d+ rod=\d+ caught']
