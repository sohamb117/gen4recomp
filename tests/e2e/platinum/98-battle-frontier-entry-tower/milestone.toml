# game records (generated/game_records.txt; np_save4 game_records): RECORD_BATTLE_TOWER_CHALLENGES (15) and
# RECORD_BATTLE_TOWER_VICTORIES (29) count the set, RECORD_BATTLE_POINTS_RECEIVED (68) the BP
