# Heatran in Stark Mountain Room 3 (post-game, after the Charon event and the Buck talk):
# A -> StartLegendaryBattle HEATRAN 50, defeat it.
# Start: STARK_MOUNTAIN_ROOM_3 (7,7) below Heatran (7,6). End: same, room state 2.
title = "Legendary: Heatran at Stark Mountain"
priority = "P2"
estimate = 3473
refs = [
  "res/field/scripts/scripts_stark_mountain_room_3.s:15-18",
  "res/field/scripts/scripts_stark_mountain_room_3.s:20-32",
  "res/field/scripts/scripts_stark_mountain_room_3.s:69-90",
  "res/field/scripts/scripts_stark_mountain_room_3.s:71-78",
  "res/field/scripts/scripts_stark_mountain_room_3.s:85-86",
  "res/field/scripts/scripts_stark_mountain_room_3.s:117",
  "res/field/scripts/scripts_init_stark_mountain_room_3.s:10",
  "res/field/scripts/scripts_battleground.s:118",
  "pc/src/pc_lab.c:1337-1345",
  "pc/src/pc_lab.c:1373-1375",
  "pc/tests/corpus/battle-legendary.recipe",
  "pc/tests/corpus/battle-legendary.spec",
  "pc/replays/lab-battle.txt",
  "pc/src/pc_lab.c:798-800",
  "src/clear_game.c:204-206",
  "src/scrcmd_system_flags.c:151",
  "src/system_flags.c:69-71",
]

[start]
recipe = "start.recipe"

# PHASE2: battle-lab variant: env PC_LAB_BATTLE="legendary 485 50 0" PC_LAB_BATTLE_AT=2600 (pc_lab.c:1337-1345,1373-1375; input pc/replays/lab-battle.txt) proves `resultMask=1` in the log (); a variant run, so it is not set in this dir's [run] env (it would start a battle mid-flow).
[run]
frames = 5300

[[step]]
do = "press"
keys = "A"
note = "Heatran (7,6)"

[[step]]
do = "advance_text"
max = 1500
note = "preview cry, then StartLegendaryBattle"

[[step]]
do = "wait_battle"
max = 1500
shot = "legendary"

[[step]]
do = "auto_battle"
snap = true
note = "A-only never throws a ball: the result is 'defeated', never caught"

[[step]]
do = "advance_text"
max = 1500

[[step]]
do = "wait_field"
shot = "after"

[expect]
map = 265
battles = 1
vars = { VAR_STARK_MOUNTAIN_ROOM_3_STATE = 2 }
flags = ["FLAG_BATTLED_STARK_MOUNTAIN_ROOM_3_HEATRAN", "FLAG_UNLOCKED_VS_SEEKER_LVL_5"]
