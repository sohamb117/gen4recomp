# SoulSilver only: proves Ho-Oh post-game. SS's Rainbow Wing comes from the Pewter old man (FLAG_UNK_093, ClearFlag
# FLAG_HIDE_BELL_TOWER_HO_OH); the Bell Tower barrier monk (Fog Badge), the ten floors and Ho-Oh (lv70 in SS) on the roof.
# Start: 96-pewter-brock's end (Pewter, wing in the bag) -> end: MAP_BELL_TOWER_ROOF (15,17), FLAG_CAUGHT_HO_OH.
title = "SoulSilver: Rainbow Wing and Ho-Oh"
priority = "P1"
version = "soulsilver"
estimate = 19517
refs = [
  "zone_event 048_T03 object 0 obj_T03_gsoldman1 (1069,94) -> 000; scr_seq_0750_T03.s:44-79 (version != 7 = SS: ITEM_RAINBOW_WING (483), FLAG_UNK_093, ClearFlag FLAG_HIDE_BELL_TOWER_HO_OH, SetFlag FLAG_HIDE_BELL_TOWER_SUMMIT_KIMONO_GIRLS)",
  "scr_seq_0034_D23R0106.s:84-88 (SS's story wing is the Silver Wing; the Rainbow Wing is post-game only)",
  "zone_event 080_T27R0201 object 0 obj_T27R0201_bozu (15,7) -> 000; scr_seq_0926_T27R0201.s:22-64 (CheckBadge BADGE_FOG: steps aside)",
  "Bell Tower floors/warps/ladders: as in heartgold/31-bell-tower-ho-oh refs (zone_event 108_D17R0101 .. 312_D17R0112)",
  "zone_event 311_D17R0110 object 5 obj_D17R0110_hou_obj01 (15,16) -> 000; scr_seq_0021_D17R0110.s:22,54-102 (FLAG_HIDE_BELL_TOWER_HO_OH; WildBattle 250 at 70 in SS; caught -> FLAG_CAUGHT_HO_OH include/constants/flags.h:297)",
  "scr_seq_0825_T10R0701.s:111-123 (Hall of Fame re-shows uncaught Ho-Oh/Lugia)",
]
notes = "Gates: post-game Kanto (90) to Pewter (96), whose old man gives SoulSilver the Rainbow Wing (FLAG_UNK_093, ClearFlag FLAG_HIDE_BELL_TOWER_HO_OH). Pewter's Kanto fly map reaches Johto through the Indigo Plateau. The Bell Tower is heartgold/31's walk (the barrier monk's Fog Badge, the ladders, the 7F-9F warp panels); 1F's coord (VAR_UNK_40F3 0) plays the Rainbow Wing's glow. The roof's Clear Bell coord does not fire (Lugia's VAR_UNK_40FA 2): Ho-Oh (object 5, (15,16)) already stands there. WildBattle SPECIES_HO_OH 70 is caught with the Master Ball the chain never threw (Elm's, 29), as in heartgold/100: BAG, POKE BALLS, the Master Ball, USE; B answers the nickname, and HO-OH goes to BOX 1 (the party is full). Measured: 19517 frames; the sheet shows HO-OH on the roof, HO-OH lv70's action menu, 'Gotcha! HO-OH was caught!', the empty roof."

