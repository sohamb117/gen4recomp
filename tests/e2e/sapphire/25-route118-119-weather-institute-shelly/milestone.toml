interact = true
note = "right of Shelly (4,6); grunts (15,6) sight 4 and (10,8) sight 2 fought on the way"

[[step]]
do = "advance_text"

[[step]]
do = "auto_battle"
snap = true
note = "TRAINER_SHELLY_1 (32): CARVANHA 28, MIGHTYENA 28 (Route119_WeatherInstitute_2F/scripts.inc:34)"

[[step]]
do = "advance_text"
note = "WEATHER_INSTITUTE_STATE 1, the team leaves; the scientist gives Castform (:38-69)"

[[step]]
do = "walk_to"
x = 17
z = 1
note = "2F stairs -> 1F"

[[step]]
do = "wait_map"
map = "MAP_ROUTE119_WEATHER_INSTITUTE_1F"

[[step]]
