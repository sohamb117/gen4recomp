flags = ["FLAG_BADGE01_GET", "FLAG_BADGE02_GET", "FLAG_BADGE03_GET", "FLAG_BADGE04_GET", "FLAG_BADGE05_GET", "FLAG_RECEIVED_CASTFORM", "FLAG_HIDE_EVIL_TEAM_WEATHER_INSTITUTE", "FLAG_HIDE_WEATHER_INSTITUTE_WORKERS_2F"]
