# Proves Surf (badge 5) across Route 118 from Mauville, Steven's Route 118 scene, Route 119 north (river: Surf) to the
# Weather Institute: Aqua grunts, Shelly (TRAINER_WEATHER_INSTITUTE_GRUNT_5 = TRAINER_SHELLY_1 in Sapphire),
# VAR_WEATHER_INSTITUTE_STATE 1 and Castform.
# Start: Wally's house -> end: MAP_ROUTE119 outside the Weather Institute (6,33).
title = "Routes 118-119 and the Weather Institute: Shelly (Sapphire)"
priority = "P0"
version = "sapphire"
estimate = 37329
refs = [
  "data/maps/Route118/map.json coord_events (43..45,11) VAR_ROUTE118_STATE=0",
  "data/maps/Route118/scripts.inc:50-95 (Steven (object 19) scene, ROUTE118_STATE 1)",
  "data/maps/Route119/map.json warp_events[0] (6,32) -> WEATHER_INSTITUTE_1F (9,12)",
  "data/maps/Route119_WeatherInstitute_1F/scripts.inc:47-55 (grunts TRAINER_WEATHER_INSTITUTE_GRUNT_1/_2: (15,3) sight 3, (10,5) sight 2)",
  "data/maps/Route119_WeatherInstitute_2F/scripts.inc:23-36 (grunts _3/_4, admin object 3 (4,6) sight 0: TRAINER_WEATHER_INSTITUTE_GRUNT_5)",
  "data/maps/Route119_WeatherInstitute_2F/scripts.inc:38-69 (WEATHER_INSTITUTE_STATE 1, FLAG_HIDE_EVIL_TEAM_WEATHER_INSTITUTE; givemon SPECIES_CASTFORM 25, FLAG_RECEIVED_CASTFORM; no nickname prompt)",
  "data/maps/Route119/scripts.inc:25-38 (OnTransition WEATHER_INSTITUTE_STATE 1 -> workers downstairs, STATE 2)",
  "constants/version.inc (Sapphire: WEATHER_INSTITUTE_GRUNT_1..5 = TRAINER_GRUNT_16, _25, _17, _18, TRAINER_SHELLY_1)",
]
notes = "Sapphire's branch (Ruby: ../ruby/25-route118-119-weather-institute-courtney). Shelly: TRAINER_SHELLY_1 (32): CARVANHA 28, MIGHTYENA 28; grunts: TRAINER_GRUNT_16 (17): ZUBAT 27, POOCHYENA 27; TRAINER_GRUNT_25 (26): CARVANHA 28; TRAINER_GRUNT_17 (18): POOCHYENA 27, CARVANHA 27; TRAINER_GRUNT_18 (19): POOCHYENA 26, ZUBAT 26, CARVANHA 26 (Carvanha's Rough Skin and Water resistance: Ground moves carry it). Back to Mauville the way 24 came (Petalburg Woods, Rustboro, the tunnel, Route 117): with Surf the static route prefers Route 103 -> Route 110's Cycling Road gates, which want the bike ridden [INFERENCE], so the walk to Mauville is given without surf. Castform (lv25, Mystic Water) joins the party as slot 1."

[start]
from = "prev"
boost = "boost.recipe"

[run]
frames = 56000

[[step]]
do = "walk_to"
x = 39
z = 10
map = "MAP_MAUVILLE_CITY"
note = "back to Mauville's east edge by the 24 walk in reverse"

[[step]]
do = "heal"
x = 22
z = 5
note = "Mauville Pokemon Center (MauvilleCity/map.json warp_events[1] (22,5)): the walk back fights Route 104/116/117 trainers, and without HP and PP back a first run whited out on Route 119 before the Institute"

[[step]]
do = "walk_to"
x = 44
z = 12
map = "MAP_ROUTE118"
surf = true
note = "Route 118 east across the inlet (Surf), the tile below the Steven trigger row"

[[step]]
do = "walk_to"
x = 44
z = 11
on_text = "stop"
note = "Steven trigger (43..45,11) ROUTE118_STATE 0 (Route118/scripts.inc:50-95)"

[[step]]
do = "advance_text"
note = "Steven scene, ROUTE118_STATE 1"

[[step]]
do = "walk_to"
x = 6
z = 33
map = "MAP_ROUTE119"
surf = true
note = "north on Route 119 to the Weather Institute door"

[[step]]
do = "walk_to"
x = 6
z = 32
note = "Weather Institute door (Route 119 warp 0) -> WEATHER_INSTITUTE_1F (9,12)"

[[step]]
do = "wait_map"
map = "MAP_ROUTE119_WEATHER_INSTITUTE_1F"

[[step]]
do = "walk_to"
x = 17
z = 1
note = "1F stairs (warp 2) -> 2F (17,1); grunts (15,3) and (10,5) fought on the way"

[[step]]
do = "wait_map"
map = "MAP_ROUTE119_WEATHER_INSTITUTE_2F"

[[step]]
