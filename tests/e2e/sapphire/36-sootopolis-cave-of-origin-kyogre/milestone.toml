# Proves Dive into Sootopolis (Route 126), Steven and Wallace's scene (coord (25,6) VAR_SOOTOPOLIS_STATE 1 -> 2), the
# Cave of Origin floors, HM07 Waterfall from B3F's item ball and the legend at B4F (coord (9,13) VAR_CAVE_OF_ORIGIN_B4F_STATE 0):
# FLAG_LEGENDARY_BATTLE_COMPLETED.
# Start: Route 128 -> end: MAP_CAVE_OF_ORIGIN_B4F.
title = "Sootopolis and the Cave of Origin: Kyogre (Sapphire)"
priority = "P0"
version = "sapphire"
estimate = 21654
refs = [
  "data/maps/SootopolisCity/map.json coord_events (25,6) VAR_SOOTOPOLIS_STATE=1",
  "data/maps/SootopolisCity/scripts.inc:200-282 (LeadPlayerCaveOfOrigin; .ifdef SAPPHIRE texts; SOOTOPOLIS_STATE 2)",
  "data/maps/SootopolisCity/map.json warp_events[3] (31,16) -> CAVE_OF_ORIGIN_ENTRANCE",
  "data/maps/CaveOfOrigin_B3F/map.json object_events[0] ITEM_BALL (6,5) -> data/item_ball_scripts.inc:477-479 (ITEM_HM07_WATERFALL)",
  "data/maps/CaveOfOrigin_B4F/map.json coord_events (9,13); data/maps/CaveOfOrigin_B4F/scripts.inc (ScrSpecial_StartGroudonKyogreBattle; FLAG_LEGENDARY_BATTLE_COMPLETED)",
  "constants/version.inc (SPECIES_GROUDON_OR_KYOGRE: Ruby GROUDON, Sapphire KYOGRE)",
  "src/battle_setup.c:598-610 (ScrSpecial_StartGroudonKyogreBattle)",
]
notes = "Sapphire branch (other: ../ruby/36-sootopolis-cave-of-origin-groudon). Kyogre lv45 [INFERENCE: static_pokemon level]; auto_battle knocks it out (the flag is set either way) - catching it would need a ball-throw bot [open question]. The cave (static model: B4F (9,13) is reached from B3F (12,6)) is entered after the Sootopolis scene; Waterfall is found on B3F (R/S have no Wallace HM gift). Sootopolis is reached by Dive from Route 126 (walk_to dive = true)."

[start]
from = "prev"

[run]
frames = 32500


[[step]]
do = "walk_to"
x = 25
z = 7
map = "MAP_SOOTOPOLIS_CITY"
dive = true
on_battle = "flee"
max = 20000
note = "Route 128 west to Route 126, Dive (Route126 map.json dive connection -> MAP_UNDERWATER2), its water door (45,65) -> UNDERWATER_SOOTOPOLIS_CITY, surface in the crater (setdivewarp MAP_SOOTOPOLIS_CITY 29,53: Underwater_SootopolisCity/scripts.inc:5-6), Surf to the north shore"

[[step]]
do = "walk_to"
x = 25
z = 6
on_text = "stop"
note = "coord (25,6) SOOTOPOLIS_STATE 1 -> Steven leads to Wallace (SootopolisCity/scripts.inc:200-282)"

[[step]]
do = "advance_text"

[[step]]
do = "walk_to"
x = 6
z = 6
map = "MAP_CAVE_OF_ORIGIN_B3F"
face = "up"
interact = true
note = "through the cave floors to B3F, below the HM07 item ball (6,5)"

[[step]]
do = "advance_text"
note = "ITEM_HM07_WATERFALL"

[[step]]
do = "walk_to"
x = 9
z = 13
map = "MAP_CAVE_OF_ORIGIN_B4F"
on_text = "stop"
note = "B3F (12,6) -> B4F; coord (9,13) CAVE_OF_ORIGIN_B4F_STATE 0"

[[step]]
do = "advance_text"

[[step]]
do = "auto_battle"
snap = true
note = "wild KYOGRE (BATTLE_TYPE_KYOGRE_GROUDON)"

[[step]]
do = "advance_text"
shot = "legend"

[expect]
map = "MAP_CAVE_OF_ORIGIN_B4F"
badges = 7
flags = ["FLAG_BADGE01_GET", "FLAG_BADGE02_GET", "FLAG_BADGE03_GET", "FLAG_BADGE04_GET", "FLAG_BADGE05_GET", "FLAG_BADGE06_GET", "FLAG_BADGE07_GET", "FLAG_LEGENDARY_BATTLE_COMPLETED", "FLAG_ITEM_CAVE_OF_ORIGIN_B3F_1"]
battles = 1

[expect.vars]
VAR_SOOTOPOLIS_STATE = 2
