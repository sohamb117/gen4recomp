# the submarine dock (TRAINER_HIDEOUT_B2F_GRUNT_1 = TRAINER_MATT_1 in Sapphire): FLAG_EVIL_TEAM_ESCAPED_IN_SUBMARINE.
# Start: Slateport outside the harbor -> end: MAP_AQUA_HIDEOUT_B2F by the dock.
