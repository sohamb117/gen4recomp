badges = 3
flags = ["FLAG_BADGE01_GET", "FLAG_BADGE02_GET", "FLAG_BADGE03_GET", "FLAG_DEFEATED_EVIL_TEAM_MT_CHIMNEY", "FLAG_HIDE_EVIL_TEAM_MT_CHIMNEY", "FLAG_HIDE_OTHER_TEAM_MT_CHIMNEY", "FLAG_HIDE_PROF_COSMO_METEOR_FALLS"]
