# Proves the way back to Route 112's south half (Route 113 -> Route 112 north -> Fiery Path -> Route 112 south), the
# cable car (attendant YES), Mt. Chimney's Aqua admin/grunt and Archie (TRAINER_MT_CHIMNEY_GRUNT_3 = TRAINER_ARCHIE_3 in
# Sapphire): FLAG_DEFEATED_EVIL_TEAM_MT_CHIMNEY.
# Start: Route 114 (8,64) -> end: MAP_MT_CHIMNEY by the meteorite machine.
title = "Cable car to Mt. Chimney: Matt and Archie (Sapphire)"
priority = "P0"
version = "sapphire"
estimate = 29491
refs = [
  "data/maps/Route112/map.json warp_events[5] (22,10) -> FIERY_PATH (26,4), [0] (28,27) -> ROUTE112_CABLE_CAR_STATION",
  "data/maps/Route112_CableCarStation/scripts.inc:32-55 (attendant MSGBOX_YESNO -> CABLE_CAR_STATION_STATE 1, special CableCarWarp, special CableCar)",
  "data/maps/MtChimney_CableCarStation/map.json warp_events[0] (6,11) -> MT_CHIMNEY (17,36)",
  "data/maps/MtChimney/map.json object_events[1] leader VAR_6 (13,6), [2] admin (12,11) sight 2, [21] grunt (9,15) sight 3",
  "data/maps/MtChimney/scripts.inc:331-349 (admin/grunt: TRAINER_MT_CHIMNEY_GRUNT_1/_2)",
  "data/scripts/magma_chimney.inc:29-90 (leader: trainerbattle_no_intro TRAINER_MT_CHIMNEY_GRUNT_3; FLAG_HIDE_EVIL_TEAM_MT_CHIMNEY, FLAG_HIDE_OTHER_TEAM_MT_CHIMNEY, FLAG_DEFEATED_EVIL_TEAM_MT_CHIMNEY, Cozmo back home)",
  "constants/version.inc (Sapphire: MT_CHIMNEY_GRUNT_1 = TRAINER_MATT_2, _2 = TRAINER_GRUNT_13, _3 = TRAINER_ARCHIE_3)",
]
notes = "Sapphire's branch of the Mt. Chimney scene (Ruby: ../ruby/21-cable-car-mt-chimney-maxie). Archie: TRAINER_ARCHIE_3 (35): MIGHTYENA 24, GOLBAT 24, SHARPEDO 25 (Sharpedo is Water/Dark: Water and Ground are neutral on it, so the boost's level carries it). Matt (12,11) sight 2: TRAINER_MATT_2 (31): CARVANHA 20, POOCHYENA 20, CARVANHA 20; grunt (9,15) sight 3: TRAINER_GRUNT_13 (14): ZUBAT 20, POOCHYENA 20. The Magma leader (24,19) only talks. Same maps and scripts as Ruby; only the trainers and texts differ."

[start]
from = "prev"
boost = "boost.recipe"

[run]
frames = 44300

[[step]]
do = "walk_to"
x = 14
z = 8
map = "MAP_FALLARBOR_TOWN"
note = "Route 114 east into Fallarbor, below its Pokemon Center door"

[[step]]
do = "heal"
x = 14
z = 7
note = "Fallarbor Pokemon Center (FallarborTown/map.json warp_events[2] (14,7)): Route 113/114's trainers drained the lead's PP; Mt. Chimney's admin, grunt and leader come back to back (a first Sapphire run lost to Archie with Mud Shot spent)"

[[step]]
do = "walk_to"
x = 22
z = 10
map = "MAP_ROUTE112"
note = "Route 114 -> Fallarbor -> Route 113 -> Route 111 north -> Route 112 north half, Fiery Path north door (Route 112 warp 5)"

[[step]]
do = "wait_map"
map = "MAP_FIERY_PATH"

[[step]]
do = "walk_to"
x = 26
z = 36
note = "Fiery Path south exit (warp 0) -> Route 112 (11,36)"

[[step]]
do = "wait_map"
map = "MAP_ROUTE112"

[[step]]
do = "walk_to"
x = 28
z = 27
note = "cable car station door (Route 112 warp 0) -> ROUTE112_CABLE_CAR_STATION (6,11); the grunts are gone (20)"

[[step]]
do = "wait_map"
map = "MAP_ROUTE112_CABLE_CAR_STATION"

[[step]]
do = "talk_to"
id = 1
note = "attendant (object 1 (6,6)) -> YES/NO (Route112_CableCarStation/scripts.inc:32-40)"

[[step]]
do = "menu"
choose = 0
