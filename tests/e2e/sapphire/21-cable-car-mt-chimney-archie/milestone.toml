note = "YES -> CABLE_CAR_STATION_STATE 1, special CableCar (:42-55)"

[[step]]
do = "advance_text"
map = "MAP_MT_CHIMNEY_CABLE_CAR_STATION"
max = 4000

[[step]]
do = "advance_text"
note = "the car docks and the player steps out"

[[step]]
do = "walk_to"
x = 6
z = 11
note = "station exit (warp 0) -> MT_CHIMNEY (17,36)"

[[step]]
do = "wait_map"
map = "MAP_MT_CHIMNEY"

[[step]]
do = "talk_to"
id = 2
shot = "archie"
note = "Archie (object 2 (13,6)); Matt (12,11) and the grunt (9,15) fought on the way"

[[step]]
do = "advance_text"

[[step]]
do = "auto_battle"
snap = true
note = "TRAINER_ARCHIE_3 (35): MIGHTYENA 24, GOLBAT 24, SHARPEDO 25 (magma_chimney.inc:48-49)"

[[step]]
do = "advance_text"
note = "Aqua leaves, Maxie thanks and leaves: FLAG_DEFEATED_EVIL_TEAM_MT_CHIMNEY (magma_chimney.inc:53-90)"

[expect]
