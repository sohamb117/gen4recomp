name: pokeweb-local
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pokeweb
      POSTGRES_USER: pokeweb
      POSTGRES_PASSWORD: ${NP_LOCAL_DB_PASSWORD:?Run scripts/local-up.sh first}
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - saves:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokeweb -d pokeweb"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build:
      context: ../../build/gcp-nativeplat
    environment:
      PGHOST: db
      PGDATABASE: pokeweb
      PGUSER: pokeweb
      PGPASSWORD: ${NP_LOCAL_DB_PASSWORD}
      COOKIE_SECURE: "false"
      APP_ORIGINS: http://127.0.0.1:8088,http://localhost:8088
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  saves:
